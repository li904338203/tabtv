# 三平台探针（TT-T-03，dev/05 V-1 / V-4）：手动触发。
# 构建 -tags probe 的应用，打开即进探针页，结果写 JSON 后进程自行退出，作为产物上传。
name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb ffmpeg \
            gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Windows 依赖
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: 前端（探针构建）
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @tabtv/web generate
        env:
          TABTV_PROBE: "1"
          NUXT_TELEMETRY_DISABLED: "1"
      - name: 构建探针应用
        run: wails build -tags probe -s
      - name: 运行探针（Linux）
        if: runner.os == 'Linux'
        run: timeout 240 xvfb-run -a ./build/bin/tabtv || true
        env:
          TABTV_PROBE_EXIT: "1"
          TABTV_PROBE_OUT: ${{ github.workspace }}/probe-result.json
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      - name: 运行探针（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TABTV_PROBE_EXIT = "1"
          $env:TABTV_PROBE_OUT = "$env:GITHUB_WORKSPACE\probe-result.json"
          $p = Start-Process -FilePath .\build\bin\tabtv.exe -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill() }
      - name: 结果
        if: always()
        shell: bash
        run: cat probe-result.json || echo "没有产出结果"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: probe-result.json
          if-no-files-found: warn
