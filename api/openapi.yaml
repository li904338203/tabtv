        refCount: { type: integer }
        references:
          type: array
          items: { $ref: '#/components/schemas/AdminAgentSkillReference' }
          description: 仅详情返回
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

