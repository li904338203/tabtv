  # ==================== 用户端营销接口（MKT-T-04；公开，不需要登录） ====================
  # SEEAITV_MARKETING_ENABLED=false 时这一组全部 404（用户端侧栏据此隐藏入口）。
  # 可见性 = 启用 ∧ (无开始 ∨ 开始 ≤ 现在) ∧ (无结束 ∨ 现在 < 结束)，服务端现算，判定只有一处（MKD-13）。
  /marketing/config:
    get:
      tags: [marketing]
      operationId: getMarketingConfig
      security: []
      description: |
        营销页的输入框配置与分类字典（MKT-D-03：前端不写死营销页有哪些槽）。**不需要登录**。

        - `slots`：未选技能时的场景默认槽位（商品必填 + 角色可选）；选了技能以技能的 `inputSlots` 为准。
        - `maxProductImages` / `maxVariants`：来自环境变量（MKD-16），前后端用同一个数。
        - `categories`：三类选项各自**启用的**分类，按 sort；三个键恒在（空数组不是缺键）。
        - `creativeModelFilters`：「按模型」筛选项 = 在投创意推荐过的 ∩ 当前可用视频模型
          （与用户端 `/models?resultType=video` 同一口径），派生、不手工维护（MKT-F-31）。
        - `available=false`（`unavailableReason=agent_disabled`）：Agent 总开关关着 ——
          营销页可以浏览，但发送必然失败，前端据此禁用发送并说明原因（B-5）。
      responses:
        '200':
          description: 营销配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingConfig' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/options:
    get:
      tags: [marketing]
      operationId: listMarketingOptions
      security: []
      description: |
        此刻在投的创意 / Hook / 风格。**模板墙与选项弹层是同一个接口**（MKD-7）。**不需要登录**。

        服务端筛选、游标分页（MKT-F-34），按 `(sort, id)` 升序；结束时间一过**立即不再返回**，
        未到开始时间的也不返回（现算，不靠作业）。
        ⚠️ 响应**没有 `prompt` 字段**（MKT-AC-06：片段只在服务端拼），也不下发媒体 ID ——
        封面与示例视频按 `code + 下标` 走下面两个公开端点。
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/MarketingKind' }
        - name: category
          in: query
          description: 分类 code；缺省 = 全部
          schema: { type: string }
        - name: model
          in: query
          description: 「按模型」筛选：只返回推荐了该模型的（取值见 config.creativeModelFilters）
          schema: { type: string }
        - name: q
          in: query
          description: 按名称 / 简介模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: 在投选项
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarketingOption' }
                  nextCursor: { type: string, nullable: true, description: 不透明游标；null = 没有下一页 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/options/{code}:
    get:
      tags: [marketing]
      operationId: getMarketingOption
      security: []
      description: |
        选项详情（详情抽屉，字段同列表项）。**不需要登录**。
        ⚠️ 不在投（停用 / 未开始 / 已结束）与不存在回**同一个 404**：区分开等于告诉对方「曾经有过这个活动」。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingOption' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/options/{code}/covers/{index}:
    get:
      tags: [marketing]
      operationId: marketingOptionCover
      security: []
      description: |
        选项封面公开取图（MKD-19），**不需要登录**。`index` 从 0 起，取值范围 `[0, coverCount)`。
        先按在投判定（与列表**同一个**判定），再输出字节；不在投、不存在、下标越界回**同一个 404**。

        ⚠️ 只按 `code + 下标` 取，不接受媒体 ID（公开取图不做归属校验）。
        ⚠️ 默认给缩略图（`w=320`）；响应带 `Cache-Control: public, max-age=300` ——
        缓存期就是下线后「撤不下来」的窗口（CD-61）。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: w
          in: query
          description: 缩略图宽度，只接受 160/320/640。
          schema: { type: integer, enum: [160, 320, 640] }
      responses:
        '200':
          description: 图片字节
          content:
            image/*: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/options/{code}/preview:
    get:
      tags: [marketing]
      operationId: marketingOptionPreview
      security: []
      description: |
        选项示例视频公开取流（MKD-19），**不需要登录**。判定同封面；没有示例视频（`hasPreview=false`）也回同一个 404。
        原样输出（不转码、不缩）；缓存头同封面。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 视频字节
          content:
            video/*: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 营销商品库（MKT-T-33；dev/05 §3.1；要登录 + 工作区闸） ====================
  # GET → view，其余 → edit（MKD-32）；仍受 SEEAITV_MARKETING_ENABLED 控制（关闭 → 404）。
  # 他人工作区 / 已删除 / 不存在一律同一个 404（MKT-AC-33）。
  /marketing/products:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [marketing]
      operationId: listMarketingProducts
      description: |
        本工作区未删除的商品（MKT-F-92）。服务端搜索 + 游标分页，不做客户端筛选。
        列表项**不回全部图片 ID**（详情才回）：网格只要主图与张数。
      parameters:
        - name: q
          in: query
          description: 按名称模糊匹配（`%` `_` 按字面量处理）
          schema: { type: string }
        - name: sort
          in: query
          description: 'updated（默认，最近更新在前）/ created（最近创建在前）/ name（名称升序，不区分大小写）'
          schema: { type: string, enum: [updated, created, name], default: updated }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 商品列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarketingProductSummary' }
                  nextCursor: { type: string, nullable: true, description: 不透明游标（与排序绑定，换排序要从第一页开始）；null = 没有下一页 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [marketing]
      operationId: createMarketingProduct
      description: |
        新建商品（MKT-F-93）。需要 edit 权限（只读成员 403）。
        校验**一次报完**（40001 + `details.issues[{field, code, message}]`，field 如 `name`、`imageMediaIds[2]`）：
        图片 1~`maxProductImages` 张、名称 1~30 字、卖点 / 描述 ≤ 300 字（按码点计）；
        每张图必须属于当前工作区、未删除，且按文件头识别为 PNG / JPEG / WEBP（GIF、视频、音频拒绝）。
        工作区未删除商品数已达上限（`SEEAITV_MARKETING_MAX_PRODUCTS`）→ 409 `CONFLICT` + `details{reason:"quota", max}`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketingProductInput' }
      responses:
        '201':
          description: 新建的商品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /marketing/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [marketing]
      operationId: getMarketingProduct
      description: 商品详情（含全部图片 ID，`[0]` 为主图）。他人工作区 / 已删除 / 不存在同一个 404。
      responses:
        '200':
          description: 商品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingProduct' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [marketing]
      operationId: updateMarketingProduct
      description: |
        整份更新，带 `version` 乐观锁（MKT-F-95）。校验同新建。
        版本不匹配 → 40902 + `details{currentVersion, currentUpdatedAt, currentEditorId, currentEditorName, bySelf}`
        （冲突说得出是谁改的，CD-58）。没传卖点 / 描述按空串存（整份更新）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarketingProductInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1, description: 读到的版本（乐观锁） }
      responses:
        '200':
          description: 更新后的商品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [marketing]
      operationId: deleteMarketingProduct
      description: |
        删除 = 软删（MKT-F-96、MKD-31）：从商品库消失；**已建的营销会话不受影响**（会话里是快照）。
        之后尽力删除它自有的上传图：仍被会话等引用的保留，未被引用的随之软删（结果不影响本接口的成功）。
        重复删除 404。
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 营销角色库与营销角色（MKT-T-34；dev/05 §3.1） ====================
  # 工作区角色 5 个 + adopt：要登录 + 工作区闸（GET → view，其余 → edit，MKD-32）。
  # 营销角色列表 / 图片 / 音频：**公开**（同选项封面），只认启用的；DTO 不含任何媒体 ID。
  # 全部受 SEEAITV_MARKETING_ENABLED 控制（关闭 → 404）。
  /marketing/characters:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [marketing]
      operationId: listMarketingCharacters
      description: |
        本工作区未删除的角色（MKT-F-101），含从营销角色添加来的副本（`source=preset`）。
        **不含**脚本角色资产（前端另取 `GET /script-assets?type=character`）。服务端搜索 + 游标分页。
      parameters:
        - name: q
          in: query
          description: 按名称模糊匹配（`%` `_` 按字面量处理）
          schema: { type: string }
        - name: sort
          in: query
          description: 'updated（默认）/ created / name（名称升序，不区分大小写）'
          schema: { type: string, enum: [updated, created, name], default: updated }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarketingCharacterSummary' }
                  nextCursor: { type: string, nullable: true, description: 不透明游标（与排序绑定）；null = 没有下一页 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [marketing]
      operationId: createMarketingCharacter
      description: |
        新建角色（MKT-F-103~105，`source=user`）。需要 edit 权限（只读成员 403）。
        校验**一次报完**（40001 + `details.issues[{field, code, message}]`）：图片 1~9 张（本工作区、PNG / JPEG / WEBP）、
        名称 1~50 字且不含 `@ < > / \ | : * ? ( ) （ ）`、形象 / 音色描述 ≤ 500 字（按码点计）；
        参考音频至多 1 段（单值），须为本工作区的音频文件。`source` / `sourcePresetId` / `sourcePresetVersion` 由服务端记录，
        请求里带了即 40001。
        同工作区未删除角色重名（不区分大小写）→ 409 `CONFLICT` + `details{field:"name", code:"duplicate"}`；
        数量已达上限（`SEEAITV_MARKETING_MAX_CHARACTERS`）→ 409 + `details{reason:"quota", max}`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketingCharacterInput' }
      responses:
        '201':
          description: 新建的角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCharacter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /marketing/characters/generate:
    post:
      tags: [marketing]
      operationId: generateMarketingCharacter
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: Idempotency-Key
          in: header
          required: false
          description: 真生成必填（缺失 400/40002）；dryRun 不需要。受理时加前缀 `mkchar:` 落库。
          schema: { type: string, maxLength: 121 }
      description: |
        生成角色（MKT-F-106~108、dev/05 MKD-28）：按形象描述（+ 可选画风 / 参考图）生成候选图。
        **报价与真生成同一入口**：`dryRun=true` 只报价（与 `POST /generations/estimate` 同一个报价函数，
        同参金额逐字相等；不写库、不扣费），否则走统一受理并回 `generationId`。
        前端用既有 `GET /generations/{id}`（+ `/outputs`）轮询或收 `generation.update` 事件拿候选图；
        **不会自动写回角色**（候选要用户挑），也**不建项目**（任务的 `projectId` 为 `"0"`）、
        不登记待审作品；在任务中心里照常可见。

        操作按参考图张数取：0 张 `text2img`、≥ 1 张 `img2img`。参考图须为本工作区的图片（PNG / JPEG / WEBP，
        平台预置角色的图要先 adopt）；画风 `styleCode` 不存在 / 已下线 → 40001 `details.issues[{field:"styleCode"}]`。
        参考图超过模型能收的张数等报价阶段的拒绝：dryRun 回 200 + `blocked:true` 与原因，真生成照报价的错误回（如 42203）。

        权限：路由只要工作区成员；`dryRun=true` 只要 view，真生成要 generate（只读成员 403/40303）。
        余额不足 422/42201，不扣费；上游失败按原批次全额退款一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketingCharacterGenerateRequest' }
      responses:
        '200':
          description: dryRun 报价；或同一幂等键的重放（`MarketingCharacterGenerateAccepted`，`replayed=true`）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MarketingCharacterGenerateQuote'
                  - $ref: '#/components/schemas/MarketingCharacterGenerateAccepted'
        '201':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCharacterGenerateAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /marketing/characters/{characterId}:
    parameters:
      - name: characterId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [marketing]
      operationId: getMarketingCharacter
      description: 角色详情。他人工作区 / 已删除 / 不存在同一个 404。
      responses:
        '200':
          description: 角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCharacter' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [marketing]
      operationId: updateMarketingCharacter
      description: |
        整份更新，带 `version` 乐观锁。校验同新建；来源字段不可改（带了即 40001）。
        版本不匹配 → 40902 + `details{currentVersion, currentUpdatedAt, currentEditorId, currentEditorName, bySelf}`。
        改名撞名 → 409 `details{field:"name", code:"duplicate"}`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarketingCharacterInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1, description: 读到的版本（乐观锁） }
      responses:
        '200':
          description: 更新后的角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCharacter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [marketing]
      operationId: deleteMarketingCharacter
      description: |
        删除 = 软删（MKD-31）：从角色库消失，删除后可重名；**已建的营销会话不受影响**（快照）。
        之后尽力删除它自有的上传图片与参考音频（仍被引用的保留；结果不影响本接口的成功）。重复删除 404。
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/preset-characters:
    get:
      tags: [marketing]
      operationId: listMarketingPresetCharacters
      security: []
      description: |
        启用的营销角色（平台预置，MKT-F-109），按运营排好的顺序（`sort, id`）。**不需要登录**。
        ⚠️ 不下发任何媒体 ID：取图走 `/marketing/preset-characters/{presetId}/images/{index}`，
        index ∈ `[0, imageCount)`；有参考音频（`hasVoice`）时取 `/voice`。
      parameters:
        - name: q
          in: query
          description: 按名称模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 营销角色列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarketingPresetCharacter' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/preset-characters/{presetId}/images/{index}:
    get:
      tags: [marketing]
      operationId: marketingPresetCharacterImage
      security: []
      description: |
        营销角色图片公开取图（同选项封面 MKD-19），**不需要登录**。先判启用再输出字节；
        停用、不存在、下标越界回**同一个 404**。默认缩略图 `w=320`；响应带 `Cache-Control: public, max-age=300`。
      parameters:
        - name: presetId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: w
          in: query
          description: 缩略图宽度，只接受 160/320/640。
          schema: { type: integer, enum: [160, 320, 640] }
      responses:
        '200':
          description: 图片字节
          content:
            image/*: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/preset-characters/{presetId}/voice:
    get:
      tags: [marketing]
      operationId: marketingPresetCharacterVoice
      security: []
      description: 营销角色参考音频公开取流。判定同图片；没有参考音频也回同一个 404。原样输出；缓存头同图片。
      parameters:
        - name: presetId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: 音频字节
          content:
            audio/*: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketing/preset-characters/{presetId}/adopt:
    parameters:
      - name: presetId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [marketing]
      operationId: adoptMarketingPresetCharacter
      description: |
        把一个启用的营销角色添加到「我的」（MKD-30）：服务端**复制字节**进本工作区（图片与参考音频都是新的媒体 ID），
        建一个 `source=preset` 的角色并记下当时的版本。需要 edit 权限。
        同一版本已添加过 → **200** 回那一份；新建 → 201。名称与「我的」已有角色撞名时自动加后缀「（营销角色）」再试一次，
        仍冲突 409 `details{field:"name", code:"duplicate"}`。停用 / 不存在 → 404；数量已达上限 → 409 `details{reason:"quota"}`。
        运营之后改图或停用，不影响已添加的副本。
      responses:
        '200':
          description: 已添加过，回已有的那一份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCharacter' }
        '201':
          description: 新添加的副本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCharacter' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ==================== 管理端营销选项与分类（MKT-T-03；agent:read / agent:write） ====================
  # 不受 SEEAITV_MARKETING_ENABLED 影响（上线前要能先配好）。没有 DELETE：历史快照按 code 引用，只停用。
  /admin/marketing/options:
    get:
      tags: [admin-marketing]
      operationId: adminListMarketingOptions
      security: [{ adminBearer: [] }]
      description: |
        营销选项列表（创意 / Hook / 风格）。⚠️ **不按投放时段过滤**（管理端看「配了什么」）：
        开始在将来、结束在过去的照样返回，每行带服务端算好的 `lifecycle` 与 `warnings`。
        按 (sort, id) 升序、游标分页。权限 `agent:read`。
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MarketingKind' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: lifecycle, in: query, schema: { $ref: '#/components/schemas/MarketingLifecycle' } }
        - { name: q, in: query, description: 按名称或 code 模糊匹配, schema: { type: string } }
        - { name: cursor, in: query, description: 上一页的 nextCursor, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 选项列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMarketingOption' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-marketing]
      operationId: adminCreateMarketingOption
      security: [{ adminBearer: [] }]
      description: |
        新建选项。⚠️ **一律落停用**；写第 1 版历史。校验一次报完：格式 / 长度 / 时段倒置与零长度 /
        口播禁用词 / 分类与推荐模型与默认技能**不存在** / 封面不是管理端上传 → 40001 + `details.issues[]`。
        无封面、空片段、口播缺提示句、推荐模型停用或不支持对应产出 → 可保存，`warnings[]` 里给出。
        code 跨类型全局唯一（重复 40904）。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMarketingOptionCreate' }
      responses:
        '201':
          description: 已创建（停用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingOption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/marketing/options/sort:
    put:
      tags: [admin-marketing]
      operationId: adminSortMarketingOptions
      security: [{ adminBearer: [] }]
      description: 把同一类型 + 分类下的选项按 `ids` 顺序排成 1..N（不推进内容版本）。任一 ID 不属于该类型与分类整笔拒绝。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, category, ids]
              properties:
                kind: { $ref: '#/components/schemas/MarketingKind' }
                category: { type: string }
                ids: { type: array, items: { $ref: '#/components/schemas/Id' }, minItems: 1, maxItems: 500 }
      responses:
        '204': { description: 已排序 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/marketing/options/{optionId}:
    parameters:
      - name: optionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [admin-marketing]
      operationId: adminGetMarketingOption
      security: [{ adminBearer: [] }]
      description: 选项详情（含服务端片段 `prompt`，只有管理端有）。权限 `agent:read`。
      responses:
        '200':
          description: 选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingOption' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-marketing]
      operationId: adminUpdateMarketingOption
      security: [{ adminBearer: [] }]
      description: |
        整份更新，带 `version` 乐观锁（不匹配 40902 + `details.currentVersion`）；成功后 `version+1`
        并写一行版本历史（同一事务）。`code`、`kind` 不可改（带了且不同即 40001）。
        ⚠️ 已启用的选项按**启用标准**校验（无封面、口播缺提示句也拦）。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMarketingOptionUpdate' }
      responses:
        '200':
          description: 更新后的选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingOption' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/marketing/options/{optionId}/enable:
    post:
      tags: [admin-marketing]
      operationId: adminEnableMarketingOption
      security: [{ adminBearer: [] }]
      description: |
        启用。完整校验（含封面、空片段、口播禁用词与提示句、引用存在性），不过 40905 + `details.issues[]`。
        已启用时幂等返回。启停不推进内容版本。权限 `agent:write`。
      parameters:
        - { name: optionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: 当前选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingOption' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/marketing/options/{optionId}/disable:
    post:
      tags: [admin-marketing]
      operationId: adminDisableMarketingOption
      security: [{ adminBearer: [] }]
      description: 停用（不删行；历史会话与生成快照仍按 (code, version) 取得回原文）。已停用时幂等。权限 `agent:write`。
      parameters:
        - { name: optionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: 当前选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingOption' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/marketing/options/{optionId}/versions:
    get:
      tags: [admin-marketing]
      operationId: adminListMarketingOptionVersions
      security: [{ adminBearer: [] }]
      description: 版本历史（只增不改，新版本在前）。用于追溯「这条片子用的是哪一版」。权限 `agent:read`。
      parameters:
        - { name: optionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMarketingOptionVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/marketing/categories:
    get:
      tags: [admin-marketing]
      operationId: adminListMarketingCategories
      security: [{ adminBearer: [] }]
      description: 分类字典（含停用的），按 kind、sort、id 升序。权限 `agent:read`。
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MarketingKind' } }
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarketingCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-marketing]
      operationId: adminCreateMarketingCategory
      security: [{ adminBearer: [] }]
      description: 新建分类（默认启用）。(kind, code) 重复 40904。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, code, name]
              properties:
                kind: { $ref: '#/components/schemas/MarketingKind' }
                code: { type: string, pattern: '^[a-z][a-z0-9_]{1,47}$' }
                name: { type: string, maxLength: 24 }
                sort: { type: integer }
                isEnabled: { type: boolean }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/marketing/categories/sort:
    put:
      tags: [admin-marketing]
      operationId: adminSortMarketingCategories
      security: [{ adminBearer: [] }]
      description: 把同一类型下的分类按 `ids` 顺序排成 1..N。任一 ID 不属于该类型整笔拒绝。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, ids]
              properties:
                kind: { $ref: '#/components/schemas/MarketingKind' }
                ids: { type: array, items: { $ref: '#/components/schemas/Id' }, minItems: 1, maxItems: 500 }
      responses:
        '204': { description: 已排序 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/marketing/categories/{categoryId}:
    put:
      tags: [admin-marketing]
      operationId: adminUpdateMarketingCategory
      security: [{ adminBearer: [] }]
      description: 改名 / 启停。`code`、`kind` 不可改（选项按 (kind, code) 引用分类；带了且不同即 40001）。权限 `agent:write`。
      parameters:
        - { name: categoryId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                kind: { $ref: '#/components/schemas/MarketingKind' }
                code: { type: string }
                name: { type: string, maxLength: 24 }
                sort: { type: integer, description: 忽略（排序走 /categories/sort） }
                isEnabled: { type: boolean, description: 不传 = 保持原状态 }
      responses:
        '200':
          description: 更新后的分类
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 管理端营销角色（平台预置，MKT-T-36；agent:read / agent:write） ====================
  # 不受 SEEAITV_MARKETING_ENABLED 影响（上线前要能先配好）。没有 DELETE（MKT-F-120）：用户已添加的副本按来源追溯，只停用。
  /admin/marketing/preset-characters:
    get:
      tags: [admin-marketing]
      operationId: adminListMarketingPresetCharacters
      security: [{ adminBearer: [] }]
      description: |
        营销角色列表（**含停用的**，管理端看「配了什么」），按 (sort, id) 升序、游标分页；每行带 `warnings`
        （`level=error` 的项会挡住启用）。权限 `agent:read`。
      parameters:
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: q, in: query, description: 按名称模糊匹配, schema: { type: string } }
        - { name: cursor, in: query, description: 上一页的 nextCursor, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 营销角色列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMarketingPresetCharacter' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-marketing]
      operationId: adminCreateMarketingPresetCharacter
      security: [{ adminBearer: [] }]
      description: |
        新建营销角色。⚠️ **一律落停用**，排在最后。校验一次报完：名称规则（1~50 码点、禁用 `@ < > / \ | : * ? ( )（）`）/
        长度 / 图片超 9 张或重复 / 媒体不存在 / **媒体不是管理端上传的平台素材**（用户工作区文件任何时候拦）/
        图片不是 PNG·JPEG·WebP / 音频位不是音频 → 40001 + `details.issues[]`。
        没有图（启用时才拦）、没有说明、没有形象描述 → 可保存，`warnings[]` 里给出。
        名称不区分大小写全局唯一（重复 40904）。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMarketingPresetCharacterInput' }
      responses:
        '201':
          description: 已创建（停用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingPresetCharacter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/marketing/preset-characters/sort:
    put:
      tags: [admin-marketing]
      operationId: adminSortMarketingPresetCharacters
      security: [{ adminBearer: [] }]
      description: 按 `ids` 顺序排成 1..N（不推进内容版本）。任一 ID 不存在整笔拒绝（40001，不留半截顺序）。用户端列表同一排序键。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: { type: array, items: { $ref: '#/components/schemas/Id' }, minItems: 1, maxItems: 500 }
      responses:
        '204': { description: 已排序 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/marketing/preset-characters/{presetId}:
    parameters:
      - name: presetId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [admin-marketing]
      operationId: adminGetMarketingPresetCharacter
      security: [{ adminBearer: [] }]
      description: 营销角色详情（含媒体 ID 与平台媒体地址，只有管理端有）。权限 `agent:read`。
      responses:
        '200':
          description: 营销角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingPresetCharacter' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-marketing]
      operationId: adminUpdateMarketingPresetCharacter
      security: [{ adminBearer: [] }]
      description: |
        整份更新，带 `version` 乐观锁（不匹配 40902 + `details.currentVersion`）；成功后 `version+1`
        （只有内容保存推进版本，启停与排序不推进 —— 用户「添加」按 (营销角色, 版本) 去重复制）。
        ⚠️ 已启用的按**启用标准**校验（去掉全部图片也拦）。权限 `agent:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMarketingPresetCharacterUpdate' }
      responses:
        '200':
          description: 更新后的营销角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingPresetCharacter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/marketing/preset-characters/{presetId}/enable:
    post:
      tags: [admin-marketing]
      operationId: adminEnableMarketingPresetCharacter
      security: [{ adminBearer: [] }]
      description: |
        启用。完整校验（≥ 1 张图、名称合法、媒体为管理端上传的平台素材、图片须图 / 音频须音频），
        不过 40905 + `details.issues[]`。已启用时幂等返回。不推进内容版本。权限 `agent:write`。
      parameters:
        - { name: presetId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: 当前营销角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingPresetCharacter' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/marketing/preset-characters/{presetId}/disable:
    post:
      tags: [admin-marketing]
      operationId: adminDisableMarketingPresetCharacter
      security: [{ adminBearer: [] }]
      description: 停用（不删行；用户已添加进自己工作区的副本照常可用）。已停用时幂等。权限 `agent:write`。
      parameters:
        - { name: presetId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: 当前营销角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMarketingPresetCharacter' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 桌面版：本机设置（TT-T-12 / TT-T-22，契约补登记 TT-T-10） ====================
  # 不带 X-Workspace-Id；身份由本机中间件补齐（单用户）。
  /settings:
    get:
      tags: [settings]
      operationId: getAppSettings
      description: 全部设置项（按定义顺序）与数据目录。密钥类设置只回掩码（末 4 位）。
      responses:
        '200':
          description: 设置项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettings' }
    put:
      tags: [settings]
      operationId: updateAppSettings
      description: |
        只提交改过的键（`{键: 值}`）。未知键、类型不对、超出范围一律 400，整批不落库。
        响应带 `restartRequired`：其中的键要重启应用才生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: true
      responses:
        '200':
          description: 保存后的全部设置项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettingsUpdated' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /settings/diagnostics:
    get:
      tags: [settings]
      operationId: getDiagnostics
      description: 环境自检。每一项给状态、现值与处置建议；`na` 表示本平台不适用。
      responses:
        '200':
          description: 自检结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsReport' }

  /settings/storage/usage:
    get:
      tags: [settings]
      operationId: getStorageUsage
      description: 数据目录各部分占用（字节）。
      responses:
        '200':
          description: 占用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageUsage' }

  /settings/storage/test:
    post:
      tags: [settings]
      operationId: testS3Storage
      description: |
        用给定参数逐步测试 S3 兼容存储（建立客户端 → 访问存储桶 → 上传 → 签发下载地址 → 删除）。
        测试结果在 200 响应体里（`ok=false` 也是 200）。`keepSecret=true` 时沿用已保存的 SecretKey。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/S3TestRequest' }
      responses:
        '200':
          description: 逐步结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/S3TestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/profile:
    put:
      tags: [auth]
      operationId: updateProfile
      description: 改本机用户资料。目前只有水印开关（`isAiWatermarkOff`，必填）；只影响之后的渲染。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAiWatermarkOff]
              properties:
                isAiWatermarkOff: { type: boolean }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /generations/{generationId}/outputs:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [media]
      operationId: listGenerationOutputs
      description: 一次生成的**全部**产物（裸数组，GO-40）。`url` 指向媒体域的受保护端点。
      responses:
        '200':
          description: 产物列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GenerationOutput' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 音色目录 ====================
  /voices:
    get:
      tags: [catalog]
      operationId: listVoices
      description: 音色目录（启用的）。裸数组。
      parameters:
        - $ref: '#/components/parameters/MaterialKeyword'
        - name: language
          in: query
          schema: { type: string }
        - name: gender
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/MaterialFavorited'
      responses:
        '200':
          description: 音色列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VoiceItem' }

  /voices/{code}/favorite:
    post:
      tags: [catalog]
      operationId: toggleVoiceFavorite
      description: 收藏 / 取消收藏一个音色。重复收藏不是错误。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean }
      responses:
        '200':
          description: 当前收藏状态
          content:
            application/json:
              schema:
                type: object
                required: [isFavorited]
                properties:
                  isFavorited: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 管理：画布配置 ====================
  /admin/canvas/param-definitions:
    get:
      tags: [catalog]
      operationId: adminListParamDefinitions
      security: [{ adminBearer: [] }]
      description: 参数定义（控件字典，含停用的）。权限 `canvas:read`。
      responses:
        '200':
          description: 参数定义列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminParamDefinition' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [catalog]
      operationId: adminSaveParamDefinition
      security: [{ adminBearer: [] }]
      description: 新建或修改一个参数定义（按 code upsert）。`isEnabled` 不传 = 不改。权限 `canvas:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminParamDefinitionInput' }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/canvas/param-definitions/{code}:
    delete:
      tags: [catalog]
      operationId: adminDisableParamDefinition
      security: [{ adminBearer: [] }]
      description: 停用（不删行：已有节点的参数仍可解释）。权限 `canvas:write`。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 已停用 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/canvas/connection-rules:
    put:
      tags: [catalog]
      operationId: adminSaveConnectionRule
      security: [{ adminBearer: [] }]
      description: 修改一条连线规则（源类型 → 目标类型）。权限 `canvas:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, targetType, isAllowed]
              properties:
                sourceType: { type: string }
                targetType: { type: string }
                isAllowed: { type: boolean }
                defaultOperation: { type: string, description: 默认建议的操作码；空 = 无 }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/canvas/revision:
    get:
      tags: [catalog]
      operationId: adminGetCanvasRevision
      security: [{ adminBearer: [] }]
      description: 画布配置的当前版本号（配置每改一次加一）。权限 `canvas:read`。
      responses:
        '200':
          description: 版本号
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { type: integer, format: int64 }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== 管理：图片预设（TT-T-20） ====================
  /admin/image-presets:
    get:
      tags: [catalog]
      operationId: adminListImagePresets
      security: [{ adminBearer: [] }]
      description: 全部图片预设（含停用的，带配方提示词）。权限 `canvas:read`。
      responses:
        '200':
          description: 预设列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminImagePreset' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalog]
      operationId: adminCreateImagePreset
      security: [{ adminBearer: [] }]
      description: |
        新建预设。校验：三个枚举、`params` 为对象、`dimensions` 为带选项的数组、操作码存在；
        code 重复回 409。`isBuiltin` / `isUserModified` 由服务端决定，请求里的值忽略。权限 `canvas:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminImagePreset' }
      responses:
        '201':
          description: 新建的预设
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminImagePreset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/image-presets/preview:
    post:
      tags: [catalog]
      operationId: adminPreviewImagePreset
      security: [{ adminBearer: [] }]
      description: 按服务端拼词规则预览出词（未选的维度取 default）。只读，不落库。权限 `canvas:read`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
                dimensions: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
                selected:
                  type: object
                  description: 维度 key → 选中的选项 value
                  additionalProperties: { type: string }
      responses:
        '200':
          description: 拼好的追加词
          content:
            application/json:
              schema:
                type: object
                required: [rendered]
                properties:
                  rendered: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/image-presets/{code}:
    put:
      tags: [catalog]
      operationId: adminUpdateImagePreset
      security: [{ adminBearer: [] }]
      description: 修改预设（以路径 code 为准）。内置预设改过后标记为已修改，启动时不再被内置内容覆盖。权限 `canvas:write`。
      parameters:
        - $ref: '#/components/parameters/PresetCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminImagePreset' }
      responses:
        '200':
          description: 保存后的预设
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminImagePreset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/image-presets/{code}/enable:
    post:
      tags: [catalog]
      operationId: adminEnableImagePreset
      security: [{ adminBearer: [] }]
      description: 启用。权限 `canvas:write`。
      parameters:
        - $ref: '#/components/parameters/PresetCode'
      responses:
        '200':
          description: 当前预设
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminImagePreset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/image-presets/{code}/disable:
    post:
      tags: [catalog]
      operationId: adminDisableImagePreset
      security: [{ adminBearer: [] }]
      description: 停用（不删行：已有节点里的 presetCode 仍可追溯）。权限 `canvas:write`。
      parameters:
        - $ref: '#/components/parameters/PresetCode'
      responses:
        '200':
          description: 当前预设
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminImagePreset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/image-presets/{code}/restore-builtin:
    post:
      tags: [catalog]
      operationId: adminRestoreImagePreset
      security: [{ adminBearer: [] }]
      description: 恢复内置版本（内容回到随包那份，启用状态不变）。非内置预设回 404。权限 `canvas:write`。
      parameters:
        - $ref: '#/components/parameters/PresetCode'
      responses:
        '200':
          description: 恢复后的预设
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminImagePreset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 管理：素材与音色 ====================
  /admin/materials/{type}:
    get:
      tags: [catalog]
      operationId: adminListMaterials
      security: [{ adminBearer: [] }]
      description: 素材目录（含停用的，带提示词）。裸数组。权限 `canvas:read`。
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [style, effect, camera] }
        - $ref: '#/components/parameters/MaterialKeyword'
      responses:
        '200':
          description: 素材列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminMaterialItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/materials:
    put:
      tags: [catalog]
      operationId: adminSaveMaterial
      security: [{ adminBearer: [] }]
      description: 新建或修改一个素材（按 type + code upsert）。权限 `canvas:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMaterialInput' }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/voices:
    get:
      tags: [catalog]
      operationId: adminListVoices
      security: [{ adminBearer: [] }]
      description: 音色目录（含停用的）。裸数组。权限 `voice:read`。
      parameters:
        - $ref: '#/components/parameters/MaterialKeyword'
      responses:
        '200':
          description: 音色列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminVoiceItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [catalog]
      operationId: adminSaveVoice
      security: [{ adminBearer: [] }]
      description: 新建或修改一个音色（按 code upsert）。权限 `voice:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVoiceInput' }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== 管理：模型与厂商 ====================
  /admin/operations:
    get:
      tags: [catalog]
      operationId: adminListOperations
      security: [{ adminBearer: [] }]
      description: 操作目录（只读）。权限 `model:read`。
      responses:
        '200':
          description: 操作列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminOperation' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/models/protocols:
    get:
      tags: [catalog]
      operationId: adminListModelProtocols
      security: [{ adminBearer: [] }]
      description: 协议目录，来自代码注册表（`provider/protocol`）。权限 `model:read`。
      responses:
        '200':
          description: 协议列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminModelProtocol' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/models/providers:
    get:
      tags: [catalog]
      operationId: adminListProviders
      security: [{ adminBearer: [] }]
      description: 厂商（Provider）列表。**绝不回显密钥**，只给 `hasApiKey`。权限 `model:read`。
      responses:
        '200':
          description: 厂商列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminProvider' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [catalog]
      operationId: adminSaveProvider
      security: [{ adminBearer: [] }]
      description: |
        新建或修改厂商（按 code upsert，`version` 乐观锁）。密钥三态：`keep` 保留 / `replace` 替换 / `clear` 清除；
        掩码值不会被当作新密钥。权限 `model:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProviderInput' }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/models/providers/{code}/probe:
    post:
      tags: [catalog]
      operationId: adminProbeProvider
      security: [{ adminBearer: [] }]
      description: |
        连接测试：真的向上游发一次请求（所以是 POST）。连不上不是错误，结果在 200 的响应体里。
        权限 `model:write`。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderProbeResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/models:
    get:
      tags: [catalog]
      operationId: adminListModels
      security: [{ adminBearer: [] }]
      description: 模型列表（含停用的），每个模型带操作绑定。权限 `model:read`。
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminModel' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [catalog]
      operationId: adminSaveModel
      security: [{ adminBearer: [] }]
      description: |
        新建或修改模型（按 code upsert）。有历史生成记录后，厂商 / 协议 / 模型类型 / 上游模型名锁定。
        `maxDurationSec` 显式传 null = 清除；不传 = 不改。权限 `model:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminModelInput' }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/models/{code}/publishable:
    get:
      tags: [catalog]
      operationId: adminCheckModelPublishable
      security: [{ adminBearer: [] }]
      description: 发布检查：给出具体阻塞原因（模型 / 厂商 / 操作 / 绑定 / 计价 / 能力矩阵…）。权限 `model:read`。
      parameters:
        - $ref: '#/components/parameters/ModelCode'
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPublishCheck' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/models/{code}/operations:
    put:
      tags: [catalog]
      operationId: adminSaveModelOperation
      security: [{ adminBearer: [] }]
      description: |
        绑定 / 修改模型的一个操作。协议表达不了的操作在这里就 422（不等 Worker 构造请求时才失败）。
        `estSeconds` 为空 = 用模型级预计耗时。权限 `model:write`。
      parameters:
        - $ref: '#/components/parameters/ModelCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, isEnabled]
              properties:
                operation: { type: string }
                isEnabled: { type: boolean }
                estSeconds: { type: [integer, 'null'], minimum: 1 }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/models/{code}/capabilities:
    get:
      tags: [catalog]
      operationId: adminListModelCapabilities
      security: [{ adminBearer: [] }]
      description: '能力矩阵，按操作码分组（`{operation: [行]}`）。权限 `model:read`。'
      parameters:
        - $ref: '#/components/parameters/ModelCode'
      responses:
        '200':
          description: 能力矩阵
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/ModelCapability' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [catalog]
      operationId: adminSaveModelCapability
      security: [{ adminBearer: [] }]
      description: 新建或修改一行能力（操作 × 输入角色）。协议表达不了的组合回 422。权限 `model:write`。
      parameters:
        - $ref: '#/components/parameters/ModelCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ModelCapability'
                - type: object
                  required: [operation]
                  properties:
                    operation: { type: string }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/models/{code}/capabilities/{operation}/{role}:
    delete:
      tags: [catalog]
      operationId: adminDeleteModelCapability
      security: [{ adminBearer: [] }]
      description: 删除一行能力。权限 `model:write`。
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - name: operation
          in: path
          required: true
          schema: { type: string }
        - name: role
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/models/{code}/param-supports:
    get:
      tags: [catalog]
      operationId: adminListModelParamSupports
      security: [{ adminBearer: [] }]
      description: 模型的参数支持（`model_param_support`）与可配置的参数目录（TT-T-18）。权限 `model:read`。
      parameters:
        - $ref: '#/components/parameters/ModelCode'
      responses:
        '200':
          description: 参数支持
          content:
            application/json:
              schema:
                type: object
                required: [items, params]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ModelParamSupport' } }
                  params:
                    type: array
                    items:
                      type: object
                      required: [code, name, controlType]
                      properties:
                        code: { type: string }
                        name: { type: string }
                        controlType: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [catalog]
      operationId: adminSaveModelParamSupport
      security: [{ adminBearer: [] }]
      description: 新建或修改一个参数的支持（同一参数再写一次是修改）。默认值必须在可选值之中。权限 `model:write`。
      parameters:
        - $ref: '#/components/parameters/ModelCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelParamSupportInput' }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/models/{code}/param-supports/{paramCode}:
    delete:
      tags: [catalog]
      operationId: adminDeleteModelParamSupport
      security: [{ adminBearer: [] }]
      description: 删除一个参数的支持。权限 `model:write`。
      parameters:
        - $ref: '#/components/parameters/ModelCode'
        - name: paramCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/model-templates:
    get:
      tags: [catalog]
      operationId: adminListModelTemplates
      security: [{ adminBearer: [] }]
      description: 随应用附带的厂商模板（TT-T-18、TT-T-23），按 providers.json 的编码与库里实际状态合并。权限 `model:read`。
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ModelTemplate' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/model-config/export:
    get:
      tags: [catalog]
      operationId: adminExportModelConfig
      security: [{ adminBearer: [] }]
      description: |
        导出全部厂商（**含明文 API Key**）、模型、操作绑定、能力矩阵、参数覆盖与公网中转存储配置（含明文 SecretKey），
        用于换电脑 / 重装时整体同步。权限 `model:read`。
      responses:
        '200':
          description: 模型配置文件（`format=tabtv.settings`、`kind=model-config`、`version=1`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConfigFile' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/model-config/import:
    post:
      tags: [catalog]
      operationId: adminImportModelConfig
      security: [{ adminBearer: [] }]
      description: |
        导入 `adminExportModelConfig` 导出的文件。以文件为准：同 code 覆盖、没有的新建，本机多出来的厂商 / 模型不动
        （同一模型下文件里没有的操作改为停用、能力行与参数覆盖删除）。`dryRun=true` 只返回预览、不写库。
        `problems` 非空时整次不写入；单个厂商 / 模型失败记在该项的 `error` / `warnings` 上，其余照常导入。权限 `model:write`。
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigFile' }
      responses:
        '200':
          description: 预览或导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConfigImportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/model-templates/recommend-bindings/{model}:
    post:
      tags: [catalog]
      operationId: adminRecommendModelBindings
      security: [{ adminBearer: [] }]
      description: |
        给自建模型绑定推荐的操作与能力规则（依据内置厂商模板：文本模型取文本操作组，图片 / 视频取模板里同协议同类型模型的操作）。
        已经绑过的操作原样保留。没有可推荐的操作时回 400 并说明。权限 `model:write`。
      parameters:
        - name: model
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 推荐结果
          content:
            application/json:
              schema:
                type: object
                required: [bound, skipped]
                properties:
                  bound: { type: array, items: { type: string }, description: 本次新绑的操作 }
                  skipped: { type: array, items: { type: string }, description: 已经绑过、原样保留的操作 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/model-templates/{code}/enable:
    post:
      tags: [catalog]
      operationId: adminEnableModelTemplate
      security: [{ adminBearer: [] }]
      description: |
        启用一个厂商模板：先保存 Key 并启用厂商，再逐个模型跑发布检查，有阻塞的不启用并给出原因。
        再点一次会跳过已启用的模型。厂商需要认证却没有 Key 时回 400。权限 `model:write`。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: { $ref: '#/components/schemas/SecretFieldInput' }
      responses:
        '200':
          description: 启用结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelTemplateEnableResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 管理：系统提示词（TT-T-19） ====================
  /admin/prompts/specs:
    get:
      tags: [catalog]
      operationId: adminListPromptSpecs
      security: [{ adminBearer: [] }]
      description: 可配置的提示词清单（代码登记），含变量要求与内置原文。权限 `prompt:read`。
      responses:
        '200':
          description: 规格列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PromptSpec' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/prompts:
    get:
      tags: [catalog]
      operationId: adminListPrompts
      security: [{ adminBearer: [] }]
      description: 库里的覆盖行（通用版与模型专属版）。权限 `prompt:read`。
      responses:
        '200':
          description: 覆盖行列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminPromptTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/prompts/versions:
    get:
      tags: [catalog]
      operationId: adminListPromptVersions
      security: [{ adminBearer: [] }]
      description: 一条提示词的发布历史（新的在前）。权限 `prompt:read`。
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: modelCode
          in: query
          description: 空 = 通用版
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PromptVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/prompts/draft:
    put:
      tags: [catalog]
      operationId: adminSavePromptDraft
      security: [{ adminBearer: [] }]
      description: 保存草稿（不生效，发布是单独一次操作）。权限 `prompt:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, content]
              properties:
                code: { type: string }
                modelCode: { type: string, description: 空 = 通用版 }
                content: { type: string }
                note: { type: string }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/prompts/publish:
    post:
      tags: [catalog]
      operationId: adminPublishPrompt
      security: [{ adminBearer: [] }]
      description: 发布当前草稿，返回新版本号。权限 `prompt:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                modelCode: { type: string }
                note: { type: string }
      responses:
        '200':
          description: 新版本号
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/prompts/rollback:
    post:
      tags: [catalog]
      operationId: adminRollbackPrompt
      security: [{ adminBearer: [] }]
      description: 回滚到某个历史版本（以新版本发布，历史保留）。权限 `prompt:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, targetVersion]
              properties:
                code: { type: string }
                modelCode: { type: string }
                targetVersion: { type: integer }
                note: { type: string }
      responses:
        '200':
          description: 新版本号
          content:
            application/json:
              schema:
                type: object
                required: [version, rollbackOf]
                properties:
                  version: { type: integer }
                  rollbackOf: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/prompts/archive:
    post:
      tags: [catalog]
      operationId: adminArchivePrompt
      security: [{ adminBearer: [] }]
      description: |
        归档一条覆盖行（= 恢复内置版本）：通用版归档后回落到代码内置原文，模型专属版归档后回落到通用版。
        版本历史保留。权限 `prompt:write`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                modelCode: { type: string }
      responses:
        '204': { description: 已归档 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/prompts/preview:
    post:
      tags: [catalog]
      operationId: adminPreviewPrompt
      security: [{ adminBearer: [] }]
      description: 试渲染（不落库）。`content` 为空时渲染当前生效内容。权限 `prompt:read`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                modelCode: { type: string }
                content: { type: string }
                vars:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: 渲染结果
          content:
            application/json:
              schema:
                type: object
                required: [rendered]
                properties:
                  rendered: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== 管理：Agent 技能恢复内置（TT-T-19） ====================
  /admin/agent/skills/{skillId}/restore-builtin:
    post:
      tags: [admin-agent]
      operationId: adminRestoreAgentSkillBuiltin
      security: [{ adminBearer: [] }]
      description: |
        恢复内置版本：内容与附属文档回到随包那份（**用户后加的附属文档会被删除**），版本 +1、清除「已修改」标记。
        封面、模型绑定、场景、输入槽与预填文本不动。非内置技能回 404。权限 `agent:write`。
      parameters:
        - name: skillId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: 恢复后的技能（含附属文档）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAgentSkill' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户 token。**不可调用 /admin 接口**（GO-02）。
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理员 token，与用户 token 类型隔离。

  headers:
    TraceId:
      description: 全链路 traceId，同一值可追受理、任务、Provider 调用与结果（AC-26）
      schema: { type: string }

  parameters:
    ModelCode:
      name: code
      in: path
      required: true
      description: 模型编码
      schema: { type: string }
    PresetCode:
      name: code
      in: path
      required: true
      description: 图片预设编码
      schema: { type: string }
    MaterialKeyword:
      name: keyword
      in: query
      description: 按名称或 code 模糊搜索。
      schema: { type: string }
    MaterialCategory:
      name: category
      in: query
      description: 只看某个分类。
      schema: { type: string }
    MaterialCommercial:
      name: commercial
      in: query
      description: '`true` 只看可商用的。'
      schema: { type: boolean }
    MaterialFavorited:
      name: favorited
      in: query
      description: '`true` 只看我收藏的（「我的收藏」）。'
      schema: { type: boolean }
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      description: |
        当前工作区。服务端必须校验：① 调用者是该工作区 active 成员；
        ② 被访问资源的 workspace_id 与之一致。两条都过才算通过（AC-02）。
      schema: { type: string, pattern: '^[0-9]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的唯一键。写钱、建任务、建订单必须携带。
      schema: { type: string, minLength: 8, maxLength: 128 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    AgentSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    GenerationId:
      name: generationId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的 nextCursor；首页不传
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }

    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }

    ScriptId:
      name: scriptId
      in: path
      required: true
      schema: { type: string }
    ShotId:
      name: shotId
      in: path
      required: true
      schema: { type: string }
    SmartcutTimelineId:
      name: timelineId
      in: path
      required: true
      description: 智能剪辑节点绑定的时间线 ID
      schema: { type: string, pattern: '^[0-9]+$' }
    SmartcutClipId:
      name: clipId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    SmartcutIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        客户端生成的唯一键。**非 dryRun 时必填**（会建任务、会扣费）；dryRun 只报价，不需要。
        失败后重试要换一把新键（失败的那次已经结束，同一把键会命中它）。
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    BadRequest:
      description: |
        请求本身合法但当前状态下办不了（图里有环、没有需要执行的节点等）。
        message 里一定说清**具体是什么** —— 一句"参数错误"用户无从下手。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: 未认证
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态或幂等冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: 业务规则不满足（积分不足、能力不支持、上游未就绪等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 限流或并发达上限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 文件超限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: 类型不支持或文件头与声明不符
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ModelConfigFile:
      type: object
      required: [format, kind, version]
      properties:
        format: { type: string, example: tabtv.settings }
        kind: { type: string, example: model-config }
        version: { type: integer, example: 1 }
        exportedAt: { type: string, format: date-time }
        appVersion: { type: string }
        providers:
          type: array
          items: { type: object, additionalProperties: true }
          description: 厂商，`apiKey` 为明文
        models:
          type: array
          items: { type: object, additionalProperties: true }
          description: 模型，含 `operations`、`capabilities`、`params`
        storage:
          type: object
          additionalProperties: true
          description: 公网中转存储（S3 兼容），`secretKey` 为明文；没配时不出现
    ModelConfigImportItem:
      type: object
      required: [code, name, action, status, ok]
      properties:
        code: { type: string }
        name: { type: string }
        action: { type: string, enum: [create, update] }
        status: { type: string, description: 文件里的状态 }
        hasKey: { type: boolean }
        ok: { type: boolean }
        error: { type: string }
        warnings: { type: array, items: { type: string } }
    ModelConfigImportReport:
      type: object
      required: [dryRun, problems, providers, models, storage, localOnly, restartRequired]
      properties:
        dryRun: { type: boolean }
        problems: { type: array, items: { type: string }, description: 挡住整次导入的问题 }
        providers: { type: array, items: { $ref: '#/components/schemas/ModelConfigImportItem' } }
        models: { type: array, items: { $ref: '#/components/schemas/ModelConfigImportItem' } }
        storage: { type: string, enum: [none, set] }
        storageEndpoint: { type: string }
        localOnly:
          type: object
          required: [providers, models]
          properties:
            providers: { type: array, items: { type: string } }
            models: { type: array, items: { type: string } }
        restartRequired: { type: boolean }
    # ---------- 通用 ----------
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Snowflake id。内部 int64，**对外一律 string**（GO-34）。

    Error:
      type: object
      description: |
        统一错误体。**HTTP 状态码与 code 前 3 位一致**（修正旧系统 HTTP 200 + 非零 code 的做法）。
        成功响应不套信封，直接返回数据，traceId 走 X-Trace-Id 响应头。
      required: [code, name, message, traceId]
      properties:
        code: { type: integer, description: 取自 api/errors.yaml }
        name: { type: string, description: 错误码符号名，如 INSUFFICIENT_CREDITS }
        message: { type: string }
        traceId: { type: string }
        details:
          type: [object, 'null']
          additionalProperties: true
          description: 结构化补充信息，如字段级校验错误

    VersionConflictError:
      description: |
        版本冲突。附加信息放在**统一的 `details` 袋子**里，而不是往顶层加字段 ——
        一套 Error 解析就够了，将来再加一个字段也不必新建一个 schema。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [details]
          properties:
            details:
              type: object
              required: [currentVersion]
              properties:
                currentVersion:
                  type: integer
                  description: 服务端当前版本，客户端据此决定重载还是放弃
                currentUpdatedAt:
                  type: string
                  format: date-time
                  description: 服务端那一版的保存时间，用于告诉用户「谁在什么时候改的」
                currentEditorId:
                  type: string
                  description: 最后一次成功保存的人；空串表示未知（历史项目或账号已清理）。
                currentEditorName:
                  type: string
                  description: |
                    最后一次成功保存的人的昵称。⚠️ 这是冲突提示里**最有用的一项**
                    （P12-02、NEW-19）：「其他窗口」有两种 —— 自己的另一个标签页
                    （直接覆盖就行）与同事（覆盖等于抹掉别人的工作）。
                    分不出来用户只能凭猜，而猜错的那一半正是"无声覆盖另一成员的修改"。
                bySelf:
                  type: boolean
                  description: |
                    最后一次保存是不是当前用户自己干的。⚠️ 前端按这个**布尔**分流措辞，
                    不要去匹配 message 的文案 —— 文案改一个字匹配就失效，
                    而失效的表现是所有冲突都退回默认那句。Agent / MCP 的写入一律为 false。
                editorKind:
                  type: string
                  enum: [user, ai, agent, mcp, sync, system]
                  description: |
                    中间那次写入是真人整份保存（user）、Agent 的画布操作（agent，AGT-10）
                    还是 MCP 的画布操作（mcp，MCPT-09）。时间线的冲突还可能是 AI 剪辑（ai）、
                    连线自动铺轨（sync）或系统回填（system，片段级生成的结果）。
                    agent / mcp 时前端可以 `GET /projects/{id}/canvas/ops` 补取批次、重放后自动重存（用户无感）；
                    user 时必须走冲突处理。⚠️ 只说明**最后一次**写入；补取返回 needsReload 说明中间还夹着真人保存。
                agentSessionId:
                  type: string
                  description: editorKind=agent 时的会话 ID；否则为空串。
                mcpGrantId:
                  type: string
                  description: editorKind=mcp 时的 MCP 授权 ID；否则为空串。
                callId:
                  type: string
                  description: |
                    AI 剪辑 / 追加指令期间时间线被改过时（智能剪辑），这一次的调用记录：方案已经生成并存下，
                    「仍然应用」用它调 `POST .../plan/{callId}/apply`（带 force），不用重新调模型。
                currentSource:
                  type: string
                  enum: [user, ai, agent, mcp, sync, system]
                  description: |
                    项目文档与 3D 导演台场景的冲突带这一项，取值与 `editorKind` 相同（DRD-46）：
                    两者的冲突文案由同一个函数给出，它读的是这个键。画布保存的冲突不带。

    CanvasOpBatch:
      type: object
      description: |
        一批已应用的画布操作（AGT-10）。`ops` 是**已解析**的操作：批内引用已换成真实 ID，
        add_node / add_edge / add_frame 带着最终落库的完整节点 / 连线，前端按序重放即可。
        形状与 `canvas.ops_applied` 事件、共享 fixture `api/fixtures/canvas-ops` 一致。
      required: [batchId, fromVersion, toVersion, actor, ops, createdAt]
      properties:
        batchId: { type: string }
        fromVersion: { type: integer }
        toVersion: { type: integer }
        actor: { $ref: '#/components/schemas/CanvasOpActor' }
        ops:
          type: array
          items: { $ref: '#/components/schemas/CanvasOp' }
        createdAt: { type: string, format: date-time }

    CanvasOpActor:
      type: object
      required: [kind, userId, agentSessionId, mcpGrantId, clientName]
      properties:
        kind: { type: string, enum: [agent, user, mcp] }
        userId:
          type: [string, 'null']
          description: 发起人（Agent 写入时是会话发起人，MCP 写入时是授权所属的用户）
        agentSessionId: { type: [string, 'null'] }
        mcpGrantId:
          type: [string, 'null']
          description: kind=mcp 时的 MCP 授权 ID（MCPT-09）
        clientName:
          type: [string, 'null']
          description: |
            外部客户端名（展示用）。只在 `canvas.ops_applied` 事件里有值；补取接口恒为 null
            （日志不存它，canvas 域不读 mcp_* 表），前端回落到节点上的 `origin.clientName`。

    CanvasOp:
      type: object
      required: [kind]
      description: |
        一条已解析的画布操作。kind 决定用哪些字段：
        add_node → node；add_edge → edge；add_frame → frame（type=frame 的节点）；
        update_node → nodeId + patch（title 替换、params 按 JSON merge patch 合并）；
        move_node → nodeId + position；set_frame_members → nodeId + frame.members；
        link_generation → nodeId + patch.generationId（只由 Agent 的 generate 工具在受理成功后产生：
        把节点 result 置为 {id, status: queued, progress: 0}；同一 generationId 已挂着时不动）。
      properties:
        kind:
          type: string
          enum: [add_node, update_node, move_node, add_edge, add_frame, set_frame_members, link_generation]
        nodeId: { type: string }
        node: { type: object, additionalProperties: true }
        patch: { type: object, additionalProperties: true }
        edge: { type: object, additionalProperties: true }
        frame: { type: object, additionalProperties: true }
        position:
          type: object
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }

    ProjectDocumentSummary:
      type: object
      description: 项目文档摘要（不含正文，AGT-09）。
      required: [id, path, version, source, bytes, updatedAt]
      properties:
        id: { type: string }
        path: { type: string }
        version: { type: integer }
        source: { type: string, enum: [agent, user, mcp], description: "最后一次由谁写入（mcp = 外部 AI 客户端，MCPT-11）" }
        bytes: { type: integer, description: 正文字节数 }
        updatedAt: { type: string, format: date-time }

    ProjectDocument:
      type: object
      description: |
        项目文档（AGT-09）。画布上的文档节点只存 `params.docId`，正文在这里；
        `version` 是**文档自己的**乐观锁，与项目画布的 version 无关。
      required: [id, projectId, path, content, version, source, lastEditorId, lastEditorName, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        path: { type: string }
        content: { type: string }
        version: { type: integer }
        source: { type: string, enum: [agent, user, mcp], description: "最后一次由谁写入（mcp = 外部 AI 客户端，MCPT-11）" }
        lastEditorId:
          type: [string, 'null']
          description: 最后一次保存的人；Agent 写入或副本新建时为 null。
        lastEditorName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DirectorScene:
      type: object
      description: |
        3D 导演台的场景（docs/agent/director，DRK-9）。画布上的导演台节点只存 `params.sceneId`，正文在这里。
        `version` 是**场景自己的**乐观锁，与项目画布的 version、正文里的 `schemaVersion` 都是不同的东西。
      required: [id, projectId, canvasNodeId, schemaVersion, version, renderFingerprint, scene, records,
        lastEditorId, lastEditorName, editorKind, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        canvasNodeId: { type: string }
        schemaVersion: { type: integer }
        version: { type: integer }
        renderFingerprint:
          type: string
          description: |
            服务端保存时按「会出现在画面里的内容」算出的指纹（DRD-13）。截图记录上的指纹与它不相等即为过期；
            前端只比较，不计算。
        scene: { $ref: '#/components/schemas/DirectorSceneBody' }
        records:
          type: array
          description: 媒体记录，按时间倒序，含已隐藏的（带 `hidden` 标记）。
          items: { $ref: '#/components/schemas/DirectorMediaRecord' }
        lastEditorId:
          type: [string, 'null']
          description: 最后一次保存的人（Agent / MCP 写入时是代谁写的那个人）；没有时为 null。
        lastEditorName: { type: string }
        editorKind:
          type: string
          enum: [user, agent, mcp]
          description: 最后一次写入来自网页、Agent 还是外部 AI 客户端（MCP）。
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DirectorSceneSummary:
      type: object
      description: 场景摘要（不带正文）。保存成功的响应也是这个形状。
      required: [id, canvasNodeId, version, renderFingerprint, outputCameraId, lastEditorName, editorKind,
        updatedAt]
      properties:
        id: { type: string }
        canvasNodeId: { type: string }
        version: { type: integer }
        renderFingerprint: { type: string }
        outputCameraId:
          type: [string, 'null']
          description: 正文里的输出机位；没有时为 null。
        lastEditorName: { type: string }
        editorKind: { type: string, enum: [user, agent, mcp] }
        updatedAt: { type: string, format: date-time }

    DirectorMediaRecord:
      type: object
      description: |
        导演台产出的一个文件（DRD-12）：截图、深度图、骨架图、预演视频、泼溅文件。
        机位字段是截图那一刻的快照：机位之后改名、改焦距、被删掉，记录仍说得清当时是哪一个。
        记录不可变，只能隐藏。
      required: [id, sceneId, kind, mediaId, width, height, durationMs, fps, cameraId, cameraName, camera,
        sceneVersion, renderFingerprint, hidden, createdAt]
      properties:
        id: { type: string }
        sceneId: { type: string }
        kind: { type: string, enum: [capture, depth, pose, preview, splat] }
        mediaId: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
        fps: { type: [integer, 'null'] }
        cameraId: { type: [string, 'null'] }
        cameraName: { type: [string, 'null'] }
        camera:
          type: [object, 'null']
          additionalProperties: true
          description: 截图时的机位参数快照（焦距、画幅、位置与朝向等）。
        sceneVersion:
          type: [integer, 'null']
          description: 截图时的场景版本；泼溅为 null。
        renderFingerprint:
          type: [string, 'null']
          description: 截图时的渲染指纹；与场景当前指纹不相等即为过期。泼溅为 null。
        hidden: { type: boolean }
        createdAt: { type: string, format: date-time }

    DirectorBuildRequest:
      type: object
      required: [prompt, sceneVersion]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 2000, description: 想要搭建的场景 }
        referenceMediaIds:
          type: array
          maxItems: 4
          description: 参考图（本工作区的图片，按顺序编号为图 1、图 2……）。上限还要与模型的图片上限取小。
          items: { type: string, pattern: '^[0-9]+$' }
        sceneVersion:
          type: integer
          minimum: 1
          description: 发起时手上的场景版本：与服务端不一致时先保存再搭景（40902）。

    DirectorBuildResult:
      type: object
      required: [baseVersion, callId, modelCode, proposal]
      properties:
        baseVersion:
          type: integer
          description: 提案基于的场景版本；应用时以它为乐观锁版本保存。
        callId: { type: string }
        modelCode: { type: string }
        proposal:
          type: object
          required: [scene, changes, defaults]
          properties:
            scene: { $ref: '#/components/schemas/DirectorSceneBody' }
            changes:
              type: object
              required: [added, updated, removed]
              description: 对象 ID 的变更清单，预览时据此给新增 / 修改 / 删除标色（DR-F-102）。
              properties:
                added: { type: array, items: { type: string } }
                updated: { type: array, items: { type: string } }
                removed: { type: array, items: { type: string } }
            defaults:
              type: array
              description: 说明：用了哪些默认值、哪些操作被忽略以及为什么（DR-F-106），每条一句。
              items: { type: string }

    DirectorBuildConfig:
      type: object
      required: [available, reason, userFixable, maxImages, maxPromptChars, concurrency, perHour, usedThisHour]
      properties:
        available: { type: boolean }
        reason:
          type: [string, 'null']
          description: 不可用时的原因；可用时为 null。
        userFixable:
          type: boolean
          description: 用户自己能解决（会员等级不够），否则要运营处理。
        maxImages: { type: integer, minimum: 0, description: 参考图上限；模型不收图时为 0 }
        maxPromptChars: { type: integer }
        concurrency: { type: integer, description: 同一用户同时进行的上限 }
        perHour: { type: integer, description: 同一用户每小时的上限 }
        usedThisHour: { type: integer, description: 近 1 小时已用次数（含失败的） }

    DirectorVec3:
      type: object
      additionalProperties: true
      required: [x, y, z]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }

    DirectorLight:
      type: object
      additionalProperties: true
      properties:
        visible: { type: boolean }
        intensity: { type: number, minimum: 0, maximum: 10 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        azimuth: { type: number, minimum: 0, maximum: 360, description: 水平方位角（度） }
        elevation: { type: number, minimum: -90, maximum: 90, description: 仰角（度） }

    DirectorSceneObject:
      type: object
      additionalProperties: true
      description: |
        场景里的一个对象：角色、群众阵列、道具或机位。`kind` 决定必须带哪一段（character / crowd / prop / camera）。
        角色以脚底为锚点、道具以底面为锚点（DRD-4）。
      required: [id, name, kind, transform]
      properties:
        id: { type: string, maxLength: 64, description: 场景内唯一 }
        name: { type: string, maxLength: 20, description: 不计入渲染指纹 }
        kind: { type: string, enum: [character, crowd, prop, camera] }
        transform:
          type: object
          additionalProperties: true
          required: [position, rotation, scale]
          properties:
            position: { $ref: '#/components/schemas/DirectorVec3' }
            rotation: { $ref: '#/components/schemas/DirectorVec3' }
            scale: { $ref: '#/components/schemas/DirectorVec3' }
        visible: { type: boolean }
        locked: { type: boolean, description: 只影响编辑，不计入渲染指纹 }
        source:
          type: string
          enum: [user, ai]
          description: 用户改过的 AI 对象改写为 user（DR-F-105）
        character:
          type: object
          additionalProperties: true
          required: [model, height, body]
          properties:
            model: { type: string, description: 素模码（api/fixtures/director/catalog.json） }
            height: { type: number, minimum: 0.8, maximum: 2.3 }
            body: { type: string, enum: [slim, standard, stocky] }
            posePreset: { type: string, maxLength: 64 }
            boneOverrides:
              type: object
              description: 骨骼名 → 旋转（度），至多 70 项
              additionalProperties: { $ref: '#/components/schemas/DirectorVec3' }
            footLock:
              type: object
              additionalProperties: true
              properties:
                left: { type: boolean }
                right: { type: boolean }
        crowd:
          type: object
          additionalProperties: true
          required: [model, rows, cols, spacing]
          description: 群众阵列，rows × cols ≤ 100（DR-PARAM-09）
          properties:
            model: { type: string }
            rows: { type: integer, minimum: 1, maximum: 10 }
            cols: { type: integer, minimum: 1, maximum: 10 }
            spacing: { type: number, minimum: 0.5, maximum: 5 }
            posePreset: { type: string, maxLength: 64 }
            jitter: { type: boolean }
            seed: { type: integer, minimum: 0 }
        prop:
          type: object
          additionalProperties: true
          required: [shape, size]
          properties:
            shape: { type: string, enum: [box, cylinder, sphere, plane] }
            size: { $ref: '#/components/schemas/DirectorVec3' }
            color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        camera:
          type: object
          additionalProperties: true
          required: [focalLengthMm, aspect]
          properties:
            focalLengthMm: { type: number, minimum: 12, maximum: 200 }
            sensorWidthMm:
              type: number
              minimum: 10
              maximum: 70
              description: 传感器**长边**：横幅时是宽，竖幅时是高（视角换算见 api/fixtures/director/camera/fov.json）
            aspect: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '21:9'] }
            near: { type: number, minimum: 0.01, maximum: 10 }
            far: { type: number, minimum: 10, maximum: 10000 }
            roll: { type: number, minimum: -180, maximum: 180 }

    DirectorTimelineTrack:
      type: object
      additionalProperties: true
      required: [objectId, channel, keyframes]
      properties:
        objectId: { type: string }
        channel: { type: string, enum: [transform, pose, camera] }
        keyframes:
          type: array
          maxItems: 120
          items:
            type: object
            additionalProperties: true
            required: [frame, interpolation, value]
            properties:
              frame: { type: integer, minimum: 0 }
              interpolation: { type: string, enum: [linear, smooth, hold] }
              value:
                type: object
                additionalProperties: true
                description: 形状随 channel 而定（dev/03 §10）

    DirectorSceneBody:
      type: object
      additionalProperties: true
      description: |
        场景正文 v1（dev/02 §2.4）。坐标单位为米、Y 轴向上，角度单位为度（欧拉 XYZ），颜色为 `#RRGGBB`。
        ⚠️ **每一层都允许额外字段**，服务端原样保存（GO-35）：前端可以比后端新。
        除 `schemaVersion` 外各段都可省略（前端按默认值补齐），出现了就逐项校验。
        上限：对象 ≤ 200、全场景关键帧 ≤ 2000、序列化后 ≤ 512 KiB（DR-PARAM-09）。
      required: [schemaVersion]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
          description: 正文的结构版本，与场景的乐观锁 `version` 是两件事。
        stage:
          type: object
          additionalProperties: true
          properties:
            scale: { type: number, minimum: 0.1, maximum: 10, description: 场景整体缩放（DR-F-60） }
            offset: { $ref: '#/components/schemas/DirectorVec3' }
            rotation: { $ref: '#/components/schemas/DirectorVec3' }
        view:
          type: object
          additionalProperties: true
          description: 只影响视口，不计入渲染指纹。
          properties:
            showLabels: { type: boolean }
            gridSnap:
              type: object
              additionalProperties: true
              properties:
                enabled: { type: boolean }
                step: { type: number, enum: [0.1, 0.25, 0.5, 1] }
            angleSnap:
              type: object
              additionalProperties: true
              properties:
                enabled: { type: boolean }
                step: { type: number, enum: [5, 15, 45] }
            groundSnap: { type: boolean }
        background:
          type: object
          additionalProperties: true
          properties:
            mode: { type: string, enum: [color, panorama] }
            color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            panorama:
              type: object
              additionalProperties: true
              required: [sourceNodeId, mediaId]
              description: mode 为 panorama 时必填。媒体必须是本工作区的图片。
              properties:
                sourceNodeId: { type: string, maxLength: 64 }
                mediaId: { type: string, pattern: '^[0-9]+$' }
                yaw: { type: number, minimum: 0, maximum: 360 }
                radius: { type: number, minimum: 5, maximum: 200 }
        splat:
          type: object
          additionalProperties: true
          required: [mediaId]
          description: 3D 高斯泼溅背景，最多 1 个（DR-F-140）。媒体必须是本工作区上传的导演台素材。
          properties:
            mediaId: { type: string, pattern: '^[0-9]+$' }
            position: { $ref: '#/components/schemas/DirectorVec3' }
            rotation: { $ref: '#/components/schemas/DirectorVec3' }
            scale: { type: number, minimum: 0.01, maximum: 100 }
            visible: { type: boolean }
        ground:
          type: object
          additionalProperties: true
          properties:
            visible: { type: boolean }
            opacity: { type: number, minimum: 0, maximum: 1 }
            height: { type: number, minimum: -100, maximum: 100 }
        lights:
          type: object
          additionalProperties: true
          properties:
            key: { $ref: '#/components/schemas/DirectorLight' }
            fill: { $ref: '#/components/schemas/DirectorLight' }
        objects:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/DirectorSceneObject' }
        outputCameraId:
          type: [string, 'null']
          description: 输出机位，必须指向存在的机位。
        timeline:
          type: object
          additionalProperties: true
          description: 固定 30fps，总时长 30~450 帧（DR-PARAM-10）。
          properties:
            fps: { type: integer, enum: [30] }
            durationFrames: { type: integer, minimum: 30, maximum: 450 }
            loop: { type: boolean }
            tracks:
              type: array
              items: { $ref: '#/components/schemas/DirectorTimelineTrack' }

    Creation:
      type: object
      required: [id, projectId, projectName, resultType, outputCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        projectName: { type: string, description: 空串 = 项目已被彻底删除 }
        nodeId: { type: string }
        resultType: { type: string, enum: [image, video, audio] }
        modelCode: { type: string }
        modelName: { type: string }
        outputCount: { type: integer, minimum: 0 }
        cover:
          type: [object, 'null']
          description: 首个产物（按 idx）。
          properties:
            type: { type: string, enum: [image, video, audio] }
            mediaId: { type: string }
            url: { type: string, description: 受保护端点，不是对象存储直链 }
        createdAt: { type: string, format: date-time }

    LibraryItem:
      type: object
      description: 我的资产里的一项（一次生成的某一项产物）。文本带 `text`；图片 / 视频 / 音频带 `mediaId` 与受保护端点 `url`（fetch 成 blob），视频另有封面帧 `posterMediaId`（还没截出来时没有）。
      required: [id, folderId, generationId, outputIndex, kind, title, tags, rating, projectId, projectName, nodeId, creatorName, modelCode, modelName, prompt, generatedAt, savedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        folderId: { type: [string, 'null'], description: null = 顶层 }
        generationId: { $ref: '#/components/schemas/Id' }
        outputIndex: { type: integer }
        kind: { type: string, enum: [text, image, video, audio] }
        title: { type: string }
        text: { type: string }
        mediaId: { $ref: '#/components/schemas/Id' }
        url: { type: string }
        posterMediaId: { $ref: '#/components/schemas/Id' }
        tags: { type: array, items: { type: string } }
        rating: { type: integer, minimum: 0, maximum: 5, description: 0 = 还没评级 }
        projectId: { type: [string, 'null'] }
        projectName: { type: string, description: 空串 = 项目已被彻底删除 }
        nodeId: { type: string }
        creatorName: { type: string, description: 发起这次生成的人 }
        modelCode: { type: string }
        modelName: { type: string, description: 资产来源（生成用的模型） }
        prompt: { type: string, description: 生成信息（那次生成的提示词） }
        generatedAt: { type: string, format: date-time }
        savedAt: { type: string, format: date-time }
    LibraryItemPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items, total]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/LibraryItem' } }
            total: { type: integer, description: 与列表同一套筛选条件的总数；取不到时为 -1 }
    SaveLibraryItemRequest:
      type: object
      required: [generationId]
      properties:
        generationId: { type: string }
        outputIndex: { type: integer, minimum: 0 }
        title: { type: string, description: 默认「未命名资产」，最多 120 字 }
        text: { type: string, description: 文本产物：卡片上此刻显示的内容 }
        folderId: { type: string }
        tags: { type: array, items: { type: string } }
    LibraryFolder:
      type: object
      required: [id, name, itemCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        itemCount: { type: integer }
        createdAt: { type: string, format: date-time }
    LibraryFolderName:
      type: object
      required: [name]
      properties:
        name: { type: string }
    GenerationMark:
      type: object
      required: [generationId, rating, saved]
      properties:
        generationId: { $ref: '#/components/schemas/Id' }
        rating: { type: integer, description: 0 = 还没评级 }
        saved:
          type: array
          items:
            type: object
            required: [outputIndex, itemId]
            properties:
              outputIndex: { type: integer }
              itemId: { type: string }
    CreationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Creation' }
            total:
              type: integer
              description: 与列表同一套筛选条件的总数；取不到时为 -1

    CursorPage:
      type: object
      description: |
        游标分页，用于用户端滚动列表。**不用 offset**：边滚边有新任务成功时
        offset 会让同一条记录重复出现或被跳过。管理端表格另用 page/size（需要总数与跳页）。
      required: [items, nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    # ---------- 认证 ----------
    AccountRef:
      type: object
      description: |
        账号标识：手机号与邮箱**至少填一项**。
        刻意不用 `{channel, identifier}` 的二元组 —— 那要求调用方先判断自己填的是什么，
        而服务端仍要再判一次；两处判断迟早不一致。字段名自带语义，校验规则也能各自写清楚。
      properties:
        phone: { type: string }
        email: { type: string, format: email }

    LoginReq:
      allOf:
        - $ref: '#/components/schemas/AccountRef'
        - type: object
          properties:
            password: { type: string, description: 密码登录 }
            code: { type: string, description: 验证码登录 }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }

    CurrentUser:
      type: object
      required: [id, nickname, status, isAiWatermarkOff, defaultWorkspaceId]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        nickname: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'], description: 已脱敏 }
        avatarUrl: { type: [string, 'null'] }
        status: { type: string, enum: [active, banned] }
        isAiWatermarkOff: { type: boolean }
        defaultWorkspaceId: { $ref: '#/components/schemas/Id' }

    # ---------- 工作区 ----------
    Workspace:
      type: object
      required: [id, name, kind, role, payerAccountId]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        kind: { type: string, enum: [personal, team] }
        role: { type: string, enum: [owner, admin, editor, viewer] }
        payerAccountId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: 费用承担账户。个人与团队工作区指向不同的 payer_account（NEW-20）。

    # ---------- 门户内容 ----------
    HomeBanner:
      type: object
      required: [id, title, linkUrl, sort]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        linkUrl: { type: string }
        mediaObjectId: { type: string }
        coverMediaId: { type: string }
        sort: { type: integer }

    RecentProject:
      type: object
      required: [id, name, updatedAt, agent, origin]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        coverMediaId: { type: string, description: 用户显式设置的封面；空串表示没设 }
        displayCoverMediaId:
          type: string
          description: |
            展示用封面 = 显式封面 ?? 最近一次成功的产出（视频与成片取封面帧，CD-83）?? 复制时继承的封面；空串表示都没有。
            与 `Project.displayCoverMediaId` 是**同一个** SQL 函数算的，首页与全部项目页不会对不上。
        folderId:
          type: string
          description: |
            所在文件夹，空串 = 未分类。卡片「⋯」菜单靠它决定给「移动至文件夹」还是「移出文件夹」。
        updatedAt: { type: string, format: date-time }
        origin:
          type: [string, 'null']
          enum: [marketing, null]
          description: |
            项目来源（MKD-3，与 `Project.origin` 同一列同一取值）：null = 未记录，`marketing` = 营销会话建的项目。
            首页卡片据此显示「营销」角标（MKT-T-32；与全部项目页同一个 `projectBadgeVariant`）。服务端总会输出（null 也输出）。
        agent:
          description: |
            最近活跃的 Agent 会话，没有会话时为 null（AGT-45）。与 `ProjectListItem.agent` 是画布域**同一条**查询规则
            （内容域经端口取），首页与全部项目页点进的是同一个会话。取失败时降级为 null（首页不报错）。
          oneOf:
            - $ref: '#/components/schemas/ProjectAgentSummary'
            - type: 'null'

    ShowcaseItem:
      type: object
      required: [id, title, hasMedia, type, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        hasMedia:
          type: boolean
          description: |
            ⚠️ 这里**不给 mediaObjectId** —— 那是受保护端点的 ID，访客拿着它
            一律 401。取图走 `/showcase/{id}/media`，可见性由加精划定。
        type:
          type: string
          enum: [image, video, audio, other]
          description: |
            媒体类型，由服务端按媒体的 content_type 推导（AGT-41）；无媒体或认不出的为
            `other`。前端据此选 `<img>` / `<video>` / 占位，不自己猜。
        createdAt: { type: string, format: date-time }

    Message:
      type: object
      required: [id, source, type, title, content, linkUrl, refType, refId, isRead, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        source:
          type: string
          enum: [notification, announcement]
          description: |
            消息来自哪张表。⚠️ **标已读时必须原样回传** ——
            两张表的 id 在同一个空间里无从区分。
        type: { type: string, description: 业务类型；前端遇未知值应回落到「通知」而不是显示原始值。 }
        title: { type: string }
        content: { type: string }
        linkUrl: { type: string }
        refType: { type: string }
        refId: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    TaskState:
      type: string
      enum: [queued, running, success, partial_success, failed, cancelled]
      description: |
        **统一**任务状态（P13-02）。四类任务的原始状态词表并不一致
        （export 用 `pending`、workflow 多一个 `partial_success`），
        映射**只在服务端做一处**（`content/domain.NormalizeState`）。

        ⚠️ `partial_success` 不能摊平成 success 或 failed（AV-24）：
        说成成功用户不会去翻那条失败的，说成失败他会把已经成功的也重跑一遍。

        ⚠️ 未知原始值一律归 `failed` 而不是静默丢掉那一行：
        丢掉的话用户的任务**从列表里消失了**，而他明明扣了积分。

    TaskItem:
      type: object
      required: [id, kind, state, title, credits, error, refId, createdAt, terminal]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind:
          type: string
          enum: [generation, workflow, render, export]
          description: |
            ⚠️ `id` 只在**同一类**里唯一 —— 四张表各有各的主键空间。
            前端去重与 `:key` 都要用 `(kind, id)` 两段。
        state: { $ref: '#/components/schemas/TaskState' }
        title: { type: string, description: '生成取操作名，渲染/导出取任务标题；可能为空。' }
        credits: { type: integer, description: 这条任务消耗的积分（已退款的不在这里抵扣）。 }
        error: { type: string, description: '失败原因**原样**给出；统一成「任务失败」的话用户不知道下一步做什么。' }
        refId:
          type: string
          description: 业务引用（整图运行指向项目、渲染指向时间线），供详情入口跳转。
        createdAt: { type: string, format: date-time }
        terminal:
          type: boolean
          description: |
            是否终态。⚠️ **服务端给**，不让前端按状态串自己判 ——
            新增一个终态时前端会漏掉，而漏掉的表现是它一直轮询一个
            永远不再变的任务（开着页面一晚上就是上万次无谓请求）。

    Work:
      type: object
      required: [id, sourceType, sourceId, title, reviewStatus, isFeatured, isOffline,
                 reviewReason, hasMedia, submittedAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sourceType: { type: string, enum: [generation, render] }
        sourceId: { type: string }
        title: { type: string }
        reviewStatus:
          type: string
          enum: [pending, approved, rejected]
          description: |
            ⚠️ **审核结论**，与"当前是否可见"是两件事。下架用独立的
            `isOffline` 位 —— 把审核状态改回 `rejected` 的话两者再也分不开，
            重新上架时不知道该恢复成什么。
        isFeatured:
          type: boolean
          description: |
            ⚠️ **加精才是公开发布的那一次决定**。公开可见 =
            `approved ∧ featured ∧ ¬offline`，三个条件缺一不可 ——
            审核只回答"有没有违规"。
        isOffline: { type: boolean }
        reviewReason:
          type: string
          description: 驳回/下架的原因，**原样给作者看**；不给的话他只能来问客服。
        hasMedia:
          type: boolean
          description: ⚠️ 与公开墙一致，**不下发 mediaObjectId**。
        submittedAt: { type: string }
        createdAt: { type: string, format: date-time }
        authorUserId:
          type: string
          description: 仅后台详情返回；从**来源任务反查**，不在 work 上另存一列。

    AdminUser:
      type: object
      required: [id, nickname, status, isAiWatermarkOff, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        nickname: { type: string }
        phone: { type: string, description: ⚠️ **脱敏**。后台要的是"认出是哪个人"，不是拿到完整联系方式。 }
        email: { type: string, description: ⚠️ **脱敏**。 }
        status: { type: string, enum: [active, banned] }
        isAiWatermarkOff:
          type: boolean
          description: |
            用户是否关掉了 AI 水印。⚠️ 后台**只读显示**，改不了 ——
            那是用户自己的选择（用户端 `/account` 里开关），
            给后台一条改它的路径等于允许"替用户关掉 AI 标识"。
        createdAt: { type: string, format: date-time }

    AdminAccount:
      type: object
      required: [id, username, status, roles, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        status: { type: string, enum: [active, disabled] }
        roles: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    AdminRole:
      type: object
      required: [code, name, permissions]
      properties:
        code: { type: string }
        name: { type: string }
        permissions: { type: array, items: { type: string } }

    APIRequestLog:
      type: object
      required: [id, traceId, method, path, httpStatus, bizCode, durationMs,
                 ip, requestBody, failed, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        traceId:
          type: string
          description: |
            ⚠️ 同一个 traceId 要能串起「API 请求 → 生成任务 → Provider 调用」
            （AC-26）—— 所以日志中间件必须挂在 TraceID 之后。
        method: { type: string }
        path: { type: string }
        httpStatus: { type: integer }
        bizCode:
          type: integer
          description: |
            业务码；0 表示成功。⚠️ 它的意义是**分类**：40001/40002 在 HTTP 上
            都只是一个 400，而日志要回答"今天这批 400 里哪一类最多"。
        durationMs: { type: integer }
        userId:
          type: string
          description: |
            ⚠️ 缺席表示"这次是匿名访问"，是**正常结果**不是缺陷。
            user token 与 admin token 是**两个主体空间**，同一个数字在两边
            指的是不同的人 —— 所以分两列。
        adminId: { type: string }
        workspaceId: { type: string }
        ip:
          type: string
          description: |
            ⚠️ 来自 `X-Forwarded-For`（取第一个），**客户端可伪造** ——
            只用于排障参考，**不能拿来做任何授权判断**。
        requestBody:
          type: string
          description: |
            已脱敏 + 截断；内嵌 base64 替换为摘要（一张内联参考图 base64 后
            数 MB，原样入库一条就能把表撑爆）。**没有响应体** —— 缓存它等于
            在内存里再复制一份产出。
        failed: { type: boolean, description: 服务端算，前端不再按状态码判一遍。 }
        createdAt: { type: string, format: date-time }

    ProviderRequestLog:
      type: object
      required: [id, traceId, provider, model, operation, url, httpStatus,
                 errorType, durationMs, requestBody, responseBody, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        traceId: { type: string }
        generationId: { type: string }
        provider: { type: string }
        model: { type: string }
        operation: { type: string }
        url: { type: string }
        httpStatus: { type: integer }
        errorType:
          type: string
          enum: [none, timeout, connect, dns, http, stream, decode]
          description: |
            ⚠️ **这一列才是"这次调用成没成"的依据**，不能只看 httpStatus：
            上游的业务错误常藏在 HTTP 200 里（可灵在 `code`、方舟在
            `error.message`），而超时/断连根本没有状态码。
            它同时驱动重试决策（408/429/5xx 可重试，401/403/4xx 不可）。
        durationMs: { type: integer }
        requestBody: { type: string, description: 已脱敏 + 截断。 }
        responseBody: { type: string }
        createdAt: { type: string, format: date-time }

    AuditRecord:
      type: object
      required: [id, actorType, action, objectType, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        actorType: { type: string, enum: [user, admin, system] }
        actorId: { type: string }
        action: { type: string, description: '点分动作，如 `task.compensate`、`project.delete`。' }
        objectType: { type: string }
        objectId: { type: string }
        before: { description: 变更前（任意 JSON）。 }
        after: { description: 变更后（任意 JSON）。⚠️ **绝不含密钥**。 }
        reason: { type: string }
        traceId: { type: string }
        createdAt: { type: string, format: date-time }

    StatsOverview:
      type: object
      required: [from, to, totals, generationSuccessRate, renderSuccessRate, byProvider]
      properties:
        from:
          type: string
          format: date-time
          description: |
            ⚠️ 回的是**实际用的**范围：传了非法值时它会被校正（缺省补齐、
            倒置交换、跨度夹到 370 天）—— 不回的话前端画出来的图与标题上的
            日期对不上。
        to: { type: string, format: date-time }
        totals:
          type: object
          required: [activeUsers, creditsConsumed, creditsRefunded, generations,
                     generationSuccess, generationFailed, generationCancelled,
                     renders, renderSuccess, paidOrders, revenueCents,
                     refundedCents, providerCalls, providerErrors]
          properties:
            activeUsers:
              type: integer
              format: int64
              description: ⚠️ **产生过消费或产出的人**，不是"登录过的人"。
            creditsConsumed: { type: integer, format: int64, description: ⚠️ 只认账本，不按业务表的报价列相加。 }
            creditsRefunded: { type: integer, format: int64, description: ⚠️ 与消耗**分开给，不合并成净值**。 }
            generations: { type: integer, format: int64 }
            generationSuccess: { type: integer, format: int64 }
            generationFailed: { type: integer, format: int64 }
            generationCancelled:
              type: integer
              format: int64
              description: ⚠️ **单列不并进失败**：取消是用户行为不是故障。
            renders: { type: integer, format: int64 }
            renderSuccess: { type: integer, format: int64 }
            paidOrders: { type: integer, format: int64 }
            revenueCents:
              type: integer
              format: int64
              description: ⚠️ **只算已支付的**，按 `paid_at` 归属；退款额单列不减掉。
            refundedCents: { type: integer, format: int64 }
            providerCalls:
              type: integer
              format: int64
              description: |
                ⚠️ **调用次数不是成本**。真实成本要各 Provider 的单价，
                而那是 PARAM-04 未定稿的内容 —— 前端标题必须写"调用次数"。
            providerErrors: { type: integer, format: int64 }
        generationSuccessRate:
          type: number
          description: |
            ⚠️ **-1 表示"还没有数据"，不是 0%**。两者在看板上长得一模一样，
            一个是"全挂了"，一个是"今天没人用" —— 前端据此显示「—」。
            分母是 success + failed，**不含 cancelled**。
        renderSuccessRate: { type: number }
        byProvider:
          type: array
          items:
            type: object
            required: [provider, calls, errors, avgDurationMs]
            properties:
              provider: { type: string }
              calls: { type: integer, format: int64 }
              errors: { type: integer, format: int64 }
              avgDurationMs:
                type: integer
                format: int64
                description: |
                  平均耗时。⚠️ 会被一两条极慢的请求带偏，但够用来发现
                  "某家突然变慢了"；要定位得看 P95，随 P14 一起做。

    # ---------- 用量审计 ----------
    # ---------- 在线状态 ----------
    # ---------- 资源共享 ----------
    # ---------- 项目 ----------
    Project:
      type: object
      required: [id, workspaceId, name, version, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        workspaceId: { $ref: '#/components/schemas/Id' }
        createdByUserId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        coverMediaId:
          type: [string, 'null']
          description: |
            **用户显式设置**的封面（`PATCH /projects/{id}` 写入）。卡片上要显示的是
            `displayCoverMediaId`，不是这个 —— 绝大多数项目从来没人手动设过封面。
            ⚠️ 此前契约里这里写的是 `coverUrl`，而实现从来发的都是 `coverMediaId`（P15-02 更正）。
        displayCoverMediaId:
          type: [string, 'null']
          description: |
            **展示用封面** = 显式封面 ?? 项目里最近一次成功的产出 ?? 复制时继承的封面；
            产出是图片就用图本身，是视频或成片就用它的**封面帧**（默认最后一帧、黑场往前找，Worker 截好存成
            派生图片，迁移 00048 / CD-83）—— 所以这里永远是一张图。都没有时为 null（显示占位）。副本按设计不拥有源项目的生成记录，没有「继承」这一级的话
            副本永远是占位图（迁移 00031）。
            由服务端算（SQL 函数 `project_display_cover`，迁移 00030），**前端不要自己拼**这条规则 ——
            首页、AI 视频页、全部项目页三处各写一遍的话，早晚会有一页的封面和别处不一样。
            显式封面被删掉时**退回自动挑选**而不是给出一个取不到的 ID。
            取字节走 `GET /media/{id}`（受保护端点，要带 `X-Workspace-Id`），列表请带 `?w=320`。
        folderId: { type: [string, 'null'] }
        canvasData:
          type: [object, 'null']
          additionalProperties: true
          description: 列表接口不返回，详情接口返回
        version:
          type: integer
          description: 服务端乐观锁。**与 canvasData.schemaVersion 是两件事，不可混用**（GO-36）。
        status:
          type: string
          enum: [active, deleted]
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: |
            软删时间。**保留期一律按它算，不按 updatedAt** —— 恢复、改名、移动文件夹
            都会刷 updatedAt，用它算的话「删了又恢复又删」的项目每次重获保留期，永远清不掉。
        origin:
          type: [string, 'null']
          enum: [marketing, null]
          description: |
            项目从哪个入口建的（MKD-3，迁移 00058）。null = 未记录（历史项目与创造页 / 空白画布 / MCP 等入口）；
            `marketing` = 营销会话建的项目。**建项目时写入、建后不可改**；服务端总会输出该字段（null 也输出）。
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectAgentSummary:
      type: object
      description: |
        项目**最近活跃**的那个 Agent 会话（按 lastActiveAt 倒序取第一个，已取消的也算）。
        卡片据此显示「✦ Agent」角标、副标题（会话标题 + 状态），点击进 `/video/chat/{projectId}?session={sessionId}`。
      required: [sessionId, title, state, lastActiveAt]
      properties:
        sessionId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        state: { $ref: '#/components/schemas/AgentSessionState' }
        lastActiveAt: { type: string, format: date-time }

    ProjectListItem:
      description: |
        列表里的项目：`Project` + `agent`。⚠️ `agent` **只有列表接口给**（`GET /projects`、`/projects/trash`）；
        详情 / 新建 / 改名不计算会话，不要拿那几处的项目去判断类型。
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [agent]
          properties:
            agent:
              description: 没有任何 Agent 会话时为 null（普通画布项目）。
              oneOf:
                - $ref: '#/components/schemas/ProjectAgentSummary'
                - type: 'null'

    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectListItem' }

    Folder:
      type: object
      required: [id, name, projectCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        sort: { type: integer }
        projectCount:
          type: integer
          description: 夹内活动项目数（不含回收站里的）
        createdAt: { type: string, format: date-time }

    ProjectTemplate:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sort: { type: integer }

    # ---------- 画布配置 ----------
    MaterialItem:
      description: |
        素材目录里的一项（风格 / 特效 / 运镜）。⚠️ **没有提示词**：拼接在服务端完成。
      type: object
      required: [code, name, isCommercial, isFavorited]
      properties:
        code: { type: string, description: '素材码：节点里存它（运镜存在 `params.camera.code`）' }
        name: { type: string }
        category: { type: string }
        author: { type: string }
        isCommercial: { type: boolean }
        coverUrl:
          type: string
          description: 封面（受保护媒体，取图要带鉴权与工作区头）；没配封面时没有这个字段。
        isFavorited: { type: boolean }
    ModelParams:
      description: 一个模型的型号级参数覆盖（参数合并的第三层，见 `GET /models/{code}/params`）。
      type: object
      required: [modelCode, override]
      properties:
        modelCode: { type: string }
        override:
          type: object
          description: |
            按参数 code 索引的控件配置片段（形状同 `param_def.config`：`options` / `default` / `unit` …），
            逐字段覆盖前两层。模型没配任何覆盖时是空对象。

            `restrictBy`（可选）表达**参数之间的约束**：
            `{"restrictBy":{"resolution":{"1080p":["16:9","9:16","1:1"]}}}` 写在画幅上，
            意思是「清晰度为 1080p 时画幅只能选这三种」。前端据此禁用选不了的项，
            并在另一项改动后把失效的值校正回可选范围。
          additionalProperties:
            type: object
            additionalProperties: true
    CanvasConnectionValidateRequest:
      type: object
      required: [targetType, inputs]
      properties:
        targetType: { type: string, description: 目标节点类型（node_type.code） }
        mode: { type: string, description: 视频节点所选模式；视频目标必填 }
        inputs:
          type: array
          description: 全部入边，order 从 1 起连续且唯一
          items:
            type: object
            required: [order, sourceType]
            properties:
              order: { type: integer, minimum: 1 }
              sourceType: { type: string, description: 源节点类型（node_type.code） }
    CanvasConnectionValidateResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        operation: { type: string, description: 建议的默认操作；判定不出时缺省 }
        reason: { type: string, description: 不合法时的原因 }
    CanvasConfig:
      description: |
        服务端合成的画布配置快照。⚠️ 参数**嵌在各自的 nodeType 下**，不是顶层的平铺数组 ——
        参数属于节点类型，平铺后前端还要自己按 nodeTypeId 归组，等于把服务端已经做完的
        合并（`param_def.config < node_param.config_override`）再拆开一次。
      type: object
      required: [revision, nodeTypes, connectionRules]
      properties:
        revision: { type: integer }
        nodeTypes:
          type: array
          items: { $ref: '#/components/schemas/NodeTypeConfig' }
        connectionRules: { type: array, items: { type: object, additionalProperties: true } }
        imagePresets: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        videoModes: { type: array, items: { type: string } }
        imageTools: { $ref: '#/components/schemas/ImageToolsConfig' }

    NodeTypeConfig:
      type: object
      required: [code, name, kind]
      properties:
        code: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [generator, material, composite]
        icon: { type: string }
        sort: { type: integer }
        isEnabled: { type: boolean }
        params:
          type: array
          items: { $ref: '#/components/schemas/NodeParamConfig' }

    NodeParamConfig:
      description: |
        一个控件的最终形态。前端按 `control` 查表渲染，**不写死表单**；
        遇未知 control/code 一律忽略并告警 —— 配置可以比前端新，前端不能因此崩。
      type: object
      required: [code, name, control, config]
      properties:
        code: { type: string }
        name: { type: string }
        control:
          type: string
          enum: [select, segmented, slider, grid, tag_group, switch, dialog, button, upload, inline, text]
        group: { type: string, description: 面板分区；advanced 默认折叠 }
        sort: { type: integer }
        isRequired: { type: boolean }
        defaultValue: { type: string }
        config:
          description: |
            合并后的控件配置。**数量与体积上限写在这里**（如参考图的 `maxCount`/`maxSize`）——
            在前端写死张数就是把配置驱动作废，调一个数都要发版。
            `domainFrom` 表示大列表懒加载（models / voices / materials / imagePresets）。
          type: object
          additionalProperties: true
        imagePresets: { type: array, items: { type: object, additionalProperties: true } }

    # ---------- 生成 ----------
    GenerationStatus:
      type: string
      enum: [queued, running, success, failed, cancelled]
      description: |
        **`cancelled` 是独立终态**，不再用 `failed + errorCode=cancelled` 表达。
        审核状态不在此枚举内——那属于 work.reviewStatus，不是任务状态。

    GenerationInput:
      type: object
      description: |
        输入引用。客户端给的 URL/objectKey **一律不可信**（GO-27）：
        服务端按 generationId / referenceId / scriptAssetId 解析成同工作区的可信资源。
      required: [order, type]
      properties:
        order:
          type: integer
          minimum: 1
          description: 从 1 起连续且唯一；决定首尾帧与参考图锚定顺序，不可丢失
        type: { type: string, enum: [text, image, audio, video] }
        text: { type: [string, 'null'] }
        generationId: { type: [string, 'null'] }
        referenceId: { type: [string, 'null'] }
        scriptAssetId: { type: [string, 'null'] }
        rangeMs:
          type: array
          items: { type: integer, minimum: 0 }
          minItems: 2
          maxItems: 2
          description: 只用素材的哪一段（`[起点, 终点]` 毫秒，只对视频 / 音频有效）；按这一段计价，Worker 截出这一段再发给上游（SCD-34）

    Script:
      type: object
      required: [id, projectId, canvasNodeId, sourceType, currentStep, status, version, shots]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        canvasNodeId: { type: string }
        sourceType: { type: string, enum: [script, character, manual] }
        currentStep: { type: integer, minimum: 1, maximum: 3 }
        status: { type: string }
        rawInput: { type: string }
        globalStyle: { type: string }
        assetProfiles:
          description: 全片实体档案。⚠️ 只写"去掉临时状态后仍成立"的稳定事实——当下的服装、持有物、表情属于状态，写进去会让参考图带上一次性信息。
        version: { type: integer }
        shots:
          type: array
          items: { $ref: '#/components/schemas/Shot' }

    Shot:
      type: object
      required: [id, shotNo, durationSec, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        shotNo: { type: integer, minimum: 1, description: 从 1 起连续且唯一 }
        durationSec: { type: integer, minimum: 1, maximum: 60 }
        description: { type: string }
        shotSize: { type: string }
        lighting: { type: string }
        dialogue: { type: string }
        soundEffect: { type: string }
        cameraMove: { type: string }
        startState: { type: string, description: 运动边界：本镜开始时的画面状态 }
        endState: { type: string, description: 运动边界：本镜结束时的画面状态 }
        entities:
          description: 镜头里出现的实体（名字 + 类型），决定下游参考图的锚定顺序
        assetIds:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          description: |
            本镜引用的资产，按参考图锚定顺序（`shot_asset_ref.sort`）。**只在脚本详情里给**，
            且每一镜都给（没有引用就是空数组）；单个镜头的保存响应不带这个字段。
            ⚠️ 前端不要按名字自己去配：锚定顺序只有服务端知道（CD-77）。
        imagePrompt: { type: string }
        imagePromptStatus:
          type: string
          enum: ['', pending, ready, stale, failed]
          description: 脚本详情里是按上游指纹**算出来的有效状态**，与 `GET /scripts/{scriptId}/prompts` 同一个答案（CD-77）
        imagePromptSource: { type: string, enum: ['', ai, template, manual] }
        videoPrompt: { type: string }
        videoPromptStatus:
          type: string
          enum: ['', pending, ready, stale, failed]
          description: 同 imagePromptStatus
        videoPromptSource: { type: string, enum: ['', ai, template, manual] }
        version: { type: integer }

    ScriptCreateRequest:
      type: object
      required: [projectId, canvasNodeId, sourceType]
      properties:
        projectId: { $ref: '#/components/schemas/Id' }
        canvasNodeId: { type: string, minLength: 1 }
        sourceType: { type: string, enum: [script, character, manual] }
        rawInput: { type: string }
        globalStyle: { type: string }

    ScriptPatchRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        rawInput: { type: [string, 'null'] }
        globalStyle: { type: [string, 'null'] }
        currentStep: { type: [integer, 'null'], minimum: 1, maximum: 3 }

    ShotSaveRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        durationSec: { type: [integer, 'null'], minimum: 1, maximum: 60 }
        description: { type: [string, 'null'] }
        shotSize: { type: [string, 'null'] }
        lighting: { type: [string, 'null'] }
        dialogue: { type: [string, 'null'] }
        soundEffect: { type: [string, 'null'] }
        cameraMove: { type: [string, 'null'] }
        startState: { type: [string, 'null'] }
        endState: { type: [string, 'null'] }
        entities: {}

    StoryboardRequest:
      type: object
      required: [modelCode]
      properties:
        modelCode: { type: string }
        shotCount: { type: integer, minimum: 0, description: 0 表示由模型自己定 }
        extraContext: { type: string, description: 手工镜头上下文或角色参考 }

    StoryboardResult:
      allOf:
        - $ref: '#/components/schemas/Script'
        - type: object
          properties:
            llmCallId: { $ref: '#/components/schemas/Id' }
            creditsCost: { type: integer }

    ScriptLlmCall:
      type: object
      required: [id, purpose, status, creditsCost]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        purpose: { type: string, enum: [storyboard_gen, prompt_compose] }
        status: { type: string, enum: [running, success, failed] }
        creditsCost: { type: integer }
        errorMessage: { type: string }

    ShotPrompt:
      type: object
      required: [shotId, shotNo, kind, text, status, source]
      properties:
        shotId: { $ref: '#/components/schemas/Id' }
        shotNo: { type: integer }
        kind: { type: string, enum: [image, video] }
        text: { type: string }
        status:
          type: string
          enum: [pending, ready, stale, failed]
          description: 服务端按上游指纹算出的**有效状态**，不是库里存的那一列
        source: { type: string, enum: [ai, template, manual] }

    ComposeResult:
      type: object
      required: [quote, items]
      properties:
        quote: { $ref: '#/components/schemas/ComposeQuote' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ComposeItem' }

    ComposeQuote:
      type: object
      required: [aiCount, templateCount, skipCount, unitCost, total]
      properties:
        aiCount: { type: integer, description: 走模型合成的条数（收费） }
        templateCount: { type: integer, description: 模板组装的条数（0 积分） }
        skipCount: { type: integer, description: 已就绪且上游未变、被跳过的条数 }
        unitCost: { type: integer, description: 单条单价（积分） }
        total: { type: integer, description: 本次合计（积分） }

    ComposeItem:
      type: object
      required: [shotId, shotNo, kind, status, skipped]
      properties:
        shotId: { $ref: '#/components/schemas/Id' }
        shotNo: { type: integer }
        kind: { type: string, enum: [image, video] }
        status: { type: string, enum: [pending, ready, stale, failed] }
        skipped: { type: boolean }
        reason: { type: string, description: 跳过或失败的原因 }

    GroupSummary:
      type: object
      required: [id, canvasNodeId, groupType, status, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        canvasNodeId: { type: string }
        groupType: { type: string, enum: [asset, storyboard_image, video_generator] }
        name: { type: string }
        status: { $ref: '#/components/schemas/GroupStatus' }
        version: { type: integer }

    GroupStatus:
      type: string
      enum: [draft, running, success, failed, cancelled, partial_success, ungrouped]
      description: |
        按子项算出来的聚合状态。`partial_success` 是独立状态 ——
        部分失败不能被摊平成 success 或 failed（AV-24）。

    Group:
      type: object
      required: [id, projectId, canvasNodeId, groupType, status, version, items]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        canvasNodeId: { type: string }
        groupType: { type: string, enum: [asset, storyboard_image, video_generator] }
        scriptId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        status: { $ref: '#/components/schemas/GroupStatus' }
        version: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupItem' }

    GroupItem:
      type: object
      required: [id, itemNo, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        itemNo: { type: integer }
        shotId: { $ref: '#/components/schemas/Id' }
        assetId: { $ref: '#/components/schemas/Id' }
        generationId: { $ref: '#/components/schemas/Id' }
        status:
          type: string
          enum: [draft, queued, running, success, failed, cancelled, stale]
          description: |
            `stale` 表示这一项依赖的镜头在建组之后改过了。
            不能默默拿旧快照去生成（FLOW-05）：跑出来的画面是用户
            已经改掉的版本，钱花了还得重来。
        progress: { type: integer }
        creditsCost:
          type: integer
          description: 这一项自己花的积分 —— 逐项计费才能逐项重试（AV-22）
        params: { type: object, additionalProperties: true }
        inputs:
          type: array
          items: { type: object, additionalProperties: true }
        errorMessage: { type: string }

    UngroupResult:
      type: object
      required: [id, status, version, nodes]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/GroupStatus' }
        version: { type: integer }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/UngroupNode' }

    UngroupNode:
      type: object
      required: [itemId, itemNo, nodeId, status]
      properties:
        itemId: { $ref: '#/components/schemas/Id' }
        itemNo: { type: integer }
        nodeId:
          type: string
          description: 沿用子项提交时用过的 nodeId，已有 generation 因此仍指向它
        shotId: { $ref: '#/components/schemas/Id' }
        generationId: { $ref: '#/components/schemas/Id' }
        status: { type: string }
        params: { type: object, additionalProperties: true }
        inputs:
          type: array
          items: { type: object, additionalProperties: true }

    WorkflowPlan:
      type: object
      required: [executable, summary, issues, levels, nodes, runCount, reuseCount,
                 skipCount, blockedCount, totalCredits, estimatedSeconds]
      properties:
        executable:
          type: boolean
          description: |
            有 issue 或一个 run 都没有时为 false。
            让用户点一个什么都不会发生的按钮，比禁用它更糟。
        summary:
          type: string
          description: |
            一句话摘要。⚠️ 复用与跳过的条数要说出来 —— 用户选了 12 个节点
            只扣 3 个的钱，不解释他会以为漏跑了，然后去点强制重新生成。
        issues:
          type: array
          items: { $ref: '#/components/schemas/WorkflowIssue' }
        levels:
          type: array
          description: 并行分层；同层节点互不依赖，可并发
          items:
            type: array
            items: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/WorkflowPlanNode' }
        runCount: { type: integer }
        reuseCount: { type: integer }
        skipCount: { type: integer }
        blockedCount: { type: integer }
        totalCredits:
          type: integer
          description: 只累计 action=run 的节点
        estimatedSeconds:
          type: integer
          description: 关键路径估算（每层取最大值再相加），不是耗时之和

    WorkflowIssue:
      type: object
      required: [code, nodes, message]
      properties:
        code:
          type: string
          enum: [cycle, dangling_edge, no_operation, no_model, unknown_node, empty_target]
        nodes:
          type: array
          items: { type: string }
          description: 具体涉及哪些节点 —— 前端据此高亮
        message: { type: string }

    WorkflowPlanNode:
      type: object
      required: [nodeId, kind, action, reason, level, credits, estimatedSeconds, dependsOn]
      properties:
        nodeId: { type: string }
        kind: { type: string }
        action: { type: string, enum: [run, reuse, skip, blocked] }
        reason:
          type: string
          description: 为什么是这个处置 —— 不能只给一个状态字
        operation: { type: string }
        modelCode: { type: string }
        level: { type: integer }
        credits: { type: integer }
        estimatedSeconds: { type: integer }
        dependsOn:
          type: array
          items: { type: string }
        blockers:
          type: array
          items: { type: string }
          description: |
            这个节点不可调用的**具体原因**（模型停用、没配价、
            会员等级不够、协议不支持该操作…）。只说"不可用"的话，
            用户不知道该去后台改哪一项。

    WorkflowRunSummary:
      type: object
      required: [id, status, totalCredits]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/WorkflowRunStatus' }
        totalCredits: { type: integer }

    WorkflowRunStatus:
      type: string
      enum: [pending, running, success, partial_success, failed, cancelled]

    WorkflowRun:
      type: object
      required: [id, projectId, status, totalCredits, nodes]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/WorkflowRunStatus' }
        totalCredits:
          type: integer
          description: 逐节点累加；复用的节点不计费（NEW-05）
        nodes:
          type: array
          items: { $ref: '#/components/schemas/WorkflowNodeRun' }
        cost: { $ref: '#/components/schemas/WorkflowRunCost' }

    WorkflowRunCost:
      type: object
      required: [spent, refunded, reused, succeeded, failed, running, failures]
      properties:
        spent:
          type: integer
          description: 真正花掉的（成功的 + 还在跑的 —— 预扣即消费）
        refunded:
          type: integer
          description: |
            失败/取消/被卡住的那些扣过又退了。
            ⚠️ **单列而不是从 spent 里减掉**：用户要看到"扣过、退了"，
            而不是"好像从来没扣过" —— 后者会让他对不上账本流水。
        reused:
          type: integer
          description: 因为复用而没跑的节点数（没跑就没有价，只数次数）
        succeeded: { type: integer }
        failed:
          type: integer
          description: 自己失败的个数；被上游卡住的（blocked）不计入
        running: { type: integer }
        failures:
          type: array
          description: 逐条失败说明 —— 部分失败必须可解释
          items:
            type: object
            required: [nodeId, message]
            properties:
              nodeId: { type: string }
              code: { type: string }
              message: { type: string }

    WorkflowNodeRun:
      type: object
      required: [nodeId, status, attempt, creditsCost, isReused]
      properties:
        nodeId: { type: string }
        status:
          type: string
          enum: [pending, running, success, failed, skipped, blocked, cancelled]
        attempt: { type: integer }
        generationId:
          $ref: '#/components/schemas/Id'
        creditsCost: { type: integer }
        isReused:
          type: boolean
          description: 复用了上次产出 —— 状态是 skipped 且不计费
        errorCode: { type: string }
        errorMessage: { type: string }

    ScriptExport:
      type: object
      required: [schemaVersion, exportedAt, script, shots, assets, groups]
      properties:
        schemaVersion:
          type: integer
          description: 导出格式版本；与脚本的乐观锁 version 是两件事
        exportedAt: { type: string, format: date-time }
        script:
          type: object
          required: [id, projectId, canvasNodeId, sourceType, currentStep]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            projectId: { $ref: '#/components/schemas/Id' }
            canvasNodeId: { type: string }
            sourceType: { type: string }
            currentStep: { type: integer }
            rawInput: { type: string }
            globalStyle: { type: string }
        assetProfiles:
          description: 全片资产档案原文（模型产出，原样带走）
        shots:
          type: array
          items: { $ref: '#/components/schemas/ScriptExportShot' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/ScriptExportAsset' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ScriptExportGroup' }
        warnings:
          type: array
          items: { type: string }
          description: |
            这份导出不完整的说明（过期/未合成的提示词条数）。
            ⚠️ 写进**文件本身**而不是只在界面上提示：文件传给别人、
            或者半年后自己再打开，就没人知道当时有几镜没出来。

    ScriptExportShot:
      type: object
      required: [id, shotNo, durationSec, description, imagePrompt, videoPrompt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        shotNo: { type: integer }
        durationSec: { type: integer }
        description: { type: string }
        shotSize: { type: string }
        lighting: { type: string }
        cameraMove: { type: string }
        dialogue: { type: string }
        soundEffect: { type: string }
        startState: { type: string }
        endState: { type: string }
        entities: { description: 镜头实体（模型结构化产出） }
        imagePrompt: { $ref: '#/components/schemas/ScriptExportPrompt' }
        videoPrompt: { $ref: '#/components/schemas/ScriptExportPrompt' }
        assetRefs:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          description: 按引用顺序 —— 顺序即参考图的锚定顺序，丢了就没法复现

    ScriptExportPrompt:
      type: object
      required: [text, status]
      properties:
        text: { type: string }
        status:
          type: string
          enum: [pending, ready, stale, failed]
          description: 服务端按上游指纹算出的**有效状态**，不是库里那一列
        source: { type: string, enum: [ai, template, manual] }

    ScriptExportAsset:
      type: object
      required: [id, name, type, description, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        status: { type: string }
        source: { type: string }
        mediaId:
          $ref: '#/components/schemas/Id'

    ScriptExportGroup:
      type: object
      required: [id, canvasNodeId, groupType, status, items]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        canvasNodeId: { type: string }
        groupType: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/GroupStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ScriptExportGroupItem' }

    ScriptExportGroupItem:
      type: object
      required: [itemNo, status, creditsCost]
      properties:
        itemNo: { type: integer }
        shotId: { $ref: '#/components/schemas/Id' }
        assetId: { $ref: '#/components/schemas/Id' }
        generationId: { $ref: '#/components/schemas/Id' }
        status: { type: string }
        creditsCost: { type: integer }
        params: { type: object, additionalProperties: true }
        inputs:
          type: array
          items: { type: object, additionalProperties: true }
        errorMessage: { type: string }

    ScriptAsset:
      type: object
      required: [id, type, name, source, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [character, scene, prop] }
        name: { type: string, description: 要能在镜头描述里被 @ 引用，长度上限与实体名一致 }
        description:
          type: string
          description: |
            `名称 / 外形 / 服装或氛围 / 识别特征` + **代码固定的构图规范**。
            ⚠️ 版式由代码拼、不让模型写：让模型写的话它会给角色塞武器、给空场景加人，
            而资产图的全部价值就是下游每一镜拿它当参考。
        profile:
          description: |
            全片档案。⚠️ 只写"去掉临时状态后仍成立"的稳定事实 ——
            当下的服装、持有物、表情属于状态，写进去会让参考图带上一次性信息。
        mediaId: { $ref: '#/components/schemas/Id' }
        url: { type: string, description: 媒体字节的受保护端点 }
        source: { type: string, enum: [ai, upload, template] }
        status: { type: string, enum: [pending, generating, ready, failed] }
        lints:
          type: array
          description: 质量提示，**不拦截请求**
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }

    ReconcileResult:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items: { $ref: '#/components/schemas/ScriptAsset' }
        unmatched:
          type: array
          items: { type: string }
          description: |
            镜头里出现但模型没给档案的实体名 —— 这些资产退回了模板描述。
            ⚠️ 不是错误，是该让用户知道的事实：他需要自己补一句外观。
        orphan:
          type: array
          items: { $ref: '#/components/schemas/ScriptAsset' }
          description: |
            本次镜头中不再出现的旧资产。⚠️ **只报不删**：用户可能刚删掉某一镜、
            正准备加回来，而资产图是花钱生成的。

    AssetBatchItem:
      type: object
      required: [assetId, name, skipped]
      properties:
        assetId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        generationId: { $ref: '#/components/schemas/Id' }
        skipped: { type: boolean }
        reason: { type: string, description: 被跳过或被停掉的原因 }

    GenerationEstimateRequest:
      type: object
      description: |
        报价请求（与服务端实际读取的字段一致）。`inputs` 是各输入角色的数量（如 `{image: 1}`）。
        图片节点工具条（docs/agent/imagetools R-5）：带 `tool` 时按图生图（img2img）报价，张数由工具选项定。
      required: [modelCode]
      properties:
        modelCode: { type: string }
        operation: { type: string }
        count: { type: integer, minimum: 1 }
        durationSec: { type: integer, minimum: 0 }
        text: { type: string }
        inputs: { type: object, additionalProperties: { type: integer } }
        tool: { type: string, enum: [multi_angle, relight, expression_edit, upscale] }
        toolOptions:
          oneOf:
            - { $ref: '#/components/schemas/MultiAngleOptions' }
            - { $ref: '#/components/schemas/RelightOptions' }
            - { $ref: '#/components/schemas/ExpressionOptions' }
            - { $ref: '#/components/schemas/UpscaleOptions' }

    GenerationRequest:
      type: object
      required: [projectId, nodeId, operation, modelCode]
      properties:
        projectId: { $ref: '#/components/schemas/Id' }
        nodeId: { type: string }
        operation: { type: string }
        modelCode: { type: string }
        params:
          type: object
          additionalProperties: true
          description: |
            原样保存后再做领域校验；未知字段保留。

            图片节点工具条（docs/agent/imagetools R-5）：`tool` 为工具码时操作码一律按图生图（img2img），`toolOptions` 按工具
            校验并翻译成提示词；`output` / `toolCrop` 只由服务端写，客户端传来的同名键丢弃。
          properties:
            tool: { type: string, enum: [multi_angle, relight, expression_edit, upscale] }
            toolOptions:
              oneOf:
                - { $ref: '#/components/schemas/MultiAngleOptions' }
                - { $ref: '#/components/schemas/RelightOptions' }
                - { $ref: '#/components/schemas/ExpressionOptions' }
                - { $ref: '#/components/schemas/UpscaleOptions' }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/GenerationInput' }
        count: { type: integer, minimum: 1, maximum: 8, default: 1 }

    QuickGenerationRequest:
      type: object
      required: [mode, modelCode]
      description: |
        数量与时长不单独传：服务端从 `params.count` / `params.duration` 取（与画布节点同一条规则），
        报价时前端也按同一规则算，所以「发送前显示的金额」与受理扣的是同一个数。
      properties:
        mode: { type: string, enum: [video, image, audio] }
        modelCode: { type: string }
        operation:
          type: string
          description: 用户显式选的参考模式（视频的首尾帧 / 全参考等）；空则按附件张数推荐。与附件对不上时 400
        text: { type: string, description: 正文；项目名取前 20 字 }
        params:
          type: object
          additionalProperties: true
          description: 参数行的取值（与画布节点 params 同形），原样写进节点
        inputs:
          type: array
          maxItems: 16
          description: 附件只收上传得到的 referenceId（GO-27），不收 URL
          items: { $ref: '#/components/schemas/QuickGenerationInput' }

    QuickGenerationInput:
      type: object
      required: [referenceId]
      properties:
        kind: { type: string, enum: [reference] }
        referenceId: { $ref: '#/components/schemas/Id' }
        order: { type: integer, minimum: 1 }
        name: { type: string, description: 仅用于节点上的显示 }

    QuickGenerationResult:
      type: object
      required: [projectId, nodeId, accepted, replayed]
      properties:
        projectId: { $ref: '#/components/schemas/Id' }
        nodeId: { type: string }
        generationId: { $ref: '#/components/schemas/Id' }
        accepted: { type: boolean, description: 受理是否成功；false 时项目与节点已建，节点标失败 }
        replayed: { type: boolean }
        creditsCost: { type: integer, minimum: 0, description: 本次受理扣的积分（重放不回） }
        error:
          type: object
          required: [code, message]
          description: 受理失败的服务端原话（accepted=false 时）
          properties:
            code: { type: integer }
            name: { type: string }
            message: { type: string }

    GenerationQuote:
      type: object
      required: [creditsCost, estimatedSeconds, balanceAfter, isAffordable]
      properties:
        creditsCost: { type: integer, minimum: 0 }
        estimatedSeconds: { type: integer, minimum: 0 }
        balanceAfter: { type: integer }
        isAffordable: { type: boolean }
        unit: { type: string, enum: [per_time, per_image, per_second, per_kchar] }

    GenerationOutput:
      type: object
      required: [index, type]
      description: |
        ⚠️ 返回**全部产物**，不隐式只给 outputs[0]（GO-40）：
        多产物模型一次出四张图，只显示第一张等于把另外三张白白扣掉的积分丢了。
      properties:
        index: { type: integer, minimum: 0 }
        type: { type: string, enum: [image, video, audio, text] }
        text: { type: string, description: 仅文本产物 }
        mediaId: { $ref: '#/components/schemas/Id' }
        url:
          type: string
          description: |
            媒体字节的**受保护端点**（`/api/v1/media/{mediaId}`），不是对象存储直链。
            ⚠️ 不要指向 `/generations/{id}/outputs/{index}` —— 那个回的是元信息 JSON，
            前端把它当图片渲染只会得到一张裂图。文本产物没有这个字段。

    GenerationOutputDetail:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [image, video, audio, text] }
        text: { type: string, description: 仅文本产物 }
        mediaId: { $ref: '#/components/schemas/Id' }
        mediaUrl:
          type: string
          description: 媒体字节的受保护端点；文本产物没有这个字段。

    Generation:
      type: object
      required: [id, workspaceId, projectId, status, progress, creditsCost, outputs, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        workspaceId: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        nodeId: { type: [string, 'null'] }
        operation: { type: string }
        modelCode: { type: string }
        status: { $ref: '#/components/schemas/GenerationStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        creditsCost: { type: integer, minimum: 0 }
        retryOfId: { type: [string, 'null'] }
        outputs:
          type: array
          description: |
            **多产物是数组**。前端必须明确策略（全部/首项/用户选择），
            不得隐式只显示 outputs[0]（GAP-12）。
          items: { $ref: '#/components/schemas/GenerationOutput' }
        error:
          type: [object, 'null']
          properties:
            reason: { type: string }
            message: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    GenerationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Generation' }

    # ---------- 媒体 ----------
    UploadReference:
      type: object
      required: [id, mediaType, contentType, sizeBytes, url]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        mediaType: { type: string, enum: [image, audio, video] }
        contentType: { type: string }
        sizeBytes: { type: integer }
        url: { type: string }

    GridTile:
      type: object
      description: |
        宫格切块。`index` **从 1 起**、按行优先编号 —— 它会直接显示给用户
        （"第 3 格"），而用户不数 0。
      required: [mediaId, index, row, col, width, height, label, url]
      properties:
        mediaId: { $ref: '#/components/schemas/Id' }
        index: { type: integer, minimum: 1 }
        row: { type: integer, minimum: 0, description: 从 0 起，供定位 }
        col: { type: integer, minimum: 0 }
        width: { type: integer }
        height: { type: integer }
        label: { type: string, description: '给用户看的编号，如「第 2 行第 3 格」' }
        url:
          type: string
          description: 受保护端点地址，前端一律走 useAuthenticatedMedia。

    GridSplitResult:
      type: object
      required: [sourceMediaId, rows, cols, tiles]
      properties:
        sourceMediaId: { $ref: '#/components/schemas/Id' }
        rows: { type: integer }
        cols: { type: integer }
        tiles:
          type: array
          items: { $ref: '#/components/schemas/GridTile' }

    ExportTask:
      type: object
      description: |
        批量导出任务。

        ⚠️ `status` 里的 `expired` 是**算出来的**（`now() > expiresAt`），
        库里没有这个值：靠清理作业标记的话，作业停了一天，界面上就有
        一整天的下载按钮点下去 404，而用户看到的是"导出成功"。

        ⚠️ 只有 `status = success` 时才有 `url` —— 过期后给地址就是给一个 404。
      required: [id, kind, status, itemCount, expiresAt, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [zip] }
        status:
          type: string
          enum: [queued, running, success, failed, expired]
        itemCount: { type: integer, minimum: 0 }
        sizeBytes: { type: integer, minimum: 0 }
        mediaId: { $ref: '#/components/schemas/Id' }
        url: { type: string }
        errorCode: { type: string }
        errorMessage: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ImageTool:
      type: object
      description: |
        图片工具栏上的一项。`credits` 只在 `available` 时有意义 ——
        价格要在**点之前**看得见，点了才知道扣多少是旧系统被反复投诉的一点。
      required: [code, name, presetGroup, spec, inputMode, sort, available, userFixable]
      properties:
        code: { type: string }
        name: { type: string }
        presetGroup:
          type: string
          description: |
            预设分组。`tool` 是 P09 的加工工具；`editor` 是图片节点工具条的四个编辑器工具（docs/agent/imagetools），
            它们不是预设，都用图片大模型走图生图（operation=img2img），`spec` / `inputMode` 固定为 `editor` / `image_required`。
          enum: [sheet, tuning, storyboard, space, tool, editor]
        spec: { type: string }
        inputMode:
          type: string
          enum: [image_required, text_required, either]
        operation: { type: string }
        sort: { type: integer }
        available: { type: boolean }
        blockedCode:
          type: string
          description: |
            阻塞分类。`needs_image` / `needs_text` 是用户可解决的；
            其余为业务错误码名（如 `CAPABILITY_UNSUPPORTED`、`PRICING_MISSING`）。
        blockedReason: { type: string }
        userFixable:
          type: boolean
          description: 这条阻塞用户自己能不能解决。前端按它决定提示语气，不要匹配文案。
        credits: { type: integer, minimum: 0 }
        estimatedSeconds: { type: integer, minimum: 0 }
        models:
          type: array
          description: |
            编辑器工具（presetGroup=editor）此刻调得动图生图的图片模型，按 sort 排。预设工具不带。
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
              providerName: { type: string, description: 服务商代码 }

    MultiAngleOptions:
      type: object
      description: 多角度（`params.tool = multi_angle`）。数值原样交给上游（horizontal_angle / vertical_angle / zoom）。
      properties:
        preset: { type: string, enum: [custom, fisheye, dutch, high_front, low_front, birds_eye, back] }
        horizontal: { type: integer, minimum: 0, maximum: 360, description: 水平环绕，0 正面、90 右侧、180 背面、270 左侧 }
        vertical: { type: integer, minimum: -30, maximum: 90, description: 垂直俯仰，0 平视 }
        zoom: { type: integer, minimum: 0, maximum: 10, description: 景别，0 远 → 10 近，默认 5 }
        prompt: { type: string, maxLength: 200, description: 补充提示词（码点） }

    RelightOptions:
      type: object
      description: 打光（`params.tool = relight`）。`smart=true` 时其余字段忽略。
      properties:
        smart: { type: boolean }
        preset: { type: string, enum: [left, top, right, front, bottom, back] }
        azimuth: { type: integer, minimum: 0, maximum: 360, description: 0 前方、90 右侧、180 后方、270 左侧 }
        elevation: { type: integer, minimum: -90, maximum: 90 }
        brightness: { type: integer, minimum: 0, maximum: 100 }
        color: { type: [string, 'null'], description: '#rrggbb；null / 空 = 保持原色温' }
        rim: { type: boolean, description: 轮廓光 }

    ExpressionRole:
      type: object
      required: [box, arousal, warmth]
      properties:
        id: { type: string }
        box: { $ref: '#/components/schemas/PixelBox' }
        arousal: { type: integer, minimum: -2, maximum: 2, description: +2 激动 … -2 平静 }
        warmth: { type: integer, minimum: -2, maximum: 2, description: +2 亲近 … -2 疏离 }

    ExpressionOptions:
      type: object
      description: |
        情绪调节（`params.tool = expression_edit`）：用户手动框选的人物；框是**原图像素坐标**，
        `sourceMediaId` 与当前源图不同回 42219。服务端裁出框选人物所在的区域发给图片模型，结果贴回原图（原图分辨率）。
      required: [sourceMediaId, roles]
      properties:
        sourceMediaId: { $ref: '#/components/schemas/Id' }
        count: { type: integer, minimum: 1, maximum: 4, default: 1 }
        roles: { type: array, minItems: 1, maxItems: 6, items: { $ref: '#/components/schemas/ExpressionRole' } }

    UpscaleOptions:
      type: object
      description: 高清（`params.tool = upscale`）：用图片大模型做「高清重绘」，按增强程度给三档提示词（docs/agent/imagetools R-5）。
      properties:
        level: { type: string, enum: [standard, fine, ultra], default: standard }

    PixelBox:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1 }
        h: { type: integer, minimum: 1 }

    ImageToolsConfig:
      type: object
      description: |
        图片节点工具条的界面配置（docs/agent/imagetools IMG-I-04）。**不含**上游参数映射与提示词。
      properties:
        tools:
          type: array
          items:
            type: object
            required: [code, name, spawn, isNew]
            properties:
              code: { type: string }
              name: { type: string }
              spawn: { type: string, description: 派生子节点的默认标题 }
              isNew: { type: boolean, description: 工具条上显示 NEW 角标 }
        portraitPreset: { type: string, description: 「人物调节」用的预设码（portrait_tuning） }
        panoramaPreset: { type: string, description: 「全景」用的预设码（panorama_720） }
        multiAnglePresets:
          type: array
          items:
            type: object
            required: [code, name, horizontal, vertical, zoom]
            properties:
              code: { type: string }
              name: { type: string }
              horizontal: { type: integer }
              vertical: { type: integer }
              zoom: { type: integer }
        zoomBands:
          type: array
          items: { type: object, required: [max, name], properties: { max: { type: integer }, name: { type: string } } }
        lightPresets:
          type: array
          items:
            type: object
            required: [code, name, azimuth, elevation]
            properties:
              code: { type: string }
              name: { type: string }
              azimuth: { type: integer }
              elevation: { type: integer }
        namedColors:
          type: array
          items: { type: object, required: [name, hex], properties: { name: { type: string }, hex: { type: string } } }
        emotions:
          type: array
          items:
            type: object
            required: [arousal, warmth, name, image]
            properties:
              arousal: { type: integer }
              warmth: { type: integer }
              name: { type: string }
              image: { type: string, description: 示意头像（前端静态资源路径） }
        upscaleLevels:
          type: array
          items: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
        maxRoles: { type: integer }

    TimelineMeta:
      type: object
      description: |
        时间线的基本信息。

        ⚠️ `version` 是**服务端乐观锁**，与 `schemaVersion`（JSON 结构版本）
        不是一回事，不能混用。每次写回都要原样带上；
        0 行更新返回 409，前端必须**保住本地草稿并提示重载**，不能静默丢弃。
      required: [id, projectId, name, version, aspectRatio, fps, width, height, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        scriptId: { type: [string, 'null'] }
        name: { type: string }
        version: { type: integer }
        aspectRatio: { type: string }
        fps: { type: integer }
        width: { type: integer }
        height: { type: integer }
        status: { type: string, enum: [editing, archived] }
        canvasNodeId:
          type: [string, 'null']
          description: 绑定的智能剪辑节点（SCD-20）；旧时间线与脚本时间线为空
        isArranged:
          type: boolean
          description: AI 或用户剪过（SCD-17）；连线自动铺上的不算
        lastEditorKind:
          type: [string, 'null']
          enum: [user, ai, agent, mcp, sync, system, null]

    TimelineClip:
      type: object
      description: |
        轨道上的一段。

        ⚠️ **所有 `startMs` 都是成片时间**（SCK-15）：画面轨相邻两段有转场时，后一段的起点已扣掉重叠。

        ⚠️ 画面轨的 `startMs` / `durationMs` 由**服务端**按顺序算出来 ——
        客户端传来的落点一律不采信；音频轨的 `startMs` 是放置位置（SCD-15）：
        信它的结果是成片里出现黑帧（有空隙）或画面重叠（有交叠），
        而时间线界面上看着是连续的。

        `sourceShotId` 只在自动装配出来的段上出现。
        ⚠️ 源镜头可能已被删除 —— 那不是错误，只是溯源到此为止。
      required: [id, idx, mediaId, sourceInMs, sourceOutMs, startMs, durationMs, speed, volume]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        idx: { type: integer, minimum: 1 }
        mediaId: { $ref: '#/components/schemas/Id' }
        mediaUrl: { type: string, description: 受保护端点地址，不是对象存储直链 }
        sourceInMs: { type: integer }
        sourceOutMs: { type: integer }
        startMs: { type: integer }
        durationMs: { type: integer }
        speed: { type: integer, minimum: 25, maximum: 400, description: 百分比，100 = 原速 }
        volume: { type: integer, minimum: 0, maximum: 200 }
        fadeInMs: { type: integer }
        fadeOutMs: { type: integer }
        sourceShotId: { $ref: '#/components/schemas/Id' }
        transitionIn:
          allOf:
            - $ref: '#/components/schemas/Transition'
          description: |
            与上一段的衔接。⚠️ **接缝的转场只记在后一段上** ——
            前端画接缝时读右边那一段，不要去看左边那段的 `transitionOut`。
            第一段上的它＝从黑场淡入。
        transitionOut:
          allOf:
            - $ref: '#/components/schemas/Transition'
          description: 只在**最后一段**有意义（淡出到黑场）。中间段上的会被忽略。
        transform: { $ref: '#/components/schemas/ClipTransform' }
        origin:
          type: string
          enum: [ai, user, sync]
          description: 谁放进来的。用户动过的片段改写为 user，AI 的追加指令不改它（SCD-5）
        sourceNodeId:
          type: [string, 'null']
          description: 来自哪个画布节点（素材编号、过期判断、「来源已断开」）
        alternates:
          type: array
          items: { $ref: '#/components/schemas/ClipAlternate' }
        pendingGenerationId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: 片段级生成进行中（导出预检据此拦下，SC-F-138）
        anchor:
          allOf: [{ $ref: '#/components/schemas/SubtitleAnchor' }]
          description: |
            跟随画面轨的一段（只在音频轨上：按画面生成的音效，SC-F-56）。`startMs` / `sourceInMs` / `sourceOutMs` /
            `speed` 已由服务端按锚点与那一段当前的位置、取用区间、速度算好；所属片段已不在时锚点失效，按存储值留在原处。
        hidden:
          type: boolean
          description: 跟随的那一段被裁到看不见了（不渲染、不播放；恢复区间后重新出现）。只在带 `anchor` 的片段上出现

    TimelineTrack:
      type: object
      required: [id, kind, idx, isMuted, volume, clips]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [video, audio, subtitle, text] }
        idx: { type: integer }
        name: { type: string }
        isMuted: { type: boolean }
        volume: { type: integer, minimum: 0, maximum: 200 }
        role:
          type: [string, 'null']
          enum: [music, voice, sfx, null]
          description: 音频轨的用途；画面轨可标 voice（口播素材的人声在原声里）。人声闪避按它找「谁压谁」
        lang: { type: [string, 'null'], description: 字幕轨的语言 }
        isHidden: { type: boolean }
        style:
          type: [object, 'null']
          additionalProperties: true
          description: 字幕轨的统一样式；配乐轨的人声闪避开关 `duck = {enabled, depthDb}`
        clips:
          type: array
          items: { $ref: '#/components/schemas/TimelineClip' }

    TimelineSubtitle:
      type: object
      required: [id, startMs, endMs, text]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        startMs: { type: integer }
        endMs: { type: integer }
        text: { type: string }
        style: { type: object }
        trackId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: 所属字幕轨（SC-F-52）
        anchor: { $ref: '#/components/schemas/SubtitleAnchor' }
        hidden:
          type: boolean
          description: 跟随的片段把它所在的区间裁掉了（隐藏，不删除，SC-F-56）

    Timeline:
      allOf:
        - $ref: '#/components/schemas/TimelineMeta'
        - type: object
          required: [tracks, subtitles, totalMs, effectiveMs]
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/TimelineTrack' }
            subtitles:
              type: array
              items: { $ref: '#/components/schemas/TimelineSubtitle' }
            texts:
              type: array
              items: { $ref: '#/components/schemas/TimelineText' }
            totalMs:
              type: integer
              description: |
                视频轨各段时长之和（**不算转场重叠**），由服务端算。
                ⚠️ 前端不要自己累加 —— 变速那一档会算错。
            effectiveMs:
              type: integer
              description: |
                算上转场重叠之后的**实际成片长度**。

                ⚠️ 两个数都要给：用户按 `totalMs` 理解"我放了多少素材"，
                但配乐与字幕要对齐的是 `effectiveMs` —— 只给一个的话，
                设了转场之后字幕就会整体偏移，而偏多少没人说得清。

    AssemblePlan:
      type: object
      description: |
        一次自动装配的结果。

        ⚠️ `gaps` 必须**原样展示给用户**，不能只显示一个数字：
        他要知道是哪几镜、为什么没有，否则只能挨个去翻（NEW-09）。
      required: [appended, complete, summary]
      properties:
        appended: { type: integer, description: 本次新加了几段 }
        skipped:
          type: array
          items: { type: integer }
          description: 已经装过、这次没动的镜号
        gaps:
          type: array
          items:
            type: object
            required: [shotNo, reason]
            properties:
              shotNo: { type: integer }
              reason: { type: string }
        complete: { type: boolean, description: 有缺口时为 false }
        summary:
          type: string
          description: 一句话说明。有缺口时缺口出现在**第一句**——用户扫一眼只看开头。

    Transition:
      type: object
      description: |
        一次转场。`kind: none` 或 `durationMs: 0` 都表示"没有转场"。

        ⚠️ 只有这五种（NEW-09 的"基础转场"）：每多一种就要在渲染侧
        多一条 filter 链。

        ⚠️ 下限 100ms 不是洁癖：比两帧还短的转场在 30fps 下根本看不出来，
        而它仍然会让渲染多走一条 filter 链、多花一份时间。
      required: [kind, durationMs]
      properties:
        kind:
          type: string
          enum: [none, fade, dissolve, slide_left, wipe]
        durationMs:
          type: integer
          minimum: 0
          maximum: 3000

    RenderPrecheck:
      type: object
      description: |
        渲染预检与报价。

        ⚠️ `issues` 要**逐条展示**，不能只显示一个数字：
        用户要知道是哪一段缺素材才改得动。
      required: [issues, runnable, durationMs, credits, clipCount]
      properties:
        runnable: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code, detail]
            properties:
              code:
                type: string
                enum: [empty_timeline, media_missing, too_long, ffmpeg_missing, h264_encoder_missing, subtitle_unsupported, clip_generating]
              detail: { type: string }
              clipIdx:
                type: integer
                description: 第几段（从 1 起）。0 表示与具体片段无关。
        durationMs:
          type: integer
          description: 成片时长（**算上转场重叠**）。
        credits:
          type: integer
          description: |
            这次渲染要花多少积分，按成片秒数计价（不足一秒按一秒）。

            ⚠️ 单价来自**同一套定价目录**（`timeline_render` 的兜底价），
            不另写一份 —— 另写的话"渲染多少钱"会有两个答案，
            而运营只会改其中一个。
            ⚠️ 随系统发布的那个价是**设计建议值，不是已批准的商业政策**（PARAM-07）。
        clipCount: { type: integer }
        subtitles: { type: integer }

    RenderSetting:
      type: object
      description: |
        平台级渲染配置（单行）。

        ⚠️ 水印是「AI 生成内容」标识。用户侧的 `isAiWatermarkOff` 能关掉它，
        但那是**产品决定**，服务端按 `app_user.is_ai_watermark_off` 自己查 ——
        **不从请求体收**：让客户端自己报"我关了水印"等于把这个标识
        变成谁都能关的可选项（GO-27 同一条）。
      required: [position, opacity, scale, version]
      properties:
        watermarkMediaId: { type: string }
        watermarkMissing:
          type: boolean
          description: |
            配了 ID 但图已经不在了。

            ⚠️ 要**显式告诉运营**：不说的话后台显示"已配置"，
            而每一次渲染都在悄悄少一个水印。
        position:
          type: string
          enum: [top_left, top_right, bottom_left, bottom_right]
        opacity: { type: integer }
        scale: { type: integer }
        version: { type: integer }

    RenderJob:
      type: object
      description: |
        一次渲染。

        ⚠️ `timelineVersion` 是**受理时冻结的**那个版本，不是时间线当前的版本 ——
        用户在排队期间改了一刀不会影响这次成片（NEW-10）。

        ⚠️ `ffmpegVersion` 要记：只记时间线版本的话，升级 ffmpeg 后
        同一个版本渲染出不同结果就无法解释（8.x 的 filter 行为跨版本有差异）。
      required: [id, timelineId, timelineVersion, status, progress, creditsCost]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        timelineId: { $ref: '#/components/schemas/Id' }
        timelineVersion: { type: integer }
        status:
          type: string
          enum: [queued, running, success, failed, cancelled]
        progress: { type: integer, minimum: 0, maximum: 100 }
        stage:
          type: string
          enum: [probing, assembling, mixing, encoding, archiving, checking]
          description: |
            只给百分比的话，卡在 40% 十分钟时用户不知道是死了还是在编码。
            `mixing` 是音频单独预渲（SCD-27），`checking` 是导出后自检（SCD-29）。
        spec: { $ref: '#/components/schemas/RenderSpec' }
        selfCheck:
          type: [object, 'null']
          description: 导出后自检（时长、响度、黑场）。**不通过只警告，不判失败**（SC-F-75）
          properties:
            durationMs: { type: integer }
            loudnessLufs: { type: number }
            blackSpans:
              type: array
              items:
                type: object
                properties:
                  startMs: { type: integer }
                  endMs: { type: integer }
            warnings:
              type: array
              items: { type: string }
        creditsCost: { type: integer }
        ffmpegVersion: { type: string }
        outputMediaId: { $ref: '#/components/schemas/Id' }
        workId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: |
            成片登记的作品（FULL-03）。

            ⚠️ **进作品库不等于公开发布**：落的是 `pending`，
            公开可见性是 `approved ∧ featured ∧ ¬offline`，三个条件
            都要运营显式操作。渲完就上首页的话，任何人渲一个片子都上公开墙。
        watermarkApplied:
          type: boolean
          description: |
            这次**到底加没加**水印。

            ⚠️ 与"配置里开没开"是两件事：用户可能自己关了
            （`isAiWatermarkOff`），也可能那会儿平台还没配图，也可能
            水印图取不回来。只看配置的话事后三种分不出来，而处理完全不同。
        url:
          type: string
          description: 成片的**受保护端点**地址，不是对象存储直链。
        errorCode: { type: string }
        errorMessage: { type: string }
        deadlineAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---------- 智能剪辑（docs/agent/smartcut） ----------
    ClipTransform:
      type: object
      description: |
        片段的画面变换（SC-F-43）。缺省 = 等比缩放适配画幅、居中。
        `x` / `y` 是画面宽高的百分比、以画面中心为原点；`scale` 是相对「等比适配」的倍数。
      properties:
        x: { type: number, minimum: -100, maximum: 100 }
        y: { type: number, minimum: -100, maximum: 100 }
        scale: { type: number, minimum: 0.1, maximum: 5 }
        rotation: { type: number, minimum: -180, maximum: 180, description: 度 }
        crop:
          type: [object, 'null']
          description: 四边裁掉的百分比
          properties:
            left: { type: number, minimum: 0, maximum: 45 }
            top: { type: number, minimum: 0, maximum: 45 }
            right: { type: number, minimum: 0, maximum: 45 }
            bottom: { type: number, minimum: 0, maximum: 45 }

    ClipAlternate:
      type: object
      description: 片段曾经用过的素材（重拍、去字幕之前的原片），连同原来的取用区间，可以切回（SCD-35）。
      required: [mediaId, sourceInMs, sourceOutMs, kind]
      properties:
        mediaId: { $ref: '#/components/schemas/Id' }
        sourceInMs: { type: integer, minimum: 0 }
        sourceOutMs: { type: integer, minimum: 1 }
        kind: { type: string, enum: [original, regen, desubtitle] }
        generationId: { $ref: '#/components/schemas/Id' }

    SubtitleAnchor:
      type: object
      description: |
        跟随片段（SC-F-56）：字幕或音效属于哪个片段、对应素材的哪一段时间。片段被移动、裁切、变速时，
        它的成片时间随之重算；落到被裁掉区间里的条目隐藏（不删除）。
      required: [clipId, srcStartMs, srcEndMs]
      properties:
        clipId: { type: string }
        srcStartMs: { type: integer, minimum: 0 }
        srcEndMs: { type: integer, minimum: 1 }

    TimelineText:
      type: object
      description: 文字层（标题、贴字，SC-F-50）。`startMs` / `endMs` 为成片时间。
      required: [id, trackId, startMs, endMs, text]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        trackId: { $ref: '#/components/schemas/Id' }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        text: { type: string }
        style:
          type: object
          additionalProperties: true
          description: 字号（画面高度的百分比）、颜色、描边、底框、对齐、最大宽度
        box:
          type: object
          additionalProperties: true
          description: 位置（`xPct` / `yPct` / `anchor`）

    TimelineContentClip:
      type: object
      description: |
        整份保存里的片段。新片段的 `id` 用临时 ID（`tmp-` 开头）。
        ⚠️ 画面轨片段的 `startMs` 传了也忽略（服务端按顺序与转场重算）；其它轨必须传，是成片时间。
      required: [id, mediaId, sourceInMs, sourceOutMs]
      properties:
        id: { type: string, pattern: '^([0-9]+|tmp-[A-Za-z0-9_-]{1,40})$' }
        mediaId: { $ref: '#/components/schemas/Id' }
        sourceInMs: { type: integer, minimum: 0 }
        sourceOutMs: { type: integer, minimum: 1 }
        startMs: { type: integer, minimum: 0 }
        speed: { type: integer, minimum: 25, maximum: 400 }
        volume: { type: integer, minimum: 0, maximum: 200 }
        fadeInMs: { type: integer, minimum: 0 }
        fadeOutMs: { type: integer, minimum: 0 }
        transitionIn: { $ref: '#/components/schemas/Transition' }
        transitionOut: { $ref: '#/components/schemas/Transition' }
        transform: { $ref: '#/components/schemas/ClipTransform' }
        origin: { type: string, enum: [ai, user, sync] }
        sourceNodeId: { type: string, maxLength: 64 }
        sourceShotId: { type: string, pattern: '^[0-9]+$' }
        alternates:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ClipAlternate' }
        anchor:
          allOf: [{ $ref: '#/components/schemas/SubtitleAnchor' }]
          description: |
            跟随画面轨的一段（只在音频轨上，SC-F-56）。跟随的片段不参与同轨重叠校验（落点跟着画面走）；
            保存时服务端按锚点重算它的落点、取用区间与速度。

    TimelineContentTrack:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, pattern: '^([0-9]+|tmp-[A-Za-z0-9_-]{1,40})$' }
        kind: { type: string, enum: [video, audio, subtitle, text] }
        name: { type: string, maxLength: 64 }
        role: { type: [string, 'null'], enum: [music, voice, sfx, null] }
        lang: { type: [string, 'null'], maxLength: 16 }
        isHidden: { type: boolean }
        isMuted: { type: boolean }
        volume: { type: integer, minimum: 0, maximum: 200 }
        style:
          type: [object, 'null']
          additionalProperties: true
          description: 字幕轨的统一样式；配乐轨的人声闪避开关 `duck = {enabled, depthDb}`
        clips:
          type: array
          items: { $ref: '#/components/schemas/TimelineContentClip' }

    TimelineContent:
      type: object
      description: |
        整份保存的请求体（dev/01 §4.1）。所有位置都是成片时间（SCK-15）。未知字段原样保留。
      required: [version, aspectRatio, fps, width, height, tracks]
      properties:
        version: { type: integer }
        aspectRatio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '21:9', custom] }
        fps: { type: integer, minimum: 1, maximum: 120 }
        width: { type: integer, minimum: 2 }
        height: { type: integer, minimum: 2 }
        tracks:
          type: array
          items: { $ref: '#/components/schemas/TimelineContentTrack' }
        subtitles:
          type: array
          items:
            type: object
            required: [id, trackId, startMs, endMs, text]
            properties:
              id: { type: string, pattern: '^([0-9]+|tmp-[A-Za-z0-9_-]{1,40})$' }
              trackId: { type: string, pattern: '^([0-9]+|tmp-[A-Za-z0-9_-]{1,40})$' }
              startMs: { type: integer, minimum: 0 }
              endMs: { type: integer, minimum: 1 }
              text: { type: string }
              style: { type: object, additionalProperties: true }
              anchor: { $ref: '#/components/schemas/SubtitleAnchor' }
        texts:
          type: array
          items:
            type: object
            required: [id, trackId, startMs, endMs, text]
            properties:
              id: { type: string, pattern: '^([0-9]+|tmp-[A-Za-z0-9_-]{1,40})$' }
              trackId: { type: string, pattern: '^([0-9]+|tmp-[A-Za-z0-9_-]{1,40})$' }
              startMs: { type: integer, minimum: 0 }
              endMs: { type: integer, minimum: 1 }
              text: { type: string }
              style: { type: object, additionalProperties: true }
              box: { type: object, additionalProperties: true }

    TimelineSaveResult:
      type: object
      required: [timeline, idMap]
      properties:
        timeline: { $ref: '#/components/schemas/Timeline' }
        idMap:
          type: object
          additionalProperties: { type: string }
          description: 临时 ID → 正式 ID（轨道、片段、字幕、文字共用一张表）

    TimelineSnapshotMeta:
      type: object
      required: [id, version, reason, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: integer, description: 快照时的时间线版本 }
        reason:
          type: string
          enum: [ai_plan, ai_edit, ai_variant, clip_fill, replace_changed, subtitles, translate, restore]
        callId: { $ref: '#/components/schemas/Id' }
        generationId: { $ref: '#/components/schemas/Id' }
        editorKind: { type: string }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }

    TimelineRestoreResult:
      type: object
      required: [timeline, missing]
      properties:
        timeline: { $ref: '#/components/schemas/Timeline' }
        snapshotId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: 恢复之前存下的那份快照（再撤销一次就回到恢复前）
        missing:
          type: array
          description: 快照里引用、但素材已被删除的片段
          items:
            type: object
            required: [clipId, mediaId, trackKind]
            properties:
              clipId: { type: string }
              mediaId: { $ref: '#/components/schemas/Id' }
              trackKind: { type: string }

    SmartcutStripItem:
      type: object
      description: 节点卡迷你时间轴用的轻量片段（摘要的 `strip`，最多 40 项）
      required: [kind, startMs, durationMs]
      properties:
        kind: { type: string, enum: [video, image, audio] }
        startMs: { type: integer }
        durationMs: { type: integer }
        posterMediaId: { $ref: '#/components/schemas/Id' }
        mediaId:
          $ref: '#/components/schemas/Id'
          description: |
            这一段用的素材。节点卡在没有封面帧时（上传的视频不截封面帧）用它直接显示视频画面（取预览版，没有时取原片）。

    SmartcutRenderBrief:
      type: object
      required: [id, status, progress, timelineVersion]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [queued, running, success, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        stage: { type: [string, 'null'] }
        outputMediaId: { $ref: '#/components/schemas/Id' }
        outputPosterId: { $ref: '#/components/schemas/Id' }
        timelineVersion: { type: integer }
        spec: { $ref: '#/components/schemas/RenderSpec' }
        errorMessage: { type: string }

    SmartcutSummary:
      type: object
      description: |
        一个智能剪辑节点的状态（SCK-13）。节点卡、下游取输入、整图运行都看它。
        - `renderStale`：时间线版本比最近一次成功导出时新（「剪辑已改，成片未更新」）；
        - `inputsStale`：当前素材指纹与上次剪辑时不同（「素材有变化」）。
      required: [timelineId, canvasNodeId, version, isArranged, totalMs, effectiveMs, clipCount,
        inputsStale, renderStale, strip]
      properties:
        timelineId: { $ref: '#/components/schemas/Id' }
        canvasNodeId: { type: string }
        version: { type: integer }
        isArranged: { type: boolean, description: 'AI 或用户剪过；false 时新连进来的素材会自动铺上轨道' }
        totalMs: { type: integer }
        effectiveMs: { type: integer }
        clipCount: { type: integer }
        coverMediaId: { $ref: '#/components/schemas/Id' }
        inputsStale: { type: boolean }
        renderStale: { type: boolean }
        latestRender: { $ref: '#/components/schemas/SmartcutRenderBrief' }
        activeCall:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Id' }
            kind: { type: string, enum: [plan, edit, translate] }
            stage: { type: string, enum: [sync, understand, plan, compile, apply, done] }
            startedAt: { type: string, format: date-time }
        strip:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/SmartcutStripItem' }
        updatedAt: { type: string, format: date-time }

    SmartcutInput:
      type: object
      description: 素材条里的一条（SC-F-10~18）。`no` 是素材编号（"3"，多产物时 "3-1"）。
      required: [no, sourceNodeId, sourceNodeType, kind, status, used]
      properties:
        no: { type: string }
        sourceNodeId: { type: string }
        sourceNodeType: { type: string }
        title: { type: string }
        kind: { type: string, enum: [video, image, audio, text, shotGroup] }
        status:
          type: string
          enum: [ready, pending, failed, invalid]
          description: '`pending` = 上游还在生成 / 上传；`invalid` = 归属或类型不合法，看 `reason`'
        reason: { type: string }
        mediaId: { $ref: '#/components/schemas/Id' }
        durationMs: { type: integer }
        hasAudio: { type: boolean }
        audioRole: { type: [string, 'null'], enum: [music, voice, sfx, null] }
        posterMediaId: { $ref: '#/components/schemas/Id' }
        text: { type: string, description: 文本输入的内容（截断到 2000 字） }
        used: { type: boolean, description: 时间线里有片段用到它 }
        changed:
          type: boolean
          description: 同一来源节点的产物与片段当前用的素材不同（上游重新生成过，SCT-30）；`replaceChanged` 换的就是这些

    SmartcutSyncResult:
      type: object
      required: [inputs, appendedClipIds, disconnectedClipIds, replacedClipIds, unusedCount, fingerprint, timelineVersion]
      properties:
        inputs:
          type: array
          items: { $ref: '#/components/schemas/SmartcutInput' }
        appendedClipIds:
          type: array
          items: { type: string }
        disconnectedClipIds:
          type: array
          items: { type: string }
          description: 来源连线已断开的片段（保留，不自动删除）
        replacedClipIds:
          type: array
          items: { type: string }
        shortened:
          type: array
          description: 原位替换时新素材比取用区间短、被截到素材长度的片段
          items:
            type: object
            required: [clipId, fromMs, toMs]
            properties:
              clipId: { type: string }
              fromMs: { type: integer }
              toMs: { type: integer }
        unusedCount: { type: integer }
        omitted:
          type: integer
          description: 超出 50 条、没进素材条的条数（SC-F-17：超出的不进素材条，只报个数）
        fingerprint: { type: string }
        timelineVersion: { type: integer }

    SmartcutPlanRequest:
      type: object
      required: [mode, baseVersion]
      properties:
        mode: { type: string, enum: [mix, board, talk, narr] }
        instruction: { type: string, maxLength: 2000 }
        spec:
          type: object
          properties:
            aspectRatio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '21:9', follow] }
            resolution: { type: string, enum: [720p, 1080p] }
            targetSec: { type: integer, minimum: 0, maximum: 1800, description: '0 = 自动' }
        variants: { type: integer, minimum: 1, maximum: 3, default: 1 }
        baseVersion: { type: integer }
        allowSlow: { type: boolean, description: 素材不够时允许放慢（最低 0.75×） }
        allowRepeat: { type: boolean, description: 素材不够时允许重复使用片段 }
        withSubtitles:
          type: boolean
          description: |
            生成字幕。不传时按模式：素材混剪看要求里有没有提到字幕；分镜成片、口播精剪、解说成片默认生成。
        ignoreBeat:
          type: boolean
          description: 有配乐也不卡点（要求卡点却没有配乐时 42217 的出路之一「不卡点」）
        keepFillers:
          type: boolean
          description: 口播精剪保留口癖（嗯、啊）；默认去掉
        force: { type: boolean, description: 剪辑期间时间线被改过时仍然写入（覆盖那些改动，可撤销） }

    SmartcutVariant:
      type: object
      required: [index, summary, totalMs, usedClips, warnings, usedFallback]
      properties:
        index: { type: integer }
        status: { type: string, enum: [success, failed] }
        summary: { type: string }
        totalMs: { type: integer }
        usedClips:
          type: array
          items: { type: string }
          description: 用到的素材编号
        reasons:
          type: array
          items:
            type: object
            properties:
              clip: { type: string }
              reason: { type: string }
        warnings:
          type: array
          items: { type: string }
        usedFallback: { type: boolean }
        shortage:
          type: [object, 'null']
          description: |
            素材不够目标时长（SC-F-92）：成片实际多长、目标多长。前端据此给「允许放慢 / 允许重复 / 去补镜」的出路，
            ⚠️ 不要去匹配 warnings 的文案。解说成片里 targetMs 是配音时长。
          required: [totalMs, targetMs]
          properties:
            totalMs: { type: integer }
            targetMs: { type: integer }
        notes:
          type: array
          items: { type: string }
          description: 模型的取舍说明与编译附注（不是问题）；兜底时第一条是「AI 没能给出方案，已按规则剪好」
        error: { type: string }

    SmartcutPlanResult:
      type: object
      required: [callId, variants]
      properties:
        callId: { $ref: '#/components/schemas/Id' }
        appliedVariant: { type: [integer, 'null'] }
        variants:
          type: array
          items: { $ref: '#/components/schemas/SmartcutVariant' }
        timeline: { $ref: '#/components/schemas/Timeline' }
        snapshotId: { $ref: '#/components/schemas/Id' }
        changes:
          type: array
          items: { type: string }
          description: 追加指令改了哪几处（人话）

    SmartcutTranslateResult:
      type: object
      description: |
        字幕翻译的结果（SCT-36）。`trackId` 是译文所在的字幕轨（新轨或原轨）；`failed` 是没译出来的条目，
        `index` 是原字幕轨上按起点排序的序号（从 1 起），那几条不改。一条都没译出来时 `translated=0`、
        不带 `timeline`（时间线没改）。
      required: [trackId, translated, failed]
      properties:
        trackId: { $ref: '#/components/schemas/Id' }
        translated: { type: integer }
        failed:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index: { type: integer, minimum: 1 }
              reason: { type: string }
        timeline: { $ref: '#/components/schemas/Timeline' }

    SmartcutQuote:
      type: object
      description: 报价（`dryRun`）。形状对齐生成报价：不可用时 `blockers` 说明原因。
      required: [credits, modelCode, blockers]
      properties:
        credits: { type: integer }
        unitPrice: { type: integer }
        unit: { type: string, description: 计价单位（识别是 per_second） }
        durationSec: { type: integer, description: 计费时长合计（逐份素材向上取整到秒再相加，与受理时逐份扣的一致） }
        modelCode: { type: string }
        items:
          type: integer
          description: 将受理几个任务（识别按素材逐个受理）
        skipped:
          type: array
          description: 不发起的素材与原因（没有音轨、已有缓存）
          items:
            type: object
            properties:
              mediaId: { $ref: '#/components/schemas/Id' }
              reason: { type: string }
        blockers:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              userFixable: { type: boolean }

    SmartcutGeneration:
      type: object
      required: [generationId, kind, status, progress, credits, createdAt]
      properties:
        generationId: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [asr, regen, fill, desubtitle, music, sfx] }
        status: { type: string, enum: [queued, running, success, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        credits: { type: integer }
        clipId: { type: string }
        mediaId: { $ref: '#/components/schemas/Id' }
        outputMediaId: { $ref: '#/components/schemas/Id' }
        landed: { type: boolean, description: 产物已经回填进时间线 }
        error: { type: string }
        createdAt: { type: string, format: date-time }

    SmartcutTranscribeResult:
      type: object
      description: |
        识别的受理结果（SCT-33）：按素材逐个受理。`waiting` 是识别用音轨还没抽好的素材 —— 不用再点，抽好后自动受理
        （结果由 smartcut.updated 的 analysis 段推送）；`skipped` 不发起（没有音轨、已有结果、正在识别），不收费；
        `failed` 受理没成（余额不足会停下后面的，那几份也在这里）。
        请求了 `subtitles` 时：已有识别结果的素材当场写字幕，其余的在各自识别完成后写入（timeline.updated，reason=subtitles）。
      required: [items, waiting, skipped, failed]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SmartcutGeneration' }
        waiting: { $ref: '#/components/schemas/SmartcutMediaReasons' }
        skipped: { $ref: '#/components/schemas/SmartcutMediaReasons' }
        failed: { $ref: '#/components/schemas/SmartcutMediaReasons' }
        subtitleError:
          type: string
          description: 已有识别结果的素材当场写字幕没写成的原因（识别照常受理；没有这个字段 = 没失败或不用写）

    SmartcutMediaReasons:
      type: array
      items:
        type: object
        required: [mediaId, reason]
        properties:
          mediaId: { $ref: '#/components/schemas/Id' }
          reason: { type: string }

    SmartcutGenerationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SmartcutGeneration' }
        nextCursor: { type: string }

    SmartcutClipOrigin:
      type: object
      required: [kind, canRegenerate]
      properties:
        kind: { type: string, enum: [generation, upload, render, director, unknown] }
        generationId: { $ref: '#/components/schemas/Id' }
        operationCode: { type: string }
        modelCode: { type: string }
        modelName: { type: string }
        prompt: { type: string }
        params:
          type: object
          additionalProperties: true
          description: 主要参数（时长、分辨率、画幅等）
        inputs:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              order: { type: integer }
        canRegenerate: { type: boolean }
        reason: { type: string, description: 不能重拍时的原因 }

    SmartcutModelChoice:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        granularity: { type: string, enum: [char, word, segment, text], description: 识别模型的时间戳粒度 }
        minSec: { type: integer }
        maxSec: { type: integer }
        unitPrice: { type: integer }
        unit: { type: string }

    SmartcutConfig:
      type: object
      required: [available, usedThisHour, perHour, concurrency, limits, models]
      properties:
        available: { type: boolean }
        reason: { type: string }
        userFixable: { type: boolean }
        usedThisHour: { type: integer }
        perHour: { type: integer }
        concurrency: { type: integer }
        limits:
          type: object
          additionalProperties: { type: integer }
          description: 素材条、片段、轨道、文字层、字幕、时长等上限
        models:
          type: object
          properties:
            speech2text:
              type: array
              items: { $ref: '#/components/schemas/SmartcutModelChoice' }
            video_desubtitle:
              type: array
              items: { $ref: '#/components/schemas/SmartcutModelChoice' }
            text2music:
              type: array
              items: { $ref: '#/components/schemas/SmartcutModelChoice' }
            video2audio:
              type: array
              items: { $ref: '#/components/schemas/SmartcutModelChoice' }
            fill:
              type: array
              items: { $ref: '#/components/schemas/SmartcutModelChoice' }
        translateLangs:
          type: array
          items: { type: string }

    TypesetRequest:
      type: object
      required: [text, width, height]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        width: { type: integer, minimum: 64, maximum: 3840 }
        height: { type: integer, minimum: 64, maximum: 3840 }
        style: { type: object, additionalProperties: true }
        box:
          type: object
          additionalProperties: true
          description: |
            文字层的位置（`xPct` / `yPct` 锚点位置、`anchor` 取 top / center / bottom），与 `TimelineText.box` 同形。
            不给时文字层按画面正中排、字幕按 `style.bottomPct` 贴底 —— 预览里的位置要与成片一致，文字层必须带上它。
        kind: { type: string, enum: [subtitle, text], default: text }

    RenderSpec:
      type: object
      properties:
        resolution: { type: string, enum: [720p, 1080p] }
        fps: { type: integer, enum: [24, 25, 30] }
        width: { type: integer }
        height: { type: integer }

    RenderDownload:
      type: object
      required: [url, expiresAt, fileName]
      properties:
        url: { type: string, description: 签名链接，5 分钟有效，只对这一个文件有效 }
        expiresAt: { type: string, format: date-time }
        fileName: { type: string }

    PreviewAssets:
      type: object
      required: [mediaId, status]
      properties:
        mediaId: { $ref: '#/components/schemas/Id' }
        status:
          type: object
          additionalProperties: { type: string, enum: [queued, running, success, failed, none] }
          description: 各种派生素材的进度（preview_proxy / filmstrip / peaks / beats / speech_audio / asr）
        preview:
          type: [object, 'null']
          description: 预览版（短边 480、每秒一个关键帧、moov 前置）。下载走受保护的 `/media/{mediaId}`。
          properties:
            mediaId: { $ref: '#/components/schemas/Id' }
            width: { type: integer }
            height: { type: integer }
            durationMs: { type: integer }
        filmstrip:
          type: [object, 'null']
          properties:
            frameW: { type: integer }
            frameH: { type: integer }
            intervalMs: { type: integer }
            cols: { type: integer }
            count: { type: integer }
            sheets:
              type: array
              items: { $ref: '#/components/schemas/Id' }
        peaks:
          type: [object, 'null']
          properties:
            intervalMs: { type: integer }
            values: { type: string, description: 'base64(uint8[])，0~255' }
            noAudio:
              type: boolean
              description: 素材没有音轨（生成的视频常见）。不是失败：values 为空串，画一条平线并标「无音轨」。
        beats:
          type: [object, 'null']
          properties:
            bpm: { type: number }
            beatsMs:
              type: array
              items: { type: integer }
            downbeatsMs:
              type: array
              items: { type: integer }
            downbeatApprox: { type: boolean }
            confidence: { type: number }
            noAudio: { type: boolean, description: 素材没有音轨（不是失败） }

    # ---------- 画布 Agent（AGT-26） ----------
    AgentPreferences:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties: true
          description: '{video:{model,ratio,resolution,duration}, image:{model}, reasoning:{model}, lastMode} 等，原样保存'

    AgentSkill:
      type: object
      required: [code, name, category, description, tags, steps, coverMediaId, isQuickEntry, sort,
        scenes, inputSlots, prefillText, isBatch, modelBindings]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        tags: { type: array, items: {} }
        steps: { type: array, items: {} }
        coverMediaId: { type: [string, 'null'], description: '公开取图走 /agent/skills/{code}/cover' }
        isQuickEntry: { type: boolean }
        sort: { type: integer }
        scenes:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillScene' }
          description: 所属场景；空 = 只在通用场景（MKT-D-10）
        inputSlots:
          type: array
          items: { $ref: '#/components/schemas/MarketingSlotDecl' }
          description: 输入槽声明；空 = 用场景默认（MKT-D-11、MKT-F-13）
        prefillText: { type: string, description: 预填描述（≤ 200 字，MKT-D-12）；空串 = 不预填 }
        isBatch:
          type: boolean
          description: |
            一次出多个变体的技能（批量变体 / 素材裂变，MKT-T-32，迁移 00062）。前端据此在价格明细多一行
            「最多 N 个变体」（MKT-UX-08）。**只是展示标识**，不是计费或执行依据（变体上限仍取 `/marketing/config`）。
        modelBindings: { $ref: '#/components/schemas/AgentSkillModelBindings' }

    AgentSkillScene:
      type: string
      enum: [general, marketing]

    AgentSkillModelRef:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string, description: 模型显示名；目录里取不到时退回 code }

    AgentSkillModelBindings:
      type: object
      description: 技能绑定的模型（MKT-D-13）；未绑定的槽位不出现
      properties:
        video: { $ref: '#/components/schemas/AgentSkillModelRef' }
        image: { $ref: '#/components/schemas/AgentSkillModelRef' }
        reasoning: { $ref: '#/components/schemas/AgentSkillModelRef' }

    MarketingSlotField:
      type: object
      required: [key, label]
      additionalProperties: false
      properties:
        key: { type: string, description: 'product 槽只认 name / sellingPoints' }
        label: { type: string }
        maxLen: { type: integer, minimum: 0, description: 0 / 不传 = 用代码上限；只能收紧 }

    MarketingSlotDecl:
      type: object
      required: [key, label, accept, required, maxCount]
      additionalProperties: false
      description: |
        输入槽声明（dev/01 §4.3）。⚠️ key 只认 product / character / source_video（格式契约，
        运营不能新造）；accept 按槽收窄（product 只收 marketing_product、character 收 marketing_character /
        character_asset、source_video 只收 video）；maxCount 不得超过场景上限（商品 1 个、角色 2、源视频 1）。
        MKT-T-37（MKD-26）起，旧形状（商品槽 `accept:["image"]`、`maxCount` 20、`fields`；角色槽 `image`）在解码处
        统一换成新形状：读接口下发的都是新形状，管理端保存旧形状成功并回 `warnings[{field:"inputSlots", code:"normalized"}]`。
      properties:
        key: { type: string, enum: [product, character, source_video] }
        label: { type: string }
        accept:
          type: array
          items:
            type: string
            enum: [image, video, character_asset, marketing_product, marketing_character]
            description: image 只会出现在旧数据里（解码时规范化，MKD-26）
        required: { type: boolean }
        maxCount: { type: integer, minimum: 1 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/MarketingSlotField' }

    AdminAgentSkillWarning:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: 字段路径；空 = 不针对某个字段（如缺口播提示句） }
        code: { type: string, description: 'missing_disclaimer / caution_word …（按它呈现，不匹配文案）' }
        message: { type: string }

    AdminAgentTool:
      type: object
      required: [name, paid, canvasWrite, action, planning, executing]
      properties:
        name: { type: string }
        paid: { type: boolean, description: 调用会扣积分 }
        canvasWrite: { type: boolean, description: 会写画布 }
        action: { type: string, description: 执行前要实时校验的工作区动作（view / edit / generate / export） }
        planning: { type: boolean, description: 规划态会下发 }
        executing: { type: boolean, description: 执行态会下发 }

    AdminAgentModelOption:
      type: object
      required: [code, name, domain, status, agentCapable]
      properties:
        code: { type: string }
        name: { type: string }
        domain: { type: string }
        status: { type: string }
        agentCapable: { type: boolean }

    AdminAgentSkillStep:
      type: object
      required: [no, name, checkpoint]
      additionalProperties: false
      properties:
        no: { type: integer, minimum: 1, description: 从 1 起连续 }
        name: { type: string, maxLength: 64 }
        checkpoint: { type: boolean, description: 只是展示用；付费前必须经用户确认由代码保证，技能关不掉 }

    AdminAgentSkillBindings:
      type: object
      additionalProperties: false
      properties:
        video: { type: string, description: 空串 = 不绑定 }
        image: { type: string }
        reasoning: { type: string, description: 必须是 agentCapable 的文本模型 }

    AdminAgentSkillReference:
      type: object
      required: [id, name, body, sort, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        body: { type: string }
        sort: { type: integer }
        updatedAt: { type: string, format: date-time }

    # ---------- 营销选项（MKT-T-03） ----------
    MarketingKind:
      type: string
      enum: [creative, hook, style]
    MarketingLifecycle:
      type: string
      enum: [not_started, live, ended, disabled]
      description: 投放状态，由服务端按 `[startAt, endAt)` 与启用状态现算（不让管理端用本地时钟再算）。
    MarketingIssue:
      type: object
      required: [field, code, message, level]
      properties:
        slot: { type: string }
        field: { type: string, description: '请求体字段路径（如 `coverMediaIds[0]`）；口播缺提示句时为空串' }
        code: { type: string, description: '机器可读分类（required / too_long / bad_window / banned_word / missing_disclaimer / not_found / unavailable / bad_source / immutable …），前端按它呈现、不匹配文案' }
        message: { type: string }
        level: { type: string, enum: [error, warn] }
    MarketingCategory:
      type: object
      required: [id, kind, code, name, sort, isEnabled]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MarketingKind' }
        code: { type: string }
        name: { type: string }
        sort: { type: integer }
        isEnabled: { type: boolean }
    MarketingProductInput:
      type: object
      description: 商品内容（新建 / 整份更新）。长度按码点计；未知字段直接拒（40001）。
      required: [name, imageMediaIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 30, description: 商品名称（两端空白会去掉），不要求唯一 }
        sellingPoints: { type: string, maxLength: 300, description: 卖点，可选 }
        description: { type: string, maxLength: 300, description: 描述，可选 }
        imageMediaIds:
          type: array
          minItems: 1
          maxItems: 10
          description: 有序图片媒体 ID，`[0]` 为主图；上限取 `SEEAITV_MARKETING_MAX_PRODUCT_IMAGES`（默认 10），同一张不能出现两次
          items: { $ref: '#/components/schemas/Id' }
    MarketingProductSummary:
      type: object
      description: 商品列表项（不含全部图片 ID）。
      required: [id, name, imageCount, mainMediaId, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        imageCount: { type: integer, minimum: 0 }
        mainMediaId: { type: string, nullable: true, description: 主图媒体 ID；取图走受保护的媒体下载端点 }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MarketingProduct:
      type: object
      description: 商品详情。
      required: [id, name, sellingPoints, description, imageMediaIds, mainMediaId, imageCount, version, updatedByName, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        sellingPoints: { type: string }
        description: { type: string }
        imageMediaIds:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        mainMediaId: { type: string, nullable: true }
        imageCount: { type: integer, minimum: 0 }
        version: { type: integer, description: 乐观锁版本；只有内容保存推进 }
        updatedByName: { type: string, nullable: true, description: 最后编辑者昵称；未知时为 null }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MarketingCharacterInput:
      type: object
      description: 工作区角色内容（新建 / 整份更新）。长度按码点计；未知字段直接拒（40001）。
      required: [name, imageMediaIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, description: '角色名（两端空白会去掉）；不能含 @ < > / \ | : * ? ( ) （ ）；工作区内不重名（不区分大小写）' }
        imageMediaIds:
          type: array
          minItems: 1
          maxItems: 9
          description: 有序图片媒体 ID（本工作区、PNG / JPEG / WEBP），`[0]` 为主图，同一张不能出现两次
          items: { $ref: '#/components/schemas/Id' }
        appearance: { type: string, maxLength: 500, description: 形象描述，可选 }
        styleCode: { type: string, maxLength: 64, nullable: true, description: 最近一次生成用的画风（风格素材 code），只用来回填下拉 }
        voiceText: { type: string, maxLength: 500, description: 音色描述，可选 }
        voiceMediaId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true
          description: 参考音频（本工作区的音频文件，至多 1 段）。**只存不发**：不会发送给任何模型（MKD-33）
    MarketingCharacterGenerateRequest:
      type: object
      required: [modelCode, description, count]
      additionalProperties: false
      properties:
        modelCode: { type: string, description: '图片模型（`GET /models?resultType=image`）' }
        description: { type: string, minLength: 1, maxLength: 500, description: '形象描述（按码点计），即提示词' }
        styleCode: { type: string, maxLength: 64, description: '画风素材码（`GET /canvas/styles`）；可选' }
        referenceMediaIds:
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/Id' }
          description: '参考图（本工作区图片，有序）；可选。张数决定操作（0 → text2img，≥ 1 → img2img）'
        count: { type: integer, minimum: 1, maximum: 4, description: '生成张数（per_image 计价）' }
        dryRun: { type: boolean, default: false, description: '只报价不受理' }

    MarketingCharacterGenerateQuote:
      type: object
      required: [operation, credits, unit, blocked]
      properties:
        operation: { type: string, enum: [text2img, img2img] }
        credits: { type: integer, description: '报价（blocked 时为 0）' }
        unit: { type: string, description: '计价单位（blocked 时为空串）' }
        blocked: { type: boolean, description: '报价阶段被拒（能力矩阵 / 会员 / 价格 / 模型不可用）' }
        blockedReason: { type: string, description: '原因（与 `/generations/estimate` 的错误信息同一句）；仅 blocked 时出现' }
        userFixable: { type: boolean, description: '用户自己能解决（减参考图 / 升级会员 / 缩短描述）；仅 blocked 时出现' }

    MarketingCharacterGenerateAccepted:
      type: object
      required: [operation, generationId, credits, replayed]
      properties:
        operation: { type: string, enum: [text2img, img2img] }
        generationId: { $ref: '#/components/schemas/Id' }
        credits: { type: integer, description: '本次扣的积分（== dryRun 报价）' }
        replayed: { type: boolean, description: '同一幂等键重放，没有再扣费' }

    MarketingCharacterSummary:
      type: object
      description: 角色列表项（不含全部图片 ID）。
      required: [id, name, imageCount, mainMediaId, hasVoice, source, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        imageCount: { type: integer, minimum: 0 }
        mainMediaId: { type: string, nullable: true, description: 主图媒体 ID；取图走受保护的媒体下载端点 }
        hasVoice: { type: boolean }
        source: { type: string, enum: [user, preset], description: user = 自建；preset = 从营销角色添加的副本 }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MarketingCharacter:
      type: object
      description: 工作区角色详情（媒体 ID 都属于本工作区）。
      required: [id, name, imageMediaIds, mainMediaId, imageCount, appearance, styleCode, voiceText, voiceMediaId,
        source, sourcePresetId, sourcePresetVersion, version, updatedByName, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        imageMediaIds:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        mainMediaId: { type: string, nullable: true }
        imageCount: { type: integer, minimum: 0 }
        appearance: { type: string }
        styleCode: { type: string, nullable: true }
        voiceText: { type: string }
        voiceMediaId: { type: string, nullable: true }
        source: { type: string, enum: [user, preset] }
        sourcePresetId: { type: string, nullable: true, description: 来源营销角色（source=preset 时） }
        sourcePresetVersion: { type: integer, nullable: true, description: 添加时营销角色的版本（source=preset 时） }
        version: { type: integer, description: 乐观锁版本 }
        updatedByName: { type: string, nullable: true, description: 最后编辑者昵称；未知时为 null }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MarketingPresetCharacter:
      type: object
      description: |
        营销角色（平台预置）的用户端视图。⚠️ **不含任何媒体 ID**（与管理端 `AdminMarketingPresetCharacter` 分开定义）：
        图片按 `/marketing/preset-characters/{id}/images/{index}` 取，音频按 `/voice` 取。
      required: [id, name, summary, imageCount, hasVoice, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        summary: { type: string, description: 一句话说明 }
        imageCount: { type: integer, minimum: 0 }
        hasVoice: { type: boolean }
        version: { type: integer, description: 内容版本；添加后改版会得到新副本 }
    MarketingConfig:
      type: object
      required: [available, unavailableReason, slots, maxProductImages, maxVariants, dimensions, categories, creativeModelFilters,
        maxProductsPerSession, maxCharacterRefs, maxCharacterImages, maxCharacterGenCount, quota, characterNameForbidden,
        allowedImageMimes, textLimits]
      description: 营销页配置（MKT-T-04）。商品库 / 角色库的上限与规则（MKT-T-37）同样从这里下发，前端不写死。
      properties:
        available: { type: boolean, description: false = 能浏览、发不出去（Agent 总开关关着，B-5） }
        unavailableReason:
          type: string
          nullable: true
          enum: [agent_disabled, null]
          description: 仅 available=false 时给；按它呈现，不匹配文案
        slots:
          type: array
          description: 场景默认槽位（未选技能时）
          items: { $ref: '#/components/schemas/MarketingSlotDecl' }
        maxProductImages: { type: integer, minimum: 1, description: 每个商品的图片上限（SEEAITV_MARKETING_MAX_PRODUCT_IMAGES，默认 10） }
        maxProductsPerSession: { type: integer, minimum: 1, description: 一次创作可选的商品数（1） }
        maxCharacterRefs: { type: integer, minimum: 1, description: 角色槽上限（角色库角色 + 脚本角色资产合计，2） }
        maxCharacterImages: { type: integer, minimum: 1, description: 每个角色的图片上限（9） }
        maxCharacterGenCount: { type: integer, minimum: 1, description: 一次「生成角色」的张数上限（4） }
        quota:
          type: object
          required: [products, characters]
          description: 每个工作区未删除的商品 / 角色数上限（SEEAITV_MARKETING_MAX_PRODUCTS / _MAX_CHARACTERS）
          properties:
            products: { type: integer, minimum: 1 }
            characters: { type: integer, minimum: 1 }
        characterNameForbidden:
          type: array
          description: 角色名里不允许出现的字符（逐字符一项）；前端预检读它，不另抄一份
          items: { type: string }
        allowedImageMimes:
          type: array
          description: 商品 / 角色图片接受的格式（按上传时文件头嗅探出的类型）
          items: { type: string }
        textLimits:
          type: object
          required: [productName, sellingPoints, productDescription, characterName, appearance, voiceText]
          description: 商品 / 角色文本字段的长度上限（码点）
          properties:
            productName: { type: integer }
            sellingPoints: { type: integer }
            productDescription: { type: integer }
            characterName: { type: integer }
            appearance: { type: integer }
            voiceText: { type: integer }
        maxVariants: { type: integer, minimum: 1, description: 变体上限（SEEAITV_MARKETING_MAX_VARIANTS） }
        dimensions:
          type: array
          description: 四个选择器维度，顺序即胶囊顺序：技能 → 创意 → Hook → 风格
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string, enum: [skill, creative, hook, style] }
              label: { type: string }
        categories:
          type: object
          required: [creative, hook, style]
          description: 三类选项各自启用的分类，按 sort
          properties:
            creative: { type: array, items: { $ref: '#/components/schemas/MarketingCategory' } }
            hook: { type: array, items: { $ref: '#/components/schemas/MarketingCategory' } }
            style: { type: array, items: { $ref: '#/components/schemas/MarketingCategory' } }
        creativeModelFilters:
          type: array
          description: 「按模型」筛选项（在投创意推荐过的 ∩ 当前可用视频模型，按模型目录顺序）
          items: { $ref: '#/components/schemas/MarketingModelRef' }
    MarketingModelRef:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    MarketingRecommendedModel:
      type: object
      required: [code, name, available]
      properties:
        code: { type: string }
        name: { type: string }
        available: { type: boolean, description: false = 此刻不在模型下拉里（停用 / Provider 未就绪）；照样列出由前端说明 }
    MarketingOption:
      type: object
      description: |
        用户端看到的一条营销选项（MKT-T-04）。⚠️ **没有 `prompt` 字段**（MKT-AC-06），也没有媒体 ID；
        与管理端的 `AdminMarketingOption` 分开定义（可选字段迟早会在用户端被填上）。
      required: [kind, code, name, categoryCode, description, lifecycle, coverCount, hasPreview, isAudioRequired,
        outputTypes, inputRequirements, tags, recommendedModels, recommendedParams, defaultSkillCode]
      properties:
        kind: { $ref: '#/components/schemas/MarketingKind' }
        code: { type: string }
        name: { type: string }
        categoryCode: { type: string }
        description: { type: string }
        lifecycle: { $ref: '#/components/schemas/MarketingLifecycle' }
        coverCount: { type: integer, minimum: 0, description: '封面张数；取图走 /marketing/options/{code}/covers/{index}，index ∈ [0, coverCount)' }
        hasPreview: { type: boolean, description: '有示例视频；取流走 /marketing/options/{code}/preview' }
        isAudioRequired: { type: boolean, description: 需要出声模型才生效（如抓耳音效类 Hook） }
        outputTypes:
          type: array
          items: { type: string, enum: [video, image] }
        inputRequirements:
          type: object
          description: 槽位 key → required / optional
          additionalProperties: { type: string, enum: [required, optional] }
        tags:
          type: array
          items: { type: string }
        recommendedModels:
          type: array
          description: 仅创意；其余类型为空数组。已被删除的模型不列
          items: { $ref: '#/components/schemas/MarketingRecommendedModel' }
        recommendedParams:
          type: object
          additionalProperties: true
          description: 仅创意（如 `{"aspectRatio":"9:16","durationSec":[10,15]}`）；其余类型为 `{}`
        defaultSkillCode: { type: string, nullable: true, description: 仅创意 }
    AdminMarketingOptionFields:
      type: object
      properties:
        name: { type: string, maxLength: 24 }
        categoryCode: { type: string }
        description: { type: string, maxLength: 60 }
        coverMediaIds:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          description: 管理端上传的封面（`purpose=material_cover`）；创意 1~3、Hook / 风格 1；下限只在启用时强制
        previewMediaId: { type: [string, 'null'], description: 示例视频（管理端上传） }
        prompt: { type: string, description: '服务端片段（≤1000 字）；**只有管理端有这个字段**' }
        outputTypes: { type: array, items: { type: string, enum: [video, image] } }
        inputRequirements:
          type: object
          additionalProperties: { type: string, enum: [required, optional] }
          description: 键只认 product / character / source_video
        isAudioRequired: { type: boolean }
        recommendedModels: { type: array, items: { type: string }, description: 仅创意；不存在拒、停用或不支持只告警 }
        recommendedParams:
          type: object
          description: '仅创意：`{"aspectRatio":"9:16","durationSec":[10,15]}`'
          additionalProperties: true
        defaultSkillCode: { type: [string, 'null'], description: 仅创意；不存在拒、停用或不属营销场景只告警 }
        tags: { type: array, items: { type: string }, description: 带「口播」时检查提示句 }
        startAt: { type: [string, 'null'], format: date-time, description: 'RFC3339 带时区；半开区间 [startAt, endAt)' }
        endAt: { type: [string, 'null'], format: date-time }
        sort: { type: integer }
    AdminMarketingOptionCreate:
      allOf:
        - $ref: '#/components/schemas/AdminMarketingOptionFields'
        - type: object
          required: [kind, code, name, categoryCode]
          properties:
            kind: { $ref: '#/components/schemas/MarketingKind' }
            code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$', description: 跨类型全局唯一，建后不可改 }
    AdminMarketingOptionUpdate:
      allOf:
        - $ref: '#/components/schemas/AdminMarketingOptionFields'
        - type: object
          required: [version, name, categoryCode]
          properties:
            version: { type: integer, minimum: 1, description: 乐观锁 }
            kind: { $ref: '#/components/schemas/MarketingKind' }
            code: { type: string, description: 可带；与原值不同即 40001 }
    AdminMarketingOption:
      type: object
      required: [id, kind, code, name, categoryCode, description, coverMediaIds, previewMediaId, prompt,
        outputTypes, inputRequirements, isAudioRequired, recommendedModels, recommendedParams, defaultSkillCode,
        tags, startAt, endAt, sort, isEnabled, version, lifecycle, warnings, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MarketingKind' }
        code: { type: string }
        name: { type: string }
        categoryCode: { type: string }
        description: { type: string }
        coverMediaIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
        previewMediaId: { type: [string, 'null'] }
        prompt: { type: string, description: 服务端片段（用户端 DTO 没有这个字段，MKT-AC-06） }
        outputTypes: { type: array, items: { type: string } }
        inputRequirements: { type: object, additionalProperties: { type: string } }
        isAudioRequired: { type: boolean }
        recommendedModels: { type: array, items: { type: string } }
        recommendedParams: { type: object, additionalProperties: true }
        defaultSkillCode: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        startAt: { type: [string, 'null'], format: date-time }
        endAt: { type: [string, 'null'], format: date-time }
        sort: { type: integer }
        isEnabled: { type: boolean }
        version: { type: integer, description: 内容版本；每次保存 +1，启停与排序不推进 }
        lifecycle: { $ref: '#/components/schemas/MarketingLifecycle' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/MarketingIssue' }
          description: 当前全部问题（列表 / 详情）或本次保存的告警（新建 / 更新）；`level=error` 的项会挡住启用
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminMarketingPresetCharacter:
      type: object
      description: 管理端营销角色（与用户端预置角色 DTO **分开定义**：用户端不下发媒体 ID）。
      required: [id, name, summary, imageMediaIds, imageUrls, appearance, voiceText, voiceMediaId, voiceUrl,
        sort, isEnabled, version, warnings, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        summary: { type: string, description: 一句话说明 }
        imageMediaIds: { type: array, items: { $ref: '#/components/schemas/Id' }, description: '有序，[0] 为主图' }
        imageUrls:
          type: array
          items: { type: string }
          description: 与 imageMediaIds 同序的平台媒体地址（`/api/v1/admin/media/{id}`，要带 admin token fetch 成 blob）
        appearance: { type: string, description: 形象描述 }
        voiceText: { type: string, description: 音色描述 }
        voiceMediaId: { type: [string, 'null'], description: 参考音频（只存不发给任何模型，MKD-33） }
        voiceUrl: { type: [string, 'null'] }
        sort: { type: integer }
        isEnabled: { type: boolean }
        version: { type: integer, description: 内容版本；每次保存 +1，启停与排序不推进 }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/MarketingIssue' }
          description: 当前全部问题（列表 / 详情）或本次保存的告警（新建 / 更新）；`level=error` 的项会挡住启用
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminMarketingPresetCharacterInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 50 }
        summary: { type: string, maxLength: 60 }
        imageMediaIds:
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/Id' }
          description: 管理端上传（`POST /admin/media`，purpose=material_cover，expectKind=image）的平台素材
        appearance: { type: string, maxLength: 500 }
        voiceText: { type: string, maxLength: 500 }
        voiceMediaId:
          type: [string, 'null']
          description: 管理端上传（purpose=material_cover，expectKind=audio）的音频；空 / null = 不要音频
    AdminMarketingPresetCharacterUpdate:
      allOf:
        - $ref: '#/components/schemas/AdminMarketingPresetCharacterInput'
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1, description: 乐观锁：编辑开始时读到的版本 }
    AdminMarketingOptionVersion:
      type: object
      required: [id, version, snapshot, createdByAdminId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: integer }
        snapshot:
          type: object
          additionalProperties: true
          description: 该版本原文（kind / code / version / name / description / prompt / tags / isAudioRequired / outputTypes / inputRequirements）
        createdByAdminId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ModelParamSupport:
      type: object
      required: [paramCode, paramName, paramEnabled, allowedValues, defaultValue, override]
      properties:
        paramCode: { type: string }
        paramName: { type: string }
        paramEnabled: { type: boolean }
        allowedValues: { type: [array, 'null'], items: {}, description: 可选值（字符串或数字，照参数定义）；null = 不收窄 }
        defaultValue: { type: string }
        override: { type: [object, 'null'], additionalProperties: true, description: 覆盖参数定义的配置 }
    ModelParamSupportInput:
      type: object
      required: [paramCode]
      properties:
        paramCode: { type: string }
        allowedValues: { type: [array, 'null'], items: {} }
        defaultValue: { type: string }
        override: { type: [object, 'null'], additionalProperties: true }
    ModelTemplate:
      type: object
      required: [code, name, baseUrl, authType, installed, status, hasApiKey, isReady, version, models]
      properties:
        code: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        authType: { type: string }
        headerName: { type: string }
        installed: { type: boolean, description: 库里有这个厂商（被用户删掉后为 false） }
        status: { type: string }
        hasApiKey: { type: boolean }
        isReady: { type: boolean }
        version: { type: integer }
        models:
          type: array
          items:
            type: object
            required: [code, name, domain, installed, status]
            properties:
              code: { type: string }
              name: { type: string }
              domain: { type: string }
              installed: { type: boolean }
              status: { type: string }
    ModelTemplateEnableResult:
      type: object
      required: [provider, enabledCount, models]
      properties:
        provider: { type: string }
        enabledCount: { type: integer }
        models:
          type: array
          items:
            type: object
            required: [code, name, enabled]
            properties:
              code: { type: string }
              name: { type: string }
              enabled: { type: boolean }
              skipped: { type: boolean, description: 之前已启用，本次跳过 }
              reason: { type: string }
              blockers: { type: [array, 'null'], items: { $ref: '#/components/schemas/ModelPublishBlocker' } }
    ProjectImportResult:
      type: object
      required: [projectId, name, warnings]
      properties:
        projectId: { $ref: '#/components/schemas/Id' }
        name: { type: string, description: 导入后的项目名（重名时已追加「（导入）」） }
        warnings: { type: array, items: { type: string }, description: 缺文件的媒体、本机未配置的模型等 }
    AdminAgentSkill:
      type: object
      required: [id, code, name, category, description, tags, coverMediaId, steps, tools, modelBindings,
        isQuickEntry, sort, isEnabled, version, scenes, inputSlots, prefillText, isBatch, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        coverMediaId: { type: [string, 'null'] }
        body: { type: string, description: '主说明（模板，支持 {{var}} 占位符）；列表不返回' }
        steps: { type: array, items: { $ref: '#/components/schemas/AdminAgentSkillStep' } }
        tools: { type: array, items: { type: string }, description: 工具白名单；空 = 不收窄 }
        modelBindings:
          type: object
