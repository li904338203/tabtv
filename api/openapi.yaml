        name: { type: string, maxLength: 64 }
        body: { type: string }
        sort: { type: integer, minimum: 0, maximum: 100000 }

    AdminAgentSkillVersion:
      type: object
      required: [skillVersion]
      properties:
        skillVersion: { type: integer }

    AgentRefInput:
      type: object
      required: [kind, id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [node, media, asset, marketing_product, marketing_character]
