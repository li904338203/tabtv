        id: { type: string, minLength: 1, description: 节点 ID（画布内）或素材 / 资产 / 商品 / 角色的十进制 ID }
        url:
          type: string
          description: 只为认出来并拒绝：带地址的引用一律 400（GO-27）
        slot:
          type: string
          enum: [product, character, source_video]
          description: 只用于建营销会话（scene=marketing）：引用填在哪个槽；其余入口带了一律 400
        order:
          type: integer
          minimum: 1
          description: 只用于建营销会话：槽内顺序（商品槽 1 为主图）；一个槽里要么都给、要么都不给，不得重复

    AgentCreateSessionRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        projectId: { type: string, pattern: '^[0-9]+$' }
        createProject:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 100, description: 缺省取首条消息前 20 字（营销会话正文为空时取商品名称） }
        message:
          type: object
          additionalProperties: false
          properties:
            text: { type: string, maxLength: 8000 }
            refs:
              type: array
              description: |
                不带 slot 的引用最多 20 项；营销会话里带 slot 的按槽位上限另计（商品槽上限为
                `GET /marketing/config` 的 `maxProductImages`）。
              items: { $ref: '#/components/schemas/AgentRefInput' }
        skillCode: { type: string, description: 营销会话里必须是营销场景且启用的技能 }
        prefs: { type: object, additionalProperties: true }
        scene: { $ref: '#/components/schemas/AgentSessionScene' }
        marketing: { $ref: '#/components/schemas/AgentMarketingInput' }

    AgentSessionScene:
      type: string
      enum: [general, marketing]
      description: 会话场景；缺省 general。建后不可改（MKT-T-17）

    AgentMarketingInput:
      type: object
      additionalProperties: false
      description: 建营销会话的营销输入（只在 scene=marketing 时可带）
      properties:
        product:
          type: object
          deprecated: true
          description: |
            **已废弃（MKT-T-37，MKD-27），出现即 400/40001 `details{field:"marketing.product", code:"legacy_shape"}`**：
            商品名称、卖点、描述改由商品库提供（商品槽引用 `kind=marketing_product`）。字段只为认出旧前端并拒绝。
          properties:
            name: { type: string }
            sellingPoints: { type: string }
        picks:
          type: object
          additionalProperties: false
          description: 三个维度各选一项的 code；null / 缺省 = 未选。版本由服务端钉住
          properties:
            creative: { type: [string, 'null'] }
            hook: { type: [string, 'null'] }
            style: { type: [string, 'null'] }

    AgentSceneInput:
      type: object
      required: [products, product, characters, sourceVideo, picks, pins]
      description: |
        营销会话的输入快照（agent_session.scene_input）：只有 ID、名称、卖点与选项 (code, version, name)，
        **不含 URL、不含片段原文**。ID 一律字符串。
        商品库会话（MKT-T-37）多出 `productId` / `productVersion` / `product.description` 与角色快照字段；
        旧会话没有这些字段（读取方一律按可缺处理）。
      properties:
        productId: { type: string, description: 来源商品（快照时）；旧会话没有 }
        productVersion: { type: integer, description: 快照时商品的版本；旧会话没有 }
        products:
          type: array
          description: 商品图 mediaId（有序，[0] 为主图）
          items: { type: string }
        product:
          type: object
          required: [name, sellingPoints]
          properties:
            name: { type: string }
            sellingPoints: { type: string }
            description: { type: string, description: 商品描述（商品库会话才有） }
        characters:
          type: array
          items: { $ref: '#/components/schemas/AgentSceneRef' }
        sourceVideo:
          oneOf:
            - $ref: '#/components/schemas/AgentSceneRef'
            - type: 'null'
        picks:
          type: object
          required: [creative, hook, style]
          properties:
            creative: { oneOf: [{ $ref: '#/components/schemas/AgentScenePick' }, { type: 'null' }] }
            hook: { oneOf: [{ $ref: '#/components/schemas/AgentScenePick' }, { type: 'null' }] }
            style: { oneOf: [{ $ref: '#/components/schemas/AgentScenePick' }, { type: 'null' }] }
        pins:
          type: array
          description: 规划时新钉的选项（建会话时为空）
          items:
            type: object
            required: [kind, code, version]
            properties:
              kind: { $ref: '#/components/schemas/MarketingKind' }
              code: { type: string }
              version: { type: integer }
              source: { type: string }

    AgentSceneRef:
      type: object
      required: [kind, id]
      description: |
        槽位里的一个引用。角色库角色（MKT-T-37）快照成 `kind=media`、`id`=主图，并带 `characterId` 与名称 / 形象 /
        音色描述 / 参考音频 —— 参考音频只存不发（MKD-33），任何模型请求都不带它；这些字段旧会话与源视频都没有。
      properties:
        kind: { type: string, enum: [media, asset, node] }
        id: { type: string }
        characterId: { type: string }
        name: { type: string }
        appearance: { type: string }
        voiceText: { type: string }
        voiceMediaId: { type: string }

    AgentScenePick:
      type: object
      required: [code, version]
      properties:
        code: { type: string }
        version: { type: integer, description: 建会话时钉住的版本；之后运营改了选项也不变 }
        name: { type: string, description: 该版本的选项名称 }

    AgentPostMessageRequest:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 8000 }
        refs:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentRefInput' }
        skillCode: { type: string }
        prefs: { type: object, additionalProperties: true }

    AgentWriteResult:
      type: object
      required: [sessionId, projectId, state, turnId, messageId, queued, replayed]
      properties:
        sessionId: { type: string }
        projectId: { type: string }
        state: { $ref: '#/components/schemas/AgentSessionState' }
        turnId: { type: [string, 'null'] }
        messageId: { type: [string, 'null'], description: 幂等重放时为 null }
        queued: { type: boolean, description: 会话正在运行，这条消息排队为下一轮 }
        replayed: { type: boolean }

    AgentPromptOptimizeRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 8000, description: 输入框里的正文 }
        modelCode: { type: string, description: 推理模型；缺省用平台第一个可用的推理模型 }
        purpose:
          type: string
          enum: [general, character_appearance]
          default: general
          description: |
            改写用途（MKT-T-35、dev/05 MKD-29）：`general`（缺省，创造页一键优化，行为不变）/
            `character_appearance`（营销角色「AI 帮写」：只改写非真人角色的外观描述）。
            只换改写指令，报价、账本流水（refType=`agent_turn`）、退款与恢复扫描完全相同；其他值 40001。

    AgentPromptOptimizeResult:
      type: object
      required: [id, text, modelCode, credits, replayed]
      properties:
        id: { type: string, description: 本次调用记录（也是账本 refId） }
        text: { type: string, description: 改写后的正文 }
        modelCode: { type: string }
        credits: { type: integer, description: 本次扣的积分（按轮） }
        replayed: { type: boolean, description: 同键重放，没有再扣费 }

    AgentSessionState:
      type: string
      enum: [idle, planning, awaiting_input, awaiting_approval, executing, waiting_task, failed, cancelled]

    AgentSession:
      type: object
      required: [id, workspaceId, projectId, title, state, createdByUserId, initiatorName, isInitiator,
        skillCodes, prefs, todo, approvedBudget, planDocVersion, stopRequested, lastActiveAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        projectId: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/AgentSessionState' }
        createdByUserId: { type: string }
        initiatorName: { type: string }
        isInitiator: { type: boolean, description: 当前用户是不是发起人（只有发起人能继续对话 / 提交卡片） }
        skillCodes: { type: array, items: { type: string } }
        prefs: { type: object, additionalProperties: true }
        todo: { type: array, items: {} }
        approvedBudget: { type: integer }
        planDocVersion: { type: [integer, 'null'] }
        stopRequested: { type: boolean }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentMessage:
      type: object
      required: [id, seq, role, content, refs, toolCalls, toolCallId, turnId, cardId, createdAt]
      properties:
        id: { type: string }
        seq: { type: integer }
        role: { type: string, enum: [user, assistant, tool, system_note, system_event] }
        content: { type: string }
        refs: { type: array, items: {}, description: 服务端解析过的引用摘要 }
        toolCalls: { type: [array, 'null'], items: {} }
        toolCallId: { type: [string, 'null'] }
        turnId: { type: [string, 'null'] }
        cardId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    AgentStep:
      type: object
      required: [id, turnId, tool, status, attempt, display, generationId, creditsQuoted, errorMessage, startedAt, finishedAt]
      properties:
        id: { type: string }
        turnId: { type: string }
        tool: { type: string }
        status: { type: string, enum: [running, success, failed, cancelled, waiting] }
        attempt: { type: integer }
        display: { type: object, additionalProperties: true }
        generationId: { type: [string, 'null'] }
        creditsQuoted: { type: integer }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    AgentCard:
      type: object
      required: [id, stepId, kind, status, payload, submission, submittedBy, submittedAt, createdAt]
      properties:
        id: { type: string }
        stepId: { type: string }
        kind: { type: string, enum: [choice, questions, plan_confirm, budget, delete_confirm] }
        status: { type: string, enum: [pending, submitted, expired, voided] }
        payload: { type: object, additionalProperties: true, description: 卡片内容（金额由服务端报价） }
        submission: { type: [object, 'null'], additionalProperties: true }
        submittedBy: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    AgentPlanItem:
      type: object
      description: |
        规划确认卡的一个计划项。`blockedCode` 非空时这一项此刻不可用（`credits = 0`），按 `userFixable` 定语气、不匹配文案；
        营销选项导致的不可用为 `MARKETING_OPTION_UNAVAILABLE`（如依赖出声的 Hook 配了不出声的模型），批准时回 422/42215。

        营销会话的条目（MKT-T-20）另带：`key`（执行时 generate 凭它取已批准的条目）、`productIndexes` / `productMediaIds`
        （选用的商品图序号与同序媒体 ID，取自会话的商品图）、`productTotal`（会话商品图总数）、`imageLimit`
        （本项最多能用几张商品图 = 模型 × 操作的 image 上限 − 角色图占用；0 = 该操作不收图）、`picks`（钉住的选项版本）。
        `inputs` 由服务端按选中的商品图 + 角色算出（视频生视频条目为 `{video: 1}`）。

        素材裂变条目（MKT-T-28）另带：`sourceVideoId`（会话源视频的媒体 ID，发卡时冻结）、`fissionRoute`
        （`video2video` = 源视频作为唯一输入发给上游；`regenerate` = 所选模型不能以视频为输入，按商品图与选项重新生成、
        不发源视频）、`fissionReason`（走 regenerate 的原因）、`fissionNote`（服务端写的说明：走哪条、为什么、本项花多少；
        批准时重新报价后随金额重写）。
      required: [kind, label, quantity, credits]
      properties:
        kind: { type: string, description: video / image / audio / storyboard / compose / asset / render }
        modelCode: { type: string }
        operationCode: { type: string }
        inputs:
          type: object
          additionalProperties: { type: integer }
        label: { type: string }
        quantity: { type: integer }
        unit: { type: string, enum: [second, image, time] }
        credits: { type: integer, minimum: 0 }
        blockedCode: { type: string }
        blockedReason: { type: string }
        userFixable: { type: boolean }
        key: { type: string }
        variant: { type: integer, minimum: 1 }
        variantLabel: { type: string }
        productIndexes:
          type: array
          items: { type: integer, minimum: 1 }
        productMediaIds:
          type: array
          items: { type: string }
        productTotal: { type: integer, minimum: 0 }
        imageLimit: { type: integer, minimum: 0 }
        picks:
          type: array
          items: { $ref: '#/components/schemas/AgentPlanPick' }
        sourceVideoId: { type: string }
        fissionRoute: { type: string, enum: [video2video, regenerate] }
        fissionReason: { type: string }
        fissionNote: { type: string }

    AgentPlanPick:
      type: object
      description: 计划项用到的营销选项：(kind, code, version) 永远指向同一段原文（片段不下发）；name 是该版本的名称。
      required: [kind, code, version]
      properties:
        kind: { type: string, enum: [creative, hook, style] }
        code: { type: string }
        version: { type: integer, minimum: 1 }
        name: { type: string }

    AgentPlanItemOverride:
      type: object
      description: |
        确认前换图（规划确认卡 `approve` 的 `submission.itemOverrides[]`）。`key` 必须是卡片上的营销条目；
        `productIndexes` 从 1 起、不重复、在 1..`productTotal` 内、张数 1..`imageLimit`（超上限拒绝不截断）。
      required: [key, productIndexes]
      additionalProperties: false
      properties:
        key: { type: string }
        productIndexes:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1 }

    AgentTurn:
      type: object
      required: [id, trigger, status, modelCode, creditsCost, callCount, validOutputs, errorCode, errorMessage, startedAt, finishedAt, createdAt]
      properties:
        id: { type: string }
        trigger: { type: string, enum: [user, system] }
        status: { type: string, enum: [pending, running, success, failed, cancelled] }
        modelCode: { type: string }
        creditsCost: { type: integer, description: 本轮对话费报价；实际扣退以账本为准 }
        callCount: { type: integer }
        validOutputs: { type: integer }
        errorCode: { type: string }
        errorMessage: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    AgentMessagePage:
      type: object
      required: [items, steps, cards, turns, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentMessage' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
        cards:
          type: array
          items: { $ref: '#/components/schemas/AgentCard' }
        turns:
          type: array
          items: { $ref: '#/components/schemas/AgentTurn' }
        nextCursor: { type: [string, 'null'], description: 更早一页的游标；null 表示没有更早的了 }

    AgentSessionDetail:
      type: object
      required: [session, budget, pendingCards, latestTurn, messages]
      properties:
        session: { $ref: '#/components/schemas/AgentSession' }
        budget:
          type: object
          required: [approved, spent, refunded]
          properties:
            approved: { type: integer }
            spent: { type: integer, description: 额度已占用（预留 + 已扣的报价合计） }
            refunded: { type: integer, description: 失败已退款而归还额度的报价合计 }
        pendingCards:
          type: array
          items: { $ref: '#/components/schemas/AgentCard' }
        latestTurn:
          oneOf:
            - $ref: '#/components/schemas/AgentTurn'
            - type: 'null'
        messages: { $ref: '#/components/schemas/AgentMessagePage' }
        scene: { $ref: '#/components/schemas/AgentSessionScene' }
        sceneInput:
          description: 营销会话的输入快照；通用会话为 null
          oneOf:
            - $ref: '#/components/schemas/AgentSceneInput'
            - type: 'null'
        planProgress:
          description: 营销会话最近一张已批准计划的执行进度（MKT-T-27，按步骤现算）；通用会话 / 还没有已批准计划时为 null
          oneOf:
            - $ref: '#/components/schemas/AgentPlanProgress'
            - type: 'null'

    AgentPlanProgress:
      type: object
      description: |
        批量变体的执行进度（MKT-T-27、MKD-10）：按 `agent_step` 的计划项键与错误码**现算**，不是存下来的标记。
        `status` 汇总优先级：还在跑（`running`）> 有成有败（`partial_success`，不摊平）> 全成（`success`）> 全败（`failed`）>
        还没开始（`pending`）。会话已不在执行时，没提交的条目不再算「还在跑」。
        `succeeded + failed + stopped + running + pending = total`。
      required: [cardId, status, total, succeeded, failed, stopped, running, pending, items]
      properties:
        cardId: { type: string, description: 那张已批准的规划确认卡 }
        status: { type: string, enum: [pending, running, partial_success, success, failed] }
        total: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        stopped: { type: integer, minimum: 0, description: 因余额不足停掉、没有提交也没有扣费的条目数 }
        running: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentPlanItemProgress' }

    AgentPlanItemProgress:
      type: object
      description: |
        一个计划项的执行状态：有在跑的 → `submitted`；否则成功过 → `success`；否则看最近一次（余额停止 → `stopped`，
        失败 / 取消 / 被拒 → `failed`）；没有提交过 → `pending`（计划已因余额不足停止时为 `stopped`）。
        失败的条目重试 = 新步骤、新幂等键（`attempts` 加一）。
      required: [key, label, state, attempts]
      properties:
        key: { type: string }
        label: { type: string }
        variant: { type: integer, minimum: 1 }
        variantLabel: { type: string }
        state: { type: string, enum: [pending, submitted, success, failed, stopped] }
        errorCode: { type: string, description: 最近一次失败的错误码（如 INSUFFICIENT_CREDITS、plan_stopped_insufficient_credits）；按码判不按文案 }
        attempts: { type: integer, minimum: 0 }

    AgentSubmitResult:
      type: object
      required: [sessionId, cardId, cardStatus, state, turnId, messageId, approvedBudget]
      properties:
        sessionId: { type: string }
        cardId: { type: string }
        cardStatus: { type: string, enum: [submitted, voided] }
        state: { $ref: '#/components/schemas/AgentSessionState' }
        turnId: { type: [string, 'null'], description: 拒绝（reject）不建轮次 }
        messageId: { type: [string, 'null'] }
        approvedBudget: { type: integer }

    AgentTask:
      type: object
      required: [stepId, generationId, tool, status, creditsQuoted]
      properties:
        stepId: { type: string }
        generationId: { type: string }
        tool: { type: string }
        status: { type: string, description: 生成任务当前状态（以生成域为准）；查不到时为 unknown }
        creditsQuoted: { type: integer }

    AgentStopResult:
      type: object
      required: [sessionId, state, stopRequested, tasks]
      properties:
        sessionId: { type: string }
        state: { $ref: '#/components/schemas/AgentSessionState' }
        stopRequested: { type: boolean }
        tasks:
          type: array
          description: 本会话未终态的生成任务（可取消项）
          items: { $ref: '#/components/schemas/AgentTask' }

    AgentCancelResult:
      type: object
      required: [sessionId, state, cancelledTasks, failedTasks, remainingTasks]
      properties:
        sessionId: { type: string }
        state: { $ref: '#/components/schemas/AgentSessionState' }
        cancelledTasks: { type: array, items: { type: string } }
        failedTasks:
          type: array
          items:
            type: object
            required: [generationId, message]
            properties:
              generationId: { type: string }
              message: { type: string }
        remainingTasks:
          type: array
          items: { $ref: '#/components/schemas/AgentTask' }

    AgentLedgerEntry:
      type: object
      required: [id, type, category, change, refType, refId, reason, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [grant, consume, refund, expire, adjust] }
        category: { type: string, enum: [chat, generation, refunded, other] }
        change: { type: integer, description: 带符号：消费为负、退款为正 }
        refType: { type: string }
        refId: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    AgentTurnLedger:
      type: object
      required: [turnId, trigger, status, chat, generation, refunded, entries]
      properties:
        turnId: { type: string }
        trigger: { type: string, enum: [user, system] }
        status: { type: string, enum: [pending, running, success, failed, cancelled] }
        chat: { type: integer, description: 对话费（正数） }
        generation: { type: integer, description: 生成费（正数） }
        refunded: { type: integer, description: 退回（正数，单列，不从花费里减） }
        entries:
          type: array
          items: { $ref: '#/components/schemas/AgentLedgerEntry' }

    # ---------- 对外 MCP（MCPT-03） ----------

    # ---------- 桌面版设置与管理端补登记（TT-T-10） ----------
    AppSettingItem:
      type: object
      required: [key, kind, value, default, set, restart]
      properties:
        key: { type: string }
        kind: { type: string, enum: [bool, int, string, secret] }
        value: { description: 当前值；`secret` 只给掩码（末 4 位） }
        default: { description: 缺省值 }
        set: { type: boolean, description: 用户设过（false = 用缺省值） }
        restart: { type: boolean, description: 改了要重启应用才生效 }
        min: { type: integer, description: 仅 int }
        max: { type: integer, description: 仅 int }

    AppSettings:
      type: object
      required: [items, dataDir]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AppSettingItem' } }
        dataDir: { type: string }

    AppSettingsUpdated:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AppSettingItem' } }
        restartRequired:
          type: [array, 'null']
          items: { type: string }
          description: 本次改动里要重启才生效的键

    DiagnosticsCheck:
      type: object
      required: [key, label, status, value]
      properties:
        key: { type: string }
        label: { type: string }
        status: { type: string, enum: [ok, warn, fail, na] }
        value: { type: string }
        advice: { type: string }

    DiagnosticsReport:
      type: object
      required: [version, checks]
      properties:
        version: { type: string }
        checks: { type: array, items: { $ref: '#/components/schemas/DiagnosticsCheck' } }

    StorageUsage:
      type: object
      required: [dataDir, media, database, logs, backups]
      properties:
        dataDir: { type: string }
        media: { type: integer, format: int64, description: 字节 }
        database: { type: integer, format: int64 }
        logs: { type: integer, format: int64 }
        backups: { type: integer, format: int64 }

    S3TestRequest:
      type: object
      properties:
        endpoint: { type: string }
        region: { type: string }
        bucket: { type: string }
        accessKey: { type: string }
        secretKey: { type: string }
        prefix: { type: string }
        pathStyle: { type: boolean }
        keepSecret: { type: boolean, description: true = 沿用已保存的 SecretKey }

    S3TestResult:
      type: object
      required: [ok, steps]
      properties:
        ok: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [step, ok]
            properties:
              step: { type: string }
              ok: { type: boolean }
              message: { type: string }

    VoiceItem:
      type: object
      required: [code, name, isFavorited]
      properties:
        code: { type: string }
        name: { type: string }
        language: { type: string }
        gender: { type: string }
        iconUrl: { type: string, description: 受保护媒体端点 }
        previewUrl: { type: string, description: 受保护媒体端点 }
        isFavorited: { type: boolean }

    AdminVoiceItem:
      allOf:
        - $ref: '#/components/schemas/VoiceItem'
        - type: object
          properties:
            upstreamVoiceId: { type: string }
            isEnabled: { type: boolean, description: 为 false 时字段省略 }
            iconMediaId: { type: string }
            previewMediaId: { type: string }
            sort: { type: integer }

    AdminVoiceInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        upstreamVoiceId: { type: string }
        language: { type: string }
        gender: { type: string }
        iconMediaId: { type: [string, 'null'], pattern: '^[0-9]+$' }
        previewMediaId: { type: [string, 'null'], pattern: '^[0-9]+$' }
        sort: { type: integer }
        isEnabled: { type: boolean }

    AdminMaterialItem:
      allOf:
        - $ref: '#/components/schemas/MaterialItem'
        - type: object
          properties:
            prompt: { type: string }
            isEnabled: { type: boolean, description: 为 false 时字段省略 }
            coverMediaId: { type: string }
            sort: { type: integer }

    AdminMaterialInput:
      type: object
      required: [type, code, name]
      properties:
        type: { type: string, enum: [style, effect, camera] }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        prompt: { type: string }
        author: { type: string }
        isCommercial: { type: boolean }
        coverMediaId: { type: [string, 'null'], pattern: '^[0-9]+$' }
        sort: { type: integer }
        isEnabled: { type: boolean }

    AdminParamDefinition:
      type: object
      required: [code, name, control, config, isEnabled]
      properties:
        code: { type: string }
        name: { type: string }
        control: { type: string }
        config: { type: object, additionalProperties: true }
        isEnabled: { type: boolean }

    AdminParamDefinitionInput:
      type: object
      required: [code, name, control]
      properties:
        code: { type: string }
        name: { type: string }
        control: { type: string }
        config: { type: object, additionalProperties: true }
        isEnabled: { type: [boolean, 'null'], description: 不传 = 不改 }

    AdminImagePreset:
      type: object
      required: [code, name, presetGroup, spec, inputMode, prompt, params, operation, sort, isEnabled]
      properties:
        code: { type: string }
        name: { type: string }
        presetGroup: { type: string, enum: [sheet, tuning, storyboard, space, tool, editor] }
        spec: { type: string }
        inputMode: { type: string, enum: [image_required, text_required, either] }
        icon: { type: string }
        prompt: { type: string, description: 配方追加词（只在服务端拼进生成请求） }
        params: { type: object, additionalProperties: true }
        dimensions:
          type: [array, 'null']
          items: { type: object, additionalProperties: true }
        operation: { type: string }
        sort: { type: integer }
        description: { type: string }
        isNew: { type: boolean }
        isEnabled: { type: boolean }
        isBuiltin: { type: boolean, readOnly: true }
        isUserModified: { type: boolean, readOnly: true }

    AdminOperation:
      type: object
      required: [code, name, domain, inNodeTypes, outNodeType, status, modelless]
      properties:
        code: { type: string }
        name: { type: string }
        domain: { type: string }
        inNodeTypes: { type: string, description: 逗号分隔的节点类型 }
        outNodeType: { type: string }
        status: { type: string }
        modelless: { type: boolean, description: 不绑模型（时间线渲染） }

    AdminModelProtocol:
      type: object
      required: [code, name, isAsync, requiresQueryPath, chatCapable, defaultSubmitPath, defaultQueryPath]
      properties:
        code: { type: string }
        name: { type: string }
        isAsync: { type: boolean }
        requiresQueryPath: { type: boolean }
        chatCapable: { type: boolean, description: 能否作 Agent 推理模型 }
        defaultSubmitPath: { type: string, description: 官方接口的提交路径（相对厂商地址）；空 = 没有通用值 }
        defaultQueryPath: { type: string, description: 官方接口的查询路径（异步协议）；空 = 没有通用值或不需要 }

    AdminProvider:
      type: object
      required: [code, name, adapterType, baseUrl, authType, hasApiKey, headers, connectTimeoutMs,
        requestTimeoutMs, idleTimeoutMs, maxRetries, maxConcurrent, status, isReady, version]
      properties:
        code: { type: string }
        name: { type: string }
        adapterType: { type: string }
        baseUrl: { type: string }
        authType: { type: string }
        hasApiKey: { type: boolean, description: 只说有没有，不回显密钥 }
        headers: { description: 自定义请求头（JSON） }
        testPath: { type: string }
        connectTimeoutMs: { type: integer }
        requestTimeoutMs: { type: integer }
        idleTimeoutMs: { type: integer }
        maxRetries: { type: integer }
        maxConcurrent: { type: integer, description: 0 = 不限 }
        status: { type: string }
        isReady: { type: boolean }
        version: { type: integer }

    SecretFieldInput:
      type: object
      required: [action]
      description: 密钥三态。`keep` 保留 / `replace` 替换（带 value）/ `clear` 清除；未知 action 按保留。
      properties:
        action: { type: string, enum: [keep, replace, clear] }
        value: { type: string }

    AdminProviderInput:
      type: object
      required: [code, name, baseUrl, authType]
      properties:
        code: { type: string }
        name: { type: string }
        adapterType: { type: string }
        baseUrl: { type: string }
        authType: { type: string }
        apiKey: { $ref: '#/components/schemas/SecretFieldInput' }
        headers: { description: 自定义请求头（JSON） }
        testPath: { type: string }
        connectTimeoutMs: { type: integer }
        requestTimeoutMs: { type: integer }
        idleTimeoutMs: { type: integer }
        maxRetries: { type: integer }
        maxConcurrent: { type: integer }
        status: { type: string }
        version: { type: integer, description: 乐观锁；新建传 0 }

    ProviderProbeResult:
      type: object
      required: [ok, errorKind, message, latencyMs]
      properties:
        ok: { type: boolean }
        statusCode: { type: integer }
        errorKind: { type: string, enum: [none, dns, connect, timeout, stream, http, policy] }
        message: { type: string }
        latencyMs: { type: integer, format: int64 }

    AdminModelOperationBinding:
      type: object
      required: [operation, enabled]
      properties:
        operation: { type: string }
        enabled: { type: boolean }
        estSeconds: { type: integer }

    AdminModel:
      type: object
      required: [code, name, providerCode, domain, upstreamModelCode, apiProtocol, estSeconds, status,
        subType, submitPath, queryPath, maxInputChars, sort, minMemberLevelId, operations,
        maxDurationSec, isMultiShot, hasNativeAudio, agentCapable]
      properties:
        code: { type: string }
        name: { type: string }
        providerCode: { type: string }
        domain: { type: string }
        upstreamModelCode: { type: string }
        apiProtocol: { type: string }
        estSeconds: { type: integer }
        status: { type: string }
        subType: { type: string }
        submitPath: { type: string }
        queryPath: { type: string }
        maxInputChars: { type: [integer, 'null'] }
        sort: { type: integer }
        minMemberLevelId: { type: string, description: 桌面版恒为空串 }
        operations: { type: array, items: { $ref: '#/components/schemas/AdminModelOperationBinding' } }
        maxDurationSec: { type: [integer, 'null'] }
        isMultiShot: { type: boolean }
        hasNativeAudio: { type: boolean }
        agentCapable: { type: boolean }

    AdminModelInput:
      type: object
      required: [code, name, providerCode, domain, upstreamModelCode, apiProtocol]
      properties:
        code: { type: string }
        name: { type: string }
        providerCode: { type: string }
        domain: { type: string }
        subType: { type: string }
        upstreamModelCode: { type: string }
        apiProtocol: { type: string }
        submitPath: { type: string }
        queryPath: { type: string }
        estSeconds: { type: integer }
        maxInputChars: { type: [integer, 'null'] }
        status: { type: string }
        sort: { type: integer }
        minMemberLevelId: { type: [string, 'null'], description: 桌面版不用 }
        maxDurationSec: { type: [integer, 'null'], description: 显式 null = 清除；不传 = 不改 }
        isMultiShot: { type: [boolean, 'null'] }
        hasNativeAudio: { type: [boolean, 'null'] }
        agentCapable: { type: [boolean, 'null'] }

    ModelPublishBlocker:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        detail: { type: string }

    ModelPublishCheck:
      type: object
      required: [publishable, blockers]
      properties:
        publishable: { type: boolean }
        blockers:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/ModelPublishBlocker' }

    ModelCapability:
      type: object
      required: [role, minCount, maxCount]
      properties:
        role: { type: string, enum: [text, image, audio, video, first_frame, last_frame, reference] }
        minCount: { type: integer, minimum: 0 }
        maxCount: { type: integer, minimum: 0 }
        allowedMime: { type: array, items: { type: string } }

    PromptSpec:
      type: object
      required: [code, name, required, optional, maxChars, builtin, hasBuiltin]
      properties:
        code: { type: string }
        name: { type: string }
        required: { type: array, items: { type: string }, description: 必填变量 }
        optional: { type: array, items: { type: string } }
        maxChars: { type: integer }
        builtin: { type: string, description: 代码内置原文 }
        hasBuiltin: { type: boolean }

    AdminPromptTemplate:
      type: object
      required: [code, status, version, content, hasUnpublishedDraft]
      properties:
        code: { type: string }
        modelCode: { type: string, description: 空 = 通用版 }
        status: { type: string, enum: [draft, published, archived] }
        version: { type: integer }
        content: { type: string, description: 生效内容 }
        draftContent: { type: string }
        hasUnpublishedDraft: { type: boolean }
        note: { type: string }

    PromptVersion:
      type: object
      required: [version, content, publishedAt]
      properties:
        version: { type: integer }
        content: { type: string }
        note: { type: string }
        publishedByAdminId: { type: string }
        publishedAt: { type: string }
        rollbackOfVersion: { type: integer }
