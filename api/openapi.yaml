openapi: 3.1.0

info:
  title: seeAitv API
  version: 0.1.0
  description: |
    AI 画布与 AI 视频平台的新 API。**不提供旧 Java API 兼容层**（GO-33、D-12）。

    本文件是契约唯一来源，与 `api/errors.yaml`、`api/events/*.schema.json` 共同生成
    Go 类型与两端 TypeScript 类型。**禁止手写重复 DTO，禁止手改生成物。**

    P00-03 冻结的是**跨切面约定**（鉴权、ID/时间/null、分页、上传、下载、版本冲突、
    幂等、订阅授权）与错误码；各阶段按需追加 path，追加时不得改动这些约定。
    相对旧系统的行为修正见 docs/design/契约与行为差异.md。

servers:
  - url: /api/v1

tags:
  - name: auth
    description: 认证与会话
  - name: workspace
    description: 工作区、成员与邀请
  - name: share
    description: 资源共享：授予、撤销与受让方视角（NEW-17/NEW-18）
  - name: content
    description: 门户内容：首页聚合、Banner 排期、公告与消息中心、精选作品
  - name: ops
    description: 任务运营台、死信处置、受控重试与人工补偿、项目运维（GAP-07、AD-08）
  - name: observability
    description: 请求日志、业务审计与统计口径（AD-07、GAP-24）
  - name: admin-identity
    description: 后台身份、RBAC 与认证配置（AD-05、AD-16、AD-17）
  - name: project
    description: 项目、文件夹与画布
  - name: catalog
    description: 画布配置与模型目录
  - name: settings
    description: 桌面版本机设置、存储与环境自检
  - name: billing
    description: 积分账本、余额与流水
  - name: generation
    description: 生成任务
  - name: media
    description: 上传与受保护媒体
  - name: workflow
    description: 整图 DAG 执行计划与运行
  - name: timeline
    description: 时间线：轨道、片段、字幕与按分镜装配
  - name: agent
    description: 画布 Agent：会话、消息、卡片、停止与取消、每轮账本（AGT-26）
  - name: admin-agent
    description: 管理端 Agent 技能配置（AGT-60；agent:read / agent:write）
  - name: marketing
    description: 用户端营销接口：配置、模板墙 / 选项弹层、详情、公开封面与示例视频（MKT-T-04；公开，不需要登录）
  - name: admin-marketing
    description: 管理端营销选项与分类（MKT-T-03；agent:read / agent:write）

# ============================================================================
# 工作区内的统一权限（P12-03；NEW-18、AC-02、AC-24、FULL-06）
#
# 一切带 `X-Workspace-Id` 的接口都过同一道闸，规则是：
#
#   · GET / HEAD        → 需要 `view`
#   · POST/PUT/PATCH/DELETE → 默认需要 `edit`
#   · **会扣费**的入口显式要 `generate`
#     （`POST /generations`、`/generations/{id}/retry`、
#      `/projects/{id}/workflow/runs`、`/workflow/runs/{id}/nodes/{id}/retry`、
#      脚本域的分镜 / 资产批量出图 / 提示词合成 / 组执行 / 子项重试）
#   · **把内容取出去**的入口显式要 `export`
#     （`POST /exports`、以及 `POST /timelines/{id}/renders` 的**非 dryRun** 调用）
#   · **只读的 POST** 显式放宽回 `view`
#     （`POST /projects/{id}/workflow/plan` —— 运行前预览不建 run、不扣费、可反复点；
#      `POST /timelines/{id}/renders` 的 `dryRun=true` —— 它报的"第几段缺素材"
#      是诊断信息，只读成员帮忙看问题时需要）
#
# 角色 → 动作：owner = 全部；admin = 除 transfer 外全部；
# editor = view/edit/generate/export；viewer = 仅 view。
#
# 不满足时返回 **403 / 40303**，`message` 会**说清缺的是哪一项**
# （"需要生成权限，你在该工作区是只读"）—— 一句"权限不足"用户不知道去找谁要什么。
#
# ⚠️ 这道闸在**路由层**，不在各 app 方法里。放在方法里的话，漏掉任何一处都不会有
# 编译错误，而漏掉的那一处就是一个隐身的越权口子 —— P12-02 之前正是如此：
# 角色只在画布域被检查过，一个只读成员可以上传素材、**发起生成花掉团队的积分**、
# 跑整张图、渲成片，而后台看不出任何异常。
# ============================================================================

security:
  - userBearer: []

paths:
  # ==================== 认证 ====================
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ==================== 工作区 ====================
  /workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      description: 当前用户的全部 active 成员资格。不需要 X-Workspace-Id。
      security:
        - userBearer: []
      responses:
        '200':
          description: 工作区列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
  # ==================== 门户内容（CV-01、AD-02、AD-03） ====================
  /home:
    get:
      tags: [content]
      operationId: home
      description: |
        首页一次取齐 Banner、最近项目、精选作品（P13-01）。

        ⚠️ **一个请求取齐**而不是让前端打三个：首屏三块总是一起出现，
        分成三个请求的话页面会分三次抖动，而其中任意一个慢都会让首屏
        看起来是坏的。

        ⚠️ **任何一块失败都不让整个首页失败**：Banner 取不到就少一块，
        精选取不到就少一块 —— 首页是用户进门的第一眼。失败只在服务端告警。

        ⚠️ `position` 非法时**回落到 `home`** 而不是报错。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: position
          in: query
          schema: { type: string, enum: [home, video] }
      responses:
        '200':
          description: 首页内容
          content:
            application/json:
              schema:
                type: object
                required: [banners, recent, showcase]
                properties:
                  banners:
                    type: array
                    items: { $ref: '#/components/schemas/HomeBanner' }
                  recent:
                    type: array
                    items: { $ref: '#/components/schemas/RecentProject' }
                  showcase:
                    type: array
                    items: { $ref: '#/components/schemas/ShowcaseItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications:
    get:
      tags: [content]
      operationId: listMessages
      description: |
        消息中心：个人通知 + 运营公告，**在 SQL 里合并**后按时间倒序分页。

        ⚠️ 两类消息**两张表，故意不合并**：`notification` 一人一行；
        `announcement` **全站一行**，已读另记在 `announcement_read`。
        公告若也按人扇出，十万用户就是十万行，而绝大多数人从不点开 ——
        那是个**不可逆**的容量问题。

        ⚠️ **合并必须发生在服务端**：两边各取一页再在客户端拼的话，
        **第二页会漏消息** —— 各取 N 条合出来的 N 条与真正按时间序的第 1~N 条
        不是同一批，被挤掉的那些再也不会出现在任何一页上，
        而用户看到的列表"看起来很正常"。

        ⚠️ 游标是 **(cursorAt, cursorId) 两段**：两张表的 id 来自同一个雪花发号器，
        但顺序与时间不严格一致，只按 id 翻页会在跨表处漏或重。

        公告只取 `published` 的 —— 下线一条之后它**立刻**从所有人的列表里消失。
      parameters:
        - { name: cursorAt, in: query, schema: { type: string, format: date-time } }
        - { name: cursorId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 合并后的消息列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursorAt, nextCursorId]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursorAt: { type: string }
                  nextCursorId: { type: string }

  /notifications/unread-count:
    get:
      tags: [content]
      operationId: unreadCount
      description: |
        未读数，供顶栏红点。⚠️ 与列表用**同一套条件**（公告只数 published 的）——
        分开写的话红点显示有未读而点进去什么都没有，**而这种不一致没有任何报错**。
      responses:
        '200':
          description: 未读数
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer }

  /notifications/read:
    post:
      tags: [content]
      operationId: markMessageRead
      description: |
        标记一条消息已读。

        ⚠️ **`source` 必填**：两张表的 id 在同一个空间里**无从区分**。
        只传 id 的话服务端只能两张表都试一遍 —— 而"试到哪个算哪个"一旦出错
        会把别人的公告标成已读，且完全查不出来。

        ⚠️ **重复标已读不是错误**（多个标签页、重试都会发生）：
        报错的话前端得为一个无害的重复操作弹提示。只有"这条消息根本不属于他"
        或"这条公告不是已发布的"才回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, source]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                source: { type: string, enum: [notification, announcement] }
      responses:
        '204': { description: 已标记 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/read-all:
    post:
      tags: [content]
      operationId: markAllMessagesRead
      description: |
        全部已读。⚠️ 公告那半边是"给所有**当前可见**的公告补一行已读"，
        而不是记一个时间戳 —— 用时间戳的话，之后发布的公告会因为
        "发布时间早于我的已读时间"（运营可以改 published_at）被误判成已读。
      responses:
        '200':
          description: 本次标记的条数
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: { type: integer }

  # ==================== 后台：首页运营与公告（AD-02、AD-03） ====================
  # ==================== 任务中心与作品（GAP-05、AD-09） ====================
  /tasks:
    get:
      tags: [content]
      operationId: listTasks
      description: |
        任务中心：生成 / 整图运行 / 成片渲染 / 打包导出**四类任务合并**
        按时间倒序分页（P13-02，GAP-05）。

        ⚠️ **合并必须发生在 SQL 里**（一条 `union all`）。四边各取一页再在
        客户端拼的话，**第二页会漏任务** —— 各取 20 条合出来的 20 条，与真正
        按时间序的第 1~20 条不是同一批，而列表"看起来很正常"。
        （与消息中心同一条规则，这是第二次。）

        ⚠️ **状态词表逐类不同**（generation 的 `queued/running/success/failed`、
        workflow 多一个 `partial_success`、export 用的是 `pending`），
        统一映射**只在服务端做一处**（`content/domain.NormalizeState`）。
        前端再写一份的话，新增一个词时两边分叉 —— 而分叉的表现是
        **某一类任务在筛选下整体消失**，没有任何报错。

        ⚠️ `partial_success` 是**独立状态不能摊平**（AV-24）：说成成功用户
        不会去翻那条失败的，说成失败他会把已经成功的也重跑一遍 ——
        两种都在花他的钱。

        ⚠️ `terminal` 由**服务端**给，不让前端按状态串自己判：新增一个终态时
        前端会漏掉，而漏掉的表现是它一直轮询一个永远不再变的任务
        （开着页面一晚上就是上万次无谓请求）。

        `counts` 与列表用**同一套过滤条件**（除状态本身）—— 分开算的话
        徽标上的数字与点进去看到的不是同一批，而两个数字都"没错"。
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [generation, workflow, render, export] }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/TaskState' }
        - { name: cursorAt, in: query, schema: { type: string, format: date-time } }
        - { name: cursorId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 合并后的任务列表
          content:
            application/json:
              schema:
                type: object
                required: [items, counts, nextCursorAt, nextCursorId]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TaskItem' }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: 按统一状态分组的条数，供筛选器徽标。
                  nextCursorAt: { type: string }
                  nextCursorId: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /creations:
    get:
      tags: [content]
      operationId: listCreations
      description: |
        **我的作品 · 创作资产** = 当前工作区里成功生成的**图片、视频、音频**，按 id 倒序。
        **不收文本**：创作资产展示的是画面与声音，一段文字不是「资产」（文本结果在画布节点上看）。

        ⚠️ 与 `GET /works` **不是一回事**：`/works` 是「提交去审核的作品」（P13-02），
        这里是「我生成过什么」—— 老系统「我的作品」页的语义。移植过来的页面照老语义去调
        `/works`，而用户一件都没提交过，于是那一页永远是空的（P15-02）。

        - `cover` 是**首个产物**（按 idx）；一次出了几项看 `outputCount`（GO-40：不隐式只给第一项）。
          给 `mediaId` 与受保护端点 `url`（`<img>` 不带鉴权头，要 fetch 成 blob 且带 `X-Workspace-Id`；
          列表请带 `?w=320` 取缩略图）。
        - `total` 与列表**同一套**筛选条件（不含游标）；取不到时为 -1（页头少个数字而已，列表照常）。
        - 项目进了回收站或被彻底删掉，产出**仍然列出**（`projectName` 为空串）—— 那是用户花钱得来的。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: resultType
          in: query
          schema: { type: string, enum: [image, video, audio] }
          description: |
            不传 = 全部（图片 + 视频 + 音频，**不含文本**）。非法值（含 `text`）回 400，
            而不是静默当成「全部」。
        - name: projectId
          in: query
          schema: { type: string }
          description: 只要这个项目里的（资产库弹窗「生成历史 · 本项目」）；不传 = 工作区里全部项目
      responses:
        '200':
          description: 作品游标分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /library/items:
    get:
      tags: [content]
      operationId: listLibraryItems
      description: |
        **我的资产**（迁移 00074）：保存过的生成产物（文本 / 图片 / 视频 / 音频），按保存先后倒序。画布左侧「资产」页签与
        创作资产页（`/works` 页面）都只展示这里的。`total` 与列表同一套筛选条件（不含游标），取不到时为 -1。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: folderId, in: query, schema: { type: string }, description: '不传 = 不限；`root` = 只要顶层；其余 = 那个文件夹' }
        - { name: tags, in: query, schema: { type: string }, description: 逗号分隔；要同时带着这些标签（交集） }
        - { name: q, in: query, schema: { type: string }, description: 搜标题、文本内容与提示词 }
        - { name: kind, in: query, schema: { type: string, enum: [text, image, video, audio] } }
        - { name: minRating, in: query, schema: { type: integer, minimum: 0, maximum: 5 } }
        - { name: generationId, in: query, schema: { type: string } }
      responses:
        '200':
          description: 资产游标分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [content]
      operationId: saveLibraryItem
      description: |
        「保存到我的资产」：保存一次生成的某一项产物。**幂等**：同一项产物已经存着就原样返回那一项（200），新建回 201。
        类型、媒体、项目、节点由服务端按生成取，不信客户端；文本另存 `text`（卡片上此刻显示的内容，可能是用户改过的），为空时取原文。
        生成必须属于本工作区且已成功，否则 400。要编辑权限。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveLibraryItemRequest' }
      responses:
        '200':
          description: 已经存着（原样返回）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '201':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /library/items/batch:
    post:
      tags: [content]
      operationId: batchLibraryItems
      description: 「管理」里的批量操作：`move`（挪到文件夹，`folderId` 为空 = 顶层）/ `remove`（移出资产，软删；生成结果本身不动）。一次最多 200 项。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [move, remove] }
                ids: { type: array, items: { type: string } }
                folderId: { type: string }
      responses:
        '200':
          description: 实际处理的条数
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /library/items/{itemId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      tags: [content]
      operationId: getLibraryItem
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 一项资产
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [content]
      operationId: updateLibraryItem
      description: 改名 / 挪文件夹 / 改标签；没传的键不改。`folderId` 传 null 或空串 = 挪到顶层。不认识的标签会顺手建成自定义标签。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                folderId: { type: [string, 'null'] }
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: 改后的资产
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /library/folders:
    get:
      tags: [content]
      operationId: listLibraryFolders
      description: 资产文件夹（单层），按名称排序，带未移出的资产数。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 文件夹
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LibraryFolder' } }
    post:
      tags: [content]
      operationId: createLibraryFolder
      description: 新建文件夹。同一工作区内不重名（不分大小写），重名回 409（40904）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryFolderName' }
      responses:
        '201':
          description: 新文件夹
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFolder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /library/folders/{folderId}:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [content]
      operationId: renameLibraryFolder
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryFolderName' }
      responses:
        '204': { description: 已改名 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [content]
      operationId: deleteLibraryFolder
      description: 删文件夹：里面的资产退回顶层，资产不跟着删。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204': { description: 已删除 }
        '404': { $ref: '#/components/responses/NotFound' }
  /library/tags:
    get:
      tags: [content]
      operationId: listLibraryTags
      description: 资产标签：预置的（角色 / 场景 / 物品 / 风格 / 音效）与本工作区「新建标签」建出来的。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 标签
          content:
            application/json:
              schema:
                type: object
                required: [preset, custom]
                properties:
                  preset: { type: array, items: { type: string } }
                  custom: { type: array, items: { type: string } }
    post:
      tags: [content]
      operationId: createLibraryTag
      description: 新建标签（幂等；和预置重名时什么都不做）。最多 20 个字。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryFolderName' }
      responses:
        '201':
          description: 标签名
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /library/tags/{name}:
    delete:
      tags: [content]
      operationId: deleteLibraryTag
      description: 删自定义标签，并从资产上摘掉它（预置标签删不掉，400）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /library/marks:
    get:
      tags: [content]
      operationId: listGenerationMarks
      description: 一批生成结果的评级与已保存的产物（画布右键菜单显示用），最多 100 个。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - { name: generationIds, in: query, required: true, schema: { type: string }, description: 逗号分隔 }
      responses:
        '200':
          description: 评级与保存情况
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GenerationMark' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /library/ratings/{generationId}:
    put:
      tags: [content]
      operationId: rateGeneration
      description: 给生成结果打分（1~5，0 = 清除），整个工作区共用一个评分。生成必须属于本工作区且已成功。要编辑权限。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - { name: generationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 0, maximum: 5 }
      responses:
        '200':
          description: 当前评级
          content:
            application/json:
              schema:
                type: object
                required: [generationId, rating]
                properties:
                  generationId: { type: string }
                  rating: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /works:
    get:
      tags: [content]
      operationId: listMyWorks
      description: |
        我的作品（当前工作区提交过的全部作品，含待审与被驳回的）。

        ⚠️ **不下发 `mediaObjectId`**：与公开墙一致。作者看图走
        `/works/{workId}/media`，那条路按 workspace 卡归属。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 作品列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Work' }
                  nextCursor: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [content]
      operationId: submitWork
      description: |
        把一次成功的生成或成片提交成作品（进入审核队列）。

        ⚠️ 用户端已不提供提交入口：成功的图片/视频/音频生成（不含文本）与成片由
        Worker **自动登记**为待审作品，管理端「作品审核」直接审。本端点保留以兼容
        既有调用方，语义不变（幂等、不重置审核状态）。

        ⚠️ 需要 **export** 权限：把自己的产出发到公开墙候选里是"把内容取出去"
        那一档，不是日常编辑 —— 只读成员不该能替团队投稿。

        ⚠️ 来源**必须由对应的领域校验**（归属 + 已成功 + 有产物），内容域
        自己查不了（它不知道 generation 那张表什么算成功、产出在哪一项）。
        少了这一步，任何人都能拿一个别人的 `generationId` 提交成自己的作品，
        而作品墙上会出现他没做过的东西。

        ⚠️ **一律落 `pending`**：自动通过等于没有审核。"什么算违规"是一条
        需要人定义的策略（**PARAM-09**，未定稿）—— 在它定稿之前，
        唯一诚实的默认值是"都要人看一眼"。

        ⚠️ **幂等**：同一来源重复提交回的是**已有的那一件**（`uk_work_source`），
        且**不重置审核状态** —— 否则重新提交一次就能把"已驳回"洗回"待审"，
        绕过审核。

        ⚠️ 201 里的 `reviewStatus` 是 `pending`。前端必须照着它说
        "已提交，等待审核"而**不是"已发布"** —— 公开还要 `featured ∧ ¬offline`
        两个条件，而加精是运营的另一次决定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, sourceId]
              properties:
                sourceType: { type: string, enum: [generation, render] }
                sourceId: { $ref: '#/components/schemas/Id' }
                title:
                  type: string
                  description: 留空则用来源任务的标题。
      responses:
        '201':
          description: 已提交（或幂等回已有那一件）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Work' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /works/{workId}/media:
    get:
      tags: [content]
      operationId: myWorkMedia
      description: |
        取**自己工作区**那件作品的图（不要求已公开）。

        ⚠️ 与 `/showcase/{workId}/media` **是两条路，不能合并**：作者要看到
        自己刚提交、还没过审的那一件，公开墙上的人不能。合成一个再加个
        布尔参数的话，总有一天会有人在公开路径上把它传成 true ——
        而那一下是把整个审核前的队列开放给了所有人。
      parameters:
        - name: workId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: w
          in: query
          schema: { type: integer, enum: [160, 320, 640] }
      responses:
        '200':
          description: 图片字节
          content:
            image/*: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 后台：身份、RBAC 与认证配置（AD-05、AD-16、AD-17） ====================
  /admin/auth/login:
    post:
      tags: [admin-identity]
      operationId: adminLogin
      security: []
      description: |
        后台登录，返回一对 token（access 15 分钟、refresh 30 天）。⚠️ 与用户 token **类型隔离**：
        这一对只能调 `/admin/*`。账号不存在时也走一次 bcrypt，避免时序侧信道暴露管理员用户名。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/auth/refresh:
    post:
      tags: [admin-identity]
      operationId: adminRefreshToken
      security: []
      description: |
        后台续期：用 refresh 换一对新的，**旧 refresh 作废**（轮换，30 秒宽限期与用户端 `/auth/refresh` 同一套）。
        校验与用户端同一套：会话没被撤销 · 账号还启用 · token_version 没变（停用、改密都会让它变）。

        ⚠️ 此前后台**没有这个接口**：登录时发了 refresh 也没处用，access 的 15 分钟一到，
        下一次操作就被踢回登录页，不管中间有没有在用。

        ⚠️ 调用方必须**保存返回的新 refresh**：轮换之后旧的那张过了宽限期再用就是 40103。
        几个请求同时遇到 401 时只续一次，其余等它的结果 —— 别让宽限期去兜一屏请求各续各的。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 续期成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/auth/logout:
    post:
      tags: [admin-identity]
      operationId: adminLogout
      description: |
        后台退出：撤销**当前这一对**的服务端会话（access 里的 `sid` 指向同一对的 refresh；
        已被轮换的话沿轮换链撤销到当前那一个，与用户端 `/auth/logout` 同一套）。
        ⚠️ 只清前端存储不调它的话，refresh 在服务端还能续期 30 天。
      responses:
        '204': { description: 已撤销 }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/auth/me:
    get:
      tags: [admin-identity]
      operationId: adminMe
      description: |
        当前管理员与**他实际拥有的权限码**（P13-05 把它补进契约）。

        ⚠️ 管理端的路由守卫、菜单显隐、按钮禁用**全部由这一份权限码生成** ——
        所以它是整个管理端的承重接口。

        ⚠️ 权限**从这里取，不从 token 里解**：解 token 的话，一个刚被收回
        权限的管理员在 token 过期之前仍然拿着旧权限 —— 而他看到的入口点
        下去会 403，界面与后端说两套话。

        ⚠️ **不回 `isSuperAdmin` 之类的标志**：超管是靠 `role_permission` 里
        **真实的关联行**拿到全部权限的（seed 里写死），不是靠一个布尔。
        回一个布尔的话，前端迟早会拿它去特判 —— 而那时收回某个权限对超管
        就不生效了。
      responses:
        '200':
          description: 当前管理员
          content:
            application/json:
              schema:
                type: object
                required: [id, username, status, permissions]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  username: { type: string }
                  status: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
                    description: 权限码，与后端 seed 的 `permission.code` 逐字一致。
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/users:
    get:
      tags: [admin-identity]
      operationId: adminSearchUsers
      description: |
        用户检索（`user:read`）。

        ⚠️ 手机号与邮箱**脱敏返回**：后台要的是"认出是哪个人"，
        不是拿到完整联系方式 —— 后者一旦被导出就是一次个人信息泄漏。
      parameters:
        - { name: keyword, in: query, description: 手机号 / 邮箱 / 昵称 / ID。, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
                  nextCursor: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userID}:
    get:
      tags: [admin-identity]
      operationId: adminGetUser
      parameters:
        - { name: userID, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{userID}/ban:
    post:
      tags: [admin-identity]
      operationId: adminBanUser
      description: |
        封禁用户（`user:write`）。

        ⚠️ 只读管理员调这里必须 **403**（P02-02 的负向验收）——
        前端把按钮藏起来只是体验，这一道才是约束。
      parameters:
        - { name: userID, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: 已封禁 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/admins:
    get:
      tags: [admin-identity]
      operationId: adminListAdmins
      responses:
        '200':
          description: 管理员列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-identity]
      operationId: adminCreateAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                roles: { type: array, items: { type: string } }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/admins/{adminID}/status:
    put:
      tags: [admin-identity]
      operationId: adminSetAdminStatus
      description: |
        停用/启用管理员。

        ⚠️ 停用之后**已签发的 token 也要失效** —— 靠会话版本做撤销，
        不是等 token 自然过期。不这么做的话，一个刚被停用的管理员在
        token 到期之前仍然能操作，而后台看不出任何异常。
      parameters:
        - { name: adminID, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '204': { description: 已更新 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/admins/{adminID}/roles:
    put:
      tags: [admin-identity]
      operationId: adminSetAdminRoles
      parameters:
        - { name: adminID, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, items: { type: string } }
      responses:
        '204': { description: 已更新 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/roles:
    get:
      tags: [admin-identity]
      operationId: adminListRoles
      responses:
        '200':
          description: 角色与它们的权限
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminRole' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/roles/{roleCode}/permissions:
    put:
      tags: [admin-identity]
      operationId: adminSetRolePermissions
      description: |
        改一个角色的权限集。

        ⚠️ **超管也受这条影响**：它是靠 `role_permission` 里真实的关联行
        拿到全部权限的，不是靠代码里的通配 —— 所以收回一个权限对超管同样
        生效。特判超管的话，被收回的那个权限在界面上仍然可见，而点下去 403。
      parameters:
        - { name: roleCode, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: { type: array, items: { type: string } }
      responses:
        '204': { description: 已更新 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/permissions:
    get:
      tags: [admin-identity]
      operationId: adminListPermissions
      description: |
        全部权限码。

        ⚠️ 管理端会拿它与自己那份清单**当场比一遍**并把差异显示出来：
        不一致的表现是"代码里明明有这个权限，管理员就是 403"，
        看着像鉴权代码写错 —— 而真相是加权限位时漏改了某一处
        （seed 的清单 / `verify-schema.sh` 的两条 check / 管理端的清单）。
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, name, module]
                  properties:
                    code: { type: string }
                    name: { type: string }
                    module: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/auth-settings:
    get:
      tags: [admin-identity]
      operationId: adminGetAuthSetting
      description: |
        认证配置（AD-17）。

        ⚠️ **连掩码都不回**，只回三个布尔说明"配没配"。回掩码的话，
        回显值会被当成新密钥存回去 —— 症状是"**什么都没改却开始验签失败**"。
      responses:
        '200':
          description: 认证配置
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin-identity]
      operationId: adminUpdateAuthSetting
      description: |
        改认证配置。密钥是**三态**：`keep` / `replace` / `clear`。

        ⚠️ 未知 action **按保留处理**：按清除处理的话，一次前端版本不匹配
        就会把线上的短信密钥清空，而界面上看起来保存成功了。
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== 后台：请求日志、审计与统计（AD-07、GAP-24） ====================
  /admin/request-logs/api:
    get:
      tags: [observability]
      operationId: adminListAPILogs
      description: |
        API 请求日志（P13-04）。

        ⚠️ `api_request_log` 这张表在 P01-03 就建好了，**到 P13-04 为止没有
        任何读写方** —— 与 `resource_share`（P12-01）、死信队列（P13-03）
        是同一类："建了没人用"。

        ⚠️ 权限位是 **`system:log`**（seed 里早就单开的位），**不随
        `system:read` 放开**：日志含脱敏后的请求体 —— 即便脱敏过，
        提示词、项目名、文件名这些仍然是用户的内容。

        ⚠️ **只记请求体，不记响应体**：产出图和音视频直接吐字节，缓存响应
        等于在内存里再复制一份 —— 一次几百 MB 的成片下载就能把 API 打爆。
        要看响应内容去看 Provider 日志（那一侧体积可控且必须留）。

        ⚠️ **探活与 WebSocket 不记**：前者按秒级被拉、一天几万条，真正要查的
        那几条会淹没在里面；后者的理由不同 —— **握手之后的帧根本不过
        middleware**，只记一条握手日志会让人以为"这个连接只发了一次请求"。

        ⚠️ `bizCode` 单列的意义是**分类**：本项目里 HTTP 状态码与业务码始终
        一致（CD-01），看 status 就知道成没成；但 40001「参数非法」、
        40002「缺幂等键」在 HTTP 上都只是一个 400，而日志要回答的恰恰是
        "今天这批 400 里哪一类最多"。

        ⚠️ `ip` 来自 `X-Forwarded-For`（取**第一个**，后面的是代理链），
        它是**客户端可伪造**的 —— 只用于排障参考，**不能拿来做授权判断**。
      parameters:
        - { name: traceId, in: query, description: 用户报障时给的就是它，排障第一入口。, schema: { type: string } }
        - { name: method, in: query, schema: { type: string } }
        - { name: path, in: query, description: 路径前缀匹配。⚠️ `%` `_` 按字面量处理。, schema: { type: string } }
        - { name: failed, in: query, description: 只看 4xx/5xx。, schema: { type: boolean } }
        - name: keyword
          in: query
          description: 一个框查三样：userId / adminId / workspaceId，精确匹配；非数字当成没填。
          schema: { type: string }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 左闭右开。, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: API 请求日志
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/APIRequestLog' }
                  nextCursor: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/request-logs/provider:
    get:
      tags: [observability]
      operationId: adminListProviderLogs
      description: |
        Provider 请求日志（AD-07）。

        起因（老系统的真实经历）：排查一次 502 只能去库里解密 API key、
        手动 curl 上游复现，才发现问题是"图片以 URL 形态发出去、上游拉不动"。
        有了这张日志这类问题一眼可见 —— 但**日志本身绝不能成为新的泄漏面**，
        所以请求/响应体都经过按字段脱敏 + base64 摘要 + 截断。

        ⚠️ 写入方在 Provider 域（表归它），这里**通过端口读**而不是直接查
        对方的表 —— 一旦它改了列，编译不会报错而日志页会在运行时整页打不开。

        ⚠️ `errorType` 才是"这次调用成没成"的依据，**不能只看 httpStatus**：
        上游的业务错误常藏在 HTTP 200 里（可灵在 `code`、方舟在
        `error.message`），而超时/断连根本没有状态码。
      parameters:
        - { name: traceId, in: query, schema: { type: string } }
        - { name: generationId, in: query, description: 「这次生成到底发了什么给上游」。, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: failed, in: query, description: 按 errorType 筛，不是按状态码。, schema: { type: boolean } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Provider 请求日志
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderRequestLog' }
                  nextCursor: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-logs:
    get:
      tags: [observability]
      operationId: adminListAuditLogs
      description: |
        业务审计（P02-04 落地，P13-04 补上**时间范围与游标分页**并补进契约）。

        ⚠️ 没有时间范围的话，「上个月谁动过这个订单」只能靠一直翻页去找 ——
        而审计最常见的问题恰恰带着一个时间点（"上周三出的事"）。

        ⚠️ 用**游标不用 offset**：审计一直在新增，offset 翻页会漏掉或重复
        （CD-56 同一条）—— 而漏掉的那一条恰恰可能是要找的。
        排序键换成 **id 倒序**而不是 `created_at`：游标分页要求排序键唯一，
        而同一毫秒内写进来的几条审计（一次事务里连着写的）时间戳可能相同。

        ⚠️ 审计内容**绝不含密钥**（写入方保证：支付渠道配置只记三个布尔）。
      parameters:
        - { name: objectType, in: query, schema: { type: string } }
        - { name: objectId, in: query, schema: { type: string } }
        - { name: actorType, in: query, schema: { type: string, enum: [user, admin, system] } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 审计记录
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditRecord' }
                  nextCursor: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats/overview:
    get:
      tags: [observability]
      operationId: adminStatsOverview
      description: |
        经营看板汇总（GAP-24）。

        ⚠️ GAP-24 的原话是「**不把旧 SQL 名称直接当业务定义**」。每个指标的
        口径写在 `internal/observability/repo/stats.go` 的注释里，
        `docs/design/统计口径.md` 是它的副本而**不是第二个定义**。
        几条最容易搞错的：

        - **`activeUsers` 不是"登录过的人"**。旧系统按 `last_login_at` 算，
          于是一个把页面挂在后台的浏览器每天都算一个活跃用户，而这个数只会涨。
          这里算的是「当天**产生过消费或产出**的人」。
        - **积分只认账本**，不按各业务表的 `credits_cost` 相加 —— 那一列是
          **报价**，任务失败退款之后它不会变，于是一个失败又退款的任务会被
          算成花了钱（CD-60 同一条）。
        - **`creditsConsumed` 与 `creditsRefunded` 分开给，不合并成净值**
          （本项目第五次）：把退回的悄悄减掉之后，看的人拿这个数去对账本
          流水会对不上，而他无从知道差额是怎么来的。
        - **`generationCancelled` 单列不并进失败**：取消是用户行为不是故障。
          并进去的话用户多取消几次会让成功率看起来在下降，而系统一切正常。
        - **`revenueCents` 只算已支付的**，按 `paid_at` 分组（一张昨天下单、
          今天付款的单，收入属于今天）；退款额**单列不从收入里减掉**。
        - ⚠️ **`providerCalls` 是调用次数不是成本**。真实成本要各 Provider 的
          单价，而那是 **PARAM-04 未定稿**的内容 —— 编一个数出来比没有更糟：
          它会被当成真的，而没有人知道它是编的。前端标题必须照这个名字写。

        ⚠️ **实时算，不预聚合**：`stat_daily` 那张表暂时空着（见 P13-04 挂账）。
        预聚合要回答"今天算到几点了"，而那正是最容易让人看错数的地方。
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 看板汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats/series:
    get:
      tags: [observability]
      operationId: adminStatsSeries
      description: |
        单个指标的按天序列。

        ⚠️ **补零**：没有数据的那天也会出现且值为 0。不补的话折线会把两个
        相隔一周的点直接连起来，看上去像"平稳增长" —— 而中间那一周其实一条
        记录都没有（服务挂了也长这样）。

        ⚠️ 未知指标回**空序列而不是报错**（前端可能比后端新）。
        指标名是**白名单映射**出来的，不是拼进 SQL 的字符串。

        ⚠️ **折线各天之和必须等于概览上的总数** —— 两处口径不一致的表现是
        看板上两个数字对不上，而看的人只会觉得"这个看板不准"、说不出哪里不准。
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [active_users, credits_consumed, credits_refunded, generations,
                   generation_success, generation_failed, generation_cancelled,
                   renders, render_success, revenue_cents, refunded_cents,
                   provider_calls, provider_errors]
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 按天序列
          content:
            application/json:
              schema:
                type: object
                required: [metric, from, to, points]
                properties:
                  metric: { type: string }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  points:
                    type: array
                    items:
                      type: object
                      required: [date, value]
                      properties:
                        date: { type: string, description: 'YYYY-MM-DD' }
                        value: { type: integer, format: int64 }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== 后台：任务运营台与运维（GAP-07、AD-08） ====================
  # ==================== 后台：内容审核（AD-09） ====================
  # ==================== 工作区用量审计（NEW-20） ====================
  # ==================== 在线状态（NEW-19） ====================
  # ==================== 资源共享（NEW-17/NEW-18） ====================
  # ==================== 项目 ====================
  /projects:
    get:
      tags: [project]
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: folderId
          in: query
          schema: { type: string }
          description: |
            不传 = 全部项目；**`none` = 只看未分类**（不在任何文件夹里的）；数字 = 该文件夹。
            ⚠️ 「未分类」是 **`none`**，不是老系统的 `unfiled` —— 传错会得到
            **400「folderId 非法」**，而移植过来的全部项目页正是因为吞掉了这个 400，
            才一直显示「没有项目」（P15-02）。
            ⚠️ 空串也表示「不筛」：用空串表达「未分类」会与「不筛选」混淆。
        - name: keyword
          in: query
          schema: { type: string }
          description: 按项目名模糊匹配。搜索时前端**不要**再带 `folderId=none` —— 用户找的是项目，要跨文件夹找得到。
        - name: kind
          in: query
          schema:
            type: string
            enum: [all, canvas, agent, marketing]
            default: all
          description: |
            项目类型筛选（AGT-45）。`agent` = 有任何 Agent 会话（含已取消的）的项目；
            `canvas` = 一个会话都没有的；缺省 / `all` = 全部。**服务端查询时计算**，不是项目上的标记。
            `marketing` = `origin` 落列为 `marketing` 的项目（MKD-3，**按建项目时落的列**判定，
            与 `agent` 的现算并存）：营销项目建时必带会话，所以它同时出现在 `agent` 下、不出现在 `canvas` 下。
            筛选与游标分页在同一条查询里完成，翻页不漏不重。非法值 **400**。
      responses:
        '200':
          description: 项目游标分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [project]
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                folderId: { type: [string, 'null'] }
                templateCode: { type: [string, 'null'] }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: getProject
      responses:
        '200':
          description: 项目详情（含 canvasData 与 version）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [project]
      operationId: updateProject
      description: |
        改名、换封面、移动文件夹。**不改 canvasData** —— 画布保存走 `PUT /projects/{id}/canvas`
        的乐观锁路径，混进来会让「改个名字」意外触发版本冲突。
        字段语义是**三态**：不传 = 不改；传 null = 清空（移出文件夹 / 去掉封面）；传值 = 替换。
        ⚠️ `origin`（项目来源）**建后不可改**：请求体里出现该键（含 null）一律 400/40001（MKD-3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                folderId: { type: [string, 'null'] }
                coverMediaId: { type: [string, 'null'] }
                origin:
                  description: |
                    **只为拒绝而声明**：项目来源建后不可改，出现该键（任何值，含 null）即 400/40001
                    「origin 建后不可修改」。显式声明是因为未知键会被静默忽略 —— 那样请求 200 而什么都没改。
      responses:
        '200':
          description: 更新后的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [project]
      operationId: deleteProject
      description: 软删除，进回收站。保留期从 `deletedAt` 起算。
      responses:
        '204': { description: 已移入回收站 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/canvas:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [project]
      operationId: saveCanvas
      description: |
        乐观锁保存。服务端仅在 `version` 与库中一致时更新，否则返回 409/40902 并带上当前版本，
        客户端必须保留本地草稿并让用户选择重载或放弃，**不得静默覆盖**（AC-03、FLOW-09、FE-03）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canvasData, version]
              properties:
                canvasData:
                  description: |
                    原样透传保存；未知字段必须保留（GO-35）。
                    服务端做**结构校验但不改写**：节点 id 唯一、边不得悬空、
                    同一目标的入边 order 不得重复。校验通过后存的是**原始字节**，
                    而不是「解析再序列化」的结果 —— 后者会把后端没定义的字段吃掉。
                  type: object
                  additionalProperties: true
                version:
                  type: integer
                  minimum: 1
                  description: |
                    客户端手上的服务端版本号。⚠️ 与 `canvasData.schemaVersion` 是两件事，
                    不可混用（GO-36）：前者是乐观锁，后者是 JSON 结构版本。
      responses:
        '200':
          description: 保存成功，返回新版本
          content:
            application/json:
              schema:
                type: object
                required: [version, updatedAt]
                properties:
                  version: { type: integer }
                  updatedAt: { type: string, format: date-time }
        '409':
          description: 版本冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }

  /projects/{projectId}/canvas/state:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: getCanvasState
      description: |
        只回"服务端现在是第几版、谁改的"，**不回画布内容**（P12-02、NEW-19）。

        用途是**离线重连对账**：网络恢复后直接重发的话，离线期间同事改过时
        用户收到的是一个 409 —— 而他刚看到「网络已恢复」，会以为是重连本身
        出了问题。先问一句就能分出「我的版本还有效，补发即可」与
        「服务端已变，直接进冲突态」。

        ⚠️ 不带画布内容是有意的：画布 JSON 有几百 KB 到几 MB，
        顺手带上的话一次网络抖动就要把整张图重新下载一遍。
      responses:
        '200':
          description: 当前版本与最后编辑者
          content:
            application/json:
              schema:
                type: object
                required: [version, updatedAt, lastEditorId, bySelf]
                properties:
                  version: { type: integer }
                  updatedAt: { type: string, format: date-time }
                  lastEditorId:
                    type: string
                    description: 空串表示未知（P12-02 之前保存的历史项目）。
                  lastEditorName: { type: string }
                  bySelf:
                    type: boolean
                    description: 最后一次写入是不是当前用户亲手保存的；Agent / MCP 的写入一律为 false（看 editorKind）。
                  editorKind:
                    type: string
                    enum: [user, agent, mcp]
                    description: |
                      最后一次写入来自真人整份保存（user）、Agent 的画布操作（agent，AGT-10）
                      还是外部 AI 客户端经 MCP 授权的画布操作（mcp，MCPT-09）。
                      agent 时 lastEditorId 是会话发起人（「Agent（代 张三）」）；mcp 时是授权所属的用户本人。
                  agentSessionId:
                    type: string
                    description: editorKind=agent 时的会话 ID；否则为空串。
                  mcpGrantId:
                    type: string
                    description: editorKind=mcp 时的 MCP 授权 ID；否则为空串。
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/canvas/ops:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: listCanvasOps
      description: |
        补取 `sinceVersion` 之后由服务端（Agent）应用的画布操作批次（AGT-10，决策 D-2）。
        打开着的画布按批次**依序重放**（不重载、不闪）；自己保存撞 40902 且中间改动全部来自
        Agent 时，补取 → 重放 → 自动重存。

        `needsReload=true`（此时 `batches` 为空）表示 `(sinceVersion, currentVersion]` 没法被批次
        首尾相接地铺满：中间有**真人**整份保存、批次已过保留期（30 天，设计建议值）被清理、
        落后超过 200 批、或客户端版本比服务端还新 —— 前端应整页重载（`GET /projects/{id}`）。

        ⚠️ 只读、不回画布内容；没有对用户端开放的「应用操作」写接口（写入方只有 Agent）。
      parameters:
        - name: sinceVersion
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
          description: 客户端手上的画布版本（`version`，不是 `schemaVersion`）。
      responses:
        '200':
          description: 批次（按版本升序）或需要整页重载
          content:
            application/json:
              schema:
                type: object
                required: [currentVersion, needsReload, batches]
                properties:
                  currentVersion: { type: integer }
                  needsReload: { type: boolean }
                  batches:
                    type: array
                    items: { $ref: '#/components/schemas/CanvasOpBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/template:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [project]
      operationId: applyProjectTemplate
      description: |
        给**空画布**套用模板（空画布上的四张快捷生成卡片：故事脚本 / 角色三视图 /
        首帧图生视频 / 音频生视频）。老系统同一语义，P15-02 补回。

        - **只允许空画布**（一个节点、一条连线都没有）：往画了东西的画布上套模板，要么覆盖
          用户的节点（不可逆），要么两份叠在一起。不空时回 **40905**。
        - **带 `version`**，与保存画布同一条乐观锁：「检查为空」与「写入」之间被别人改过，
          回 **40902** 而不是把同事刚画的节点静默盖掉。
        - 模板内容只有一份（`project_template`，新建项目时选模板用的也是它）；停用的模板回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateCode, version]
              properties:
                templateCode: { type: string, description: '如 story_script / role_three_view / first_frame_video / audio_video' }
                version: { type: integer, minimum: 1, description: 当前画布版本（服务端乐观锁） }
      responses:
        '200':
          description: 套用后的项目（**含 canvasData**，前端直接用它替换本地画布与版本号）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [project]
      operationId: duplicateProject
      description: |
        复制画布与封面，**不复制 generation 与账本**（CV-03）。
        副本里的节点产物快照会被**解绑**：`result.id`（原项目的 generationId）移到
        `result.sourceGenerationId`，因为输入解析要求同项目，跨项目的 generationId
        能预览却不能作新任务输入 —— 留着它等于埋一个「点了才失败」的坑（GAP-16）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: 副本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/package:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [project]
      operationId: exportProjectPackage
      description: |
        把项目打成 `<项目名>.tabtv.zip`（TT-T-33，dev/02 §6）：manifest、project.json（画布原文）、
        项目从属表（脚本、镜头、资产、组、时间线、导演台、生成记录与产物、上传参考、项目文档）与引用的媒体字节。
        **不含**厂商配置、Key、上游原文、Agent 会话与调用日志。文件取不到的媒体记进 manifest 的 warnings。
        建议文件名在 `Content-Disposition` 与 `X-Filename`（URL 编码）里。
      responses:
        '200':
          description: 项目包
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/import:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [project]
      operationId: importProjectPackage
      description: |
        从项目包导入为一个**新项目**（TT-T-33）：全部重新发号、引用按清单映射、未知字段保留，不覆盖任何已有数据；
        重名时追加「（导入）」。包有问题（zip slip、未知大版本、缺清单、不是 zip）回 400 并给出原因，失败时库里与存储里都不留东西。
        引用的模型本机没有配置时不报错，记进 warnings。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [project]
      operationId: restoreProject
      description: 从回收站恢复。原文件夹若已被删除则落回「未分类」。
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/purge:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    delete:
      tags: [project]
      operationId: purgeProject
      description: |
        彻底删除。只删项目自身与画布数据；**账本流水与已发布作品不随之消失**（GAP-17），
        产物媒体改为解除引用，由媒体清理队列按「无引用 + 超保留期」处理（P04-04）。
        项目上还有进行中任务时返回 `40906`，不静默删除。
      responses:
        '204': { description: 已彻底删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: listProjectDocuments
      description: |
        项目文档列表（AGT-09）。**不带正文**：一份可达 256 KiB，列表只为显示名字。
        回收站里的项目也能读（看一眼不会造成任何后果），写入则要求项目未删除。
      responses:
        '200':
          description: 文档摘要
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectDocumentSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [project]
      operationId: createProjectDocument
      description: |
        新建文档。画布上的「文档」节点先建文档、再把 `docId` 写进节点 params ——
        **正文不进 canvasData**（重数据只存引用）。

        路径白名单：`/plan.md`、`/shots.md`、`/.memory.md`、`/notes/<名字>.md`（只一层）；
        `..` 与空段直接拒绝。同项目同路径已有有效文档时返回 409/40904。
        回收站中的项目返回 409/40905。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, minLength: 1, maxLength: 200 }
                content:
                  type: string
                  description: 正文 Markdown，上限 256 KiB（按字节，设计建议值）。
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /projects/{projectId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: documentId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    get:
      tags: [project]
      operationId: getProjectDocument
      description: 取一份文档（含正文）。文档不属于该项目（含跨工作区）一律 404。
      responses:
        '200':
          description: 文档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDocument' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [project]
      operationId: updateProjectDocument
      description: |
        乐观锁保存正文。`version` 与库中不一致时返回 409/40902，`details` 带上当前版本与
        最后编辑者（`bySelf` 分出「我的另一个窗口」与同事/Agent）；客户端必须保住本地内容
        并让用户选择「载入最新」或「以我为准」，**不得静默覆盖**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, version]
              properties:
                content:
                  type: string
                  description: 整份正文。清空请传空串（不传是参数错误，而不是清空）。
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 保存后的文档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突（40902）或项目在回收站（40905）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /projects/{projectId}/director-scenes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: listDirectorScenes
      description: |
        项目里 3D 导演台场景的摘要（docs/agent/director，DR-I-01）。**不带正文**：一个场景可达 512 KiB，
        摘要只供节点卡判断截图是否过期（比 `renderFingerprint`）与重连后对账（比 `version`）。
        回收站里的项目也能读。
      responses:
        '200':
          description: 场景摘要，按建立时间排序
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DirectorSceneSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [project]
      operationId: createDirectorScene
      description: |
        为画布上的导演台节点建场景。前端先建场景、再把 `sceneId` 写进节点 params（同文档节点）——
        **正文不进 canvasData**（DRK-9）。

        按（项目，画布节点）幂等（DRD-17）：该节点已有场景时回 **200** 与已有那份，新建回 **201**；
        两种都要把 `id` 写回节点。带 `sourceSceneId` 时复制那份场景（粘贴、复制出来的节点）：
        源场景必须在**同一工作区**、所在项目可读（回收站里的也算），否则 404。
        回收站中的项目返回 409/40905。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canvasNodeId]
              properties:
                canvasNodeId: { type: string, minLength: 1, maxLength: 64 }
                sourceSceneId:
                  type: string
                  pattern: '^[0-9]+$'
                  description: 复制来源。不传则用默认场景（一台 35mm 机位、主光与补光、地面，DR-F-12）。
      responses:
        '200':
          description: 该节点已有场景，返回已有那份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorScene' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorScene' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/director-scenes/{sceneId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: sceneId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    get:
      tags: [project]
      operationId: getDirectorScene
      description: |
        取一个场景：正文与全部媒体记录（截图 / 控制图 / 预演 / 泼溅，按时间倒序，含已隐藏的）。
        场景不属于该项目（含跨工作区）一律 404。回收站里的项目也能读。
      responses:
        '200':
          description: 场景
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorScene' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [project]
      operationId: updateDirectorScene
      description: |
        乐观锁保存正文。`version` 与库中不一致时返回 409/40902，`details` 带上当前版本与最后编辑者：
        `bySelf` 分出「我的另一个窗口」与同事，`editorKind` / `currentSource` 说明是不是 Agent / MCP 写的。
        客户端必须保住本地内容并让用户选择「载入最新」或「以我为准」，**不得静默覆盖**。

        保存时服务端：
        - 校验形状与上限，失败 400/40001，`details.path` 指到字段（如 `objects[3].camera.aspect`）；
          正文超过 512 KiB 返回 413/41301。未知字段原样保存（GO-35）；
        - 校验正文引用的媒体属于本工作区：全景必须是图片、泼溅必须是导演台素材（DRD-16），否则 40001；
        - 重算渲染指纹（DRD-13），成功后向 `project:{id}` 推 `director.scene_updated`。

        响应只回摘要（新的 `version` 与 `renderFingerprint`）：正文就是请求里那份，自动保存每次再回传一遍没有用处。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scene, version]
              properties:
                scene: { $ref: '#/components/schemas/DirectorSceneBody' }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 保存后的摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorSceneSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突（40902）或项目在回收站（40905）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /projects/{projectId}/director-scenes/{sceneId}/captures:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: sceneId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    post:
      tags: [project]
      operationId: uploadDirectorCapture
      description: |
        上传一张机位截图或控制图（深度图 / 骨架图）。按文件头识别，只收图片（上限沿用图片 10 MiB）；
        purpose 记为 `director_capture`，**不进「我的素材」**（DRK-11）。

        ⚠️ **先核版本再上传**（DRD-14）：`sceneVersion` 与场景当前版本不一致时回 409/40902，文件不会上传 ——
        截图对应的不是当前画面，盖上新版本号的话过期判定从此对不上。记录上的指纹取核版本时的那一份。
        `cameraId` 必须是场景里的机位（40001）。回收站中的项目返回 409/40905。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind, cameraId, sceneVersion]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [capture, depth, pose] }
                cameraId: { type: string, maxLength: 64 }
                sceneVersion: { type: integer, minimum: 1 }
                camera:
                  type: string
                  description: 机位快照（JSON 对象的字符串，≤ 16 KiB），含深度图的 near / far 等服务端没有的值。
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorMediaRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 场景版本不一致（40902，文件未上传）或项目在回收站（40905）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /projects/{projectId}/director-scenes/{sceneId}/previews:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: sceneId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    post:
      tags: [project]
      operationId: uploadDirectorPreview
      description: |
        上传白模预演视频（作为下游视频模型的参考视频）。与截图一样**先核版本再上传**；只收视频，
        上限取配置（默认 50 MiB，DR-PARAM-10）。purpose 记为 `director_preview`，不进「我的素材」。
        时长以上传时探测到的为准，与声明的 `durationMs` 相差超过 1 帧（1000/fps 毫秒）时回 40001 并删掉文件。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, cameraId, sceneVersion, durationMs, fps]
              properties:
                file: { type: string, format: binary }
                cameraId: { type: string, maxLength: 64 }
                sceneVersion: { type: integer, minimum: 1 }
                durationMs: { type: integer, minimum: 1 }
                fps: { type: integer, minimum: 1, maximum: 60 }
                camera: { type: string, description: 机位快照（JSON 对象的字符串，≤ 16 KiB）。 }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorMediaRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 场景版本不一致（40902，文件未上传）或项目在回收站（40905）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /projects/{projectId}/director-scenes/{sceneId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: sceneId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    post:
      tags: [project]
      operationId: uploadDirectorAsset
      description: |
        上传 3D 高斯泼溅文件（.ply / .spz，DRD-28），作为场景背景。按文件结构识别两段：文件头初判之后，
        PLY 要读到含 `element vertex` 的头部，SPZ 要有 NGSP 头（v4 起不压缩；旧版本解 gzip 之后才有）。
        普通 gzip、改了扩展名的图片一律 415。上限取配置（默认 100 MiB，DR-PARAM-11）。
        purpose 记为 `director_asset`，不进「我的素材」。**不核场景版本**：上传后由前端写进场景再保存。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [splat] }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorMediaRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /projects/{projectId}/director-scenes/{sceneId}/build:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: sceneId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    post:
      tags: [project]
      operationId: buildDirectorScene
      description: |
        AI 搭景（docs/agent/director，DRT-19）：按描述与参考图让模型给出方案，服务端求解出站位与机位，
        **只回提案、不写场景、不发事件**（DRD-26）。前端预览之后以 `baseVersion` 照常保存（作为一步撤销）。

        **免费**（DRK-4）：不扣积分；操作 `scene_build` 照常走能力合取式，兜底价 0 积分，运营改成非 0 时显式拒绝
        （42203「按约定免费」）。

        - `sceneVersion` 与场景当前版本不一致回 409/40902「请先保存再搭景」；
        - 没有可用模型回 422/42203（`details.userFixable`）；参考图超过上限回 40001；
        - 同一用户同时进行的次数超限回 429/42902，每小时次数超限回 429/42901，都带 `Retry-After` 头与
          `details: {retry_after_seconds, scope, limit}`；
        - 模型输出无法解析回 422/42216（`details: {reason, snippet}`），场景不变；上游失败 / 超时回 502（50201 / 50202）。
        参考图一律内联发给模型，不发外链（DR-N-11）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectorBuildRequest' }
      responses:
        '200':
          description: 提案
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorBuildResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 场景版本不一致（40902）或项目在回收站（40905）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '422':
          description: AI 搭景不可用（42203）或方案无法解析（42216）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 限流（42901 每小时次数、42902 同时进行的次数）
          headers:
            Retry-After:
              schema: { type: integer }
              description: 多少秒之后可以再试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 上游失败（50201）或超时（50202）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /director/build-config:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: getDirectorBuildConfig
      description: |
        AI 搭景现在能不能用、能带几张参考图、本小时用了几次（DR-F-108）。**只读，不占额度**。
        「能不能用」与搭景时是同一个判断：面板据此置灰并说明原因（`userFixable` 区分语气，不匹配文案）。
      responses:
        '200':
          description: 可用性
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorBuildConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{projectId}/director-scenes/{sceneId}/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: sceneId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
      - name: recordId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    patch:
      tags: [project]
      operationId: updateDirectorMediaRecord
      description: |
        隐藏 / 取消隐藏一条媒体记录（DR-F-75）。**只改隐藏标记**：不删文件，删除保护照常成立 ——
        画布上可能还有节点镜像着这张截图。记录本身不可变。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '200':
          description: 更新后的记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorMediaRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }


  /projects/{projectId}/smartcuts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: listSmartcuts
      description: |
        本项目全部智能剪辑节点的摘要（docs/agent/smartcut，SC-I-01、SCK-13）。

        节点卡、下游取输入、整图运行都以它为准：成片、封面、版本、两个过期标记与进度**不写进画布节点** ——
        导出在 Worker 里异步完成，写进节点的值会被画布的自动保存覆盖。回收站里的项目也能读。
      responses:
        '200':
          description: 摘要，按建立时间排序
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SmartcutSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [project]
      operationId: createSmartcut
      description: |
        为画布上的智能剪辑节点建时间线（画面 / 音频 / 字幕三条默认轨），并绑定这个节点（SCD-20）。

        按（项目，画布节点）幂等：该节点已有时间线时回 **200** 与已有那条，新建回 **201**；
        两种都要把 `timelineId` 写回节点 params。带 `sourceTimelineId` 时复制那条时间线
        （复制、粘贴出来的节点，SC-F-07）：轨道、片段、字幕、文字一并复制，快照与调用记录不复制，
        新片段一律新 ID 并剥掉 `sourceShotId`。源时间线必须在**同一工作区**，否则 404。
        回收站中的项目返回 409/40905。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canvasNodeId]
              properties:
                canvasNodeId: { type: string, minLength: 1, maxLength: 64 }
                sourceTimelineId:
                  type: string
                  pattern: '^[0-9]+$'
                  description: 复制来源。不传则建一条空时间线。
      responses:
        '200':
          description: 该节点已有时间线，返回已有那条
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutSummary' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/smartcuts/{timelineId}/sync:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
    post:
      tags: [project]
      operationId: syncSmartcutInputs
      description: |
        按**已保存的画布**重新解析这个节点的输入（SCK-16、SCD-23），幂等。

        - `autofill`：时间线还没被剪过时，把新素材按编号铺到轨道上（连线即入轨，SC-F-13）；剪过之后只更新素材条；
        - `listOnly`：只更新素材条，不动轨道（剪辑台开着时用，SC-F-14）；
        - `replaceChanged`：同一来源节点的新产物原位换进片段，保留裁切与转场（SC-F-151）；写入前存快照，必须带 `baseVersion`。

        服务端不信客户端报的输入：上游以画布连线为准，并回查生成表校验归属与状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [autofill, listOnly, replaceChanged] }
                baseVersion: { type: integer, description: '`replaceChanged` 必填' }
      responses:
        '200':
          description: 同步结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutSyncResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突（`replaceChanged`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }

  /projects/{projectId}/smartcuts/{timelineId}/inputs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
    get:
      tags: [project]
      operationId: listSmartcutInputs
      description: 素材条（只读，不触发同步）。
      responses:
        '200':
          description: 素材条
          content:
            application/json:
              schema:
                type: object
                required: [items, fingerprint]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SmartcutInput' }
                  omitted:
                    type: integer
                    description: 超出 50 条、没进素材条的条数
                  fingerprint: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/smartcuts/{timelineId}/plan:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
    post:
      tags: [project]
      operationId: planSmartcut
      description: |
        AI 剪辑（SC-F-80~89）。**免费、按用户限流**（SCK-2）；同步调用文本模型，长路由。

        AI 只出引用素材编号的方案，时间全部由服务端编译（SCK-14）。结果**直接写进时间线**，写入前存快照
        （「撤销这轮 AI」靠它）。模型输出修一次仍不合规时退回确定性方案，结果里 `usedFallback=true`，时间线不会被清空。

        - 带 `baseVersion`：AI 剪辑期间时间线被改过时**不写入**，回 409；带 `force: true` 重试即覆盖（可撤销）；
        - 口播 / 解说缺识别结果、解说没有配音时回 422/42217，`details` 里给出缺什么与出路（如识别报价）；
        - 同时进行与每小时上限分别回 42902 / 42901，并带 `Retry-After`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmartcutPlanRequest' }
      responses:
        '200':
          description: 规划结果（已写入时间线）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutPlanResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 剪辑期间时间线被改过
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /projects/{projectId}/smartcuts/{timelineId}/plan/{callId}/apply:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - name: callId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    post:
      tags: [project]
      operationId: applySmartcutVariant
      description: |
        多方案时切换到另一套（SC-F-112）：按当前素材重新编译那一套，写入前存快照。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant, baseVersion]
              properties:
                variant: { type: integer, minimum: 0, maximum: 2 }
                baseVersion: { type: integer }
                force: { type: boolean }
      responses:
        '200':
          description: 已切换
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutPlanResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }

  /projects/{projectId}/smartcuts/{timelineId}/edit:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
    post:
      tags: [project]
      operationId: editSmartcut
      description: |
        追加指令（SC-F-110）：在已剪好的时间线上接着提要求。AI 只输出对现有片段的原子操作，
        用户改过的片段不改；写入前存快照。免费、与 AI 剪辑共用限流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction, baseVersion]
              properties:
                instruction: { type: string, minLength: 1, maxLength: 2000 }
                baseVersion: { type: integer }
                force: { type: boolean }
      responses:
        '200':
          description: 已应用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutPlanResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /projects/{projectId}/smartcuts/{timelineId}/translate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
    post:
      tags: [project]
      operationId: translateSmartcutSubtitles
      description: |
        字幕翻译（SC-F-125）：中 / 英 / 日 / 韩之一。默认生成新的字幕轨，也可替换原文，时间保持不变。
        免费、与 AI 剪辑共用限流；部分条目失败时在 `failed` 里列出，不改那几条。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subtitleTrackId, targetLang, baseVersion]
              properties:
                subtitleTrackId: { type: string, pattern: '^[0-9]+$' }
                targetLang: { type: string, enum: [zh-CN, en, ja, ko] }
                mode: { type: string, enum: [newTrack, replace], default: newTrack }
                baseVersion: { type: integer }
      responses:
        '200':
          description: 翻译结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutTranslateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /projects/{projectId}/smartcuts/{timelineId}/transcribe:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/SmartcutIdempotencyKey'
    post:
      tags: [project]
      operationId: transcribeSmartcut
      description: |
        语音识别（SC-F-120~124）。**按模型定价收费**（SCK-4）：`dryRun=true` 只报价（按未识别素材的时长合计）；
        确认后按素材逐个受理，任务挂在智能剪辑名下（不挂画布节点、不登记作品、不逐条通知）。

        按素材识别，再按片段取用区间映射到成片时间。没有音轨的素材直接跳过、不收费；
        同一份素材同一组参数识别过就复用缓存、不再收费；并发请求只扣一次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelCode]
              properties:
                clipIds:
                  type: array
                  items: { type: string, pattern: '^[0-9]+$' }
                  description: 不传 = 整条时间线用到的全部素材
                modelCode: { type: string }
                keepFillers:
                  type: boolean
                  description: 保留口癖（口播精剪要 true：口癖要靠识别结果判断）
                language: { type: string, description: 'zh-CN / en / ja / ko；不传由模型判断' }
                subtitles:
                  type: boolean
                  description: 识别完成后自动生成字幕轨
                dryRun: { type: boolean }
      responses:
        '200':
          description: 报价（dryRun）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutQuote' }
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutTranscribeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{projectId}/smartcuts/{timelineId}/clips/{clipId}/regenerate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/SmartcutClipId'
      - $ref: '#/components/parameters/SmartcutIdempotencyKey'
    post:
      tags: [project]
      operationId: regenerateSmartcutClip
      description: |
        片段重拍（SC-F-130）：沿用原片段那次生成的模型、操作、参数与输入，换上新提示词整段重新生成；
        按该模型定价。完成后替换这一段，原素材进备选；**只换剪辑台里的这一段，不改上游节点**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 4000 }
                dryRun: { type: boolean }
      responses:
        '200':
          description: 报价（dryRun）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutQuote' }
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutGeneration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{projectId}/smartcuts/{timelineId}/fill:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/SmartcutIdempotencyKey'
    post:
      tags: [project]
      operationId: fillSmartcutGap
      description: |
        补镜（SC-F-131）：在指定位置插入一段新生成的视频；按所选模型定价。
        可用相邻片段的末帧做参考图。完成后插入到发起时记下的位置；那个位置已不存在时进生成记录，不自动插入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, modelCode, operation]
              properties:
                afterClipId: { type: string, pattern: '^[0-9]+$', description: 不传 = 放在最前面 }
                prompt: { type: string, minLength: 1, maxLength: 4000 }
                modelCode: { type: string }
                operation: { type: string, enum: [text2video, img2video] }
                durationSec: { type: integer, minimum: 1, maximum: 60 }
                refFromClipId:
                  type: string
                  pattern: '^[0-9]+$'
                  description: 取这一段的末帧作参考图（`img2video`）
                dryRun: { type: boolean }
      responses:
        '200':
          description: 报价（dryRun）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutQuote' }
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutGeneration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{projectId}/smartcuts/{timelineId}/clips/{clipId}/desubtitle:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/SmartcutClipId'
      - $ref: '#/components/parameters/SmartcutIdempotencyKey'
    post:
      tags: [project]
      operationId: desubtitleSmartcutClip
      description: |
        去字幕（SC-F-132）：只处理片段取用的区间（先截出这一段），按这段时长计价；完成后替换这一段，
        原素材与原区间进备选。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelCode]
              properties:
                modelCode: { type: string }
                mode: { type: string, enum: [subtitle, text], default: subtitle }
                dryRun: { type: boolean }
      responses:
        '200':
          description: 报价（dryRun）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutQuote' }
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutGeneration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{projectId}/smartcuts/{timelineId}/music:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/SmartcutIdempotencyKey'
    post:
      tags: [project]
      operationId: generateSmartcutMusic
      description: |
        生成配乐（SC-F-65）：按所选模型定价；产物放进配乐轨，起点为 `atMs`（成片时间）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, modelCode]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 2000 }
                modelCode: { type: string }
                durationSec: { type: integer, minimum: 3, maximum: 300 }
                atMs: { type: integer, minimum: 0 }
                instrumental: { type: boolean, default: true }
                dryRun: { type: boolean }
      responses:
        '200':
          description: 报价（dryRun）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutQuote' }
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutGeneration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{projectId}/smartcuts/{timelineId}/clips/{clipId}/sfx:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/SmartcutClipId'
      - $ref: '#/components/parameters/SmartcutIdempotencyKey'
    post:
      tags: [project]
      operationId: generateSmartcutSfx
      description: |
        按画面生成音效（SC-F-65、SC-F-133）：只收 3~20 秒的片段（超出回 422/42203 并说明）；
        按所选模型定价；产物放进音效轨并跟随该片段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelCode]
              properties:
                prompt: { type: string, maxLength: 1000 }
                modelCode: { type: string }
                dryRun: { type: boolean }
      responses:
        '200':
          description: 报价（dryRun）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutQuote' }
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutGeneration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{projectId}/smartcuts/{timelineId}/generations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [project]
      operationId: listSmartcutGenerations
      description: 生成记录（SC-F-139）：这条时间线里所有识别与片段级生成，按时间倒序。
      responses:
        '200':
          description: 生成记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutGenerationList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/smartcuts/{timelineId}/clips/{clipId}/origin:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SmartcutTimelineId'
      - $ref: '#/components/parameters/SmartcutClipId'
    get:
      tags: [project]
      operationId: getSmartcutClipOrigin
      description: |
        片段编辑「生成信息」（SC-F-41）：这段素材对应的生成（提示词、模型、操作、主要参数）；
        上传素材返回 `kind: upload`。现有 `GET /generations/{id}` 不带参数快照，所以单开。
      responses:
        '200':
          description: 生成信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutClipOrigin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /smartcut/config:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [project]
      operationId: getSmartcutConfig
      description: |
        AI 剪辑现在能不能用、本小时用了几次、各类上限，以及识别 / 去字幕 / 配乐 / 音效可选的模型与能力
        （SC-F-87、SC-F-88、SC-F-122）。**只读，不占额度**。入口置灰与说明都靠它。
      responses:
        '200':
          description: 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartcutConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /smartcut/typeset:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [project]
      operationId: typesetSmartcutText
      description: |
        按文字与样式排版，返回透明 PNG（SCD-28）。预览与成片用的是同一个排版函数，所以预览里看到的就是
        成片里叠上去的那一张（SC-N-06）。结果按内容哈希缓存。

        响应头 `X-Typeset-Box` 是非透明区域的包围框（`x,y,w,h`，像素）；`X-Typeset-Missing` 是白名单字体
        里没有、画成替代字形的字符（URL 编码），面板据此提示。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TypesetRequest' }
      responses:
        '200':
          description: 排版结果
          headers:
            X-Typeset-Box: { schema: { type: string } }
            X-Typeset-Missing: { schema: { type: string } }
          content:
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/trash:
    get:
      tags: [project]
      operationId: listTrash
      description: 回收站列表，按 `deletedAt` 倒序。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 回收站分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /folders:
    get:
      tags: [project]
      operationId: listFolders
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 文件夹列表（单层，带项目计数）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Folder' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [project]
      operationId: createFolder
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /folders/{folderId}:
    parameters:
      - name: folderId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      tags: [project]
      operationId: renameFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 已重命名
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [project]
      operationId: deleteFolder
      description: |
        删文件夹**不删项目** —— 里面的项目落回「未分类」（folderId 置空）。
        文件夹是归类方式，不是容器；连带删项目会让一次误点变成丢数据。
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /project-templates:
    get:
      tags: [project]
      operationId: listProjectTemplates
      description: 新建项目时可选的画布模板（AC-18 的四种模板 + 空画布）。
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectTemplate' }

  # ==================== 画布配置 ====================
  /canvas/config:
    get:
      tags: [catalog]
      operationId: getCanvasConfig
      description: |
        服务端合成的配置快照，带 `revision`。前端缓存键必须含 revision；
        后台写配置即 bump，避免旧系统"漏删缓存导致最长 30 分钟脏读"的问题。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: revision
          in: query
          description: 客户端已有的 revision；一致时返回 304
          schema: { type: integer }
      responses:
        '200':
          description: 配置快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasConfig' }
        '304': { description: 配置未变更 }

  /canvas/connections/validate:
    post:
      tags: [catalog]
      operationId: validateCanvasConnection
      description: |
        连线预校验（画布语义层）：这一组输入能不能连到目标节点，以及建议的默认操作。
        **`valid:false` 是 HTTP 200**：这是一次「询问」，不是一次失败的操作，前端据此不加这条连线并提示 `reason`。
        规则允许、但判定不出默认操作的非视频目标（如图片 → 3D 导演台、风格 → 图片）也是 `valid:true`，只是没有 `operation`。
        通过这里不代表一定能提交成功：具体型号能收什么由能力矩阵另行判定（GAP-22）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanvasConnectionValidateRequest' }
      responses:
        '200':
          description: 校验结论
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasConnectionValidateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /canvas/styles:
    get:
      tags: [catalog]
      operationId: listStyleMaterials
      description: 风格广场（图片节点的风格素材）。筛选与收藏同 `/canvas/cameras`。
      parameters:
        - $ref: '#/components/parameters/MaterialKeyword'
        - $ref: '#/components/parameters/MaterialCategory'
        - $ref: '#/components/parameters/MaterialCommercial'
        - $ref: '#/components/parameters/MaterialFavorited'
      responses:
        '200':
          description: 素材列表（**裸数组**，没有分页外壳）
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MaterialItem' } }

  /canvas/effects:
    get:
      tags: [catalog]
      operationId: listEffectMaterials
      description: 特效广场（视频节点的特效素材）。筛选与收藏同 `/canvas/cameras`。
      parameters:
        - $ref: '#/components/parameters/MaterialKeyword'
        - $ref: '#/components/parameters/MaterialCategory'
        - $ref: '#/components/parameters/MaterialCommercial'
        - $ref: '#/components/parameters/MaterialFavorited'
      responses:
        '200':
          description: 素材列表（**裸数组**，没有分页外壳）
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MaterialItem' } }

  /canvas/cameras:
    get:
      tags: [catalog]
      operationId: listCameraMaterials
      description: |
        运镜广场（视频节点的「运镜」，迁移 00064）：固定镜头、跟随拍摄、盘旋抬升……手持拍摄。
        选中后节点里只存 `params.camera = {code, name}`，提示词由服务端在受理时按目录拼进去
        —— **提示词不下发**（同风格、特效：下发了前端就会想自己拼，拼出来的词会落进 canvasData）。
        选了一个已下线的运镜，受理在扣费之前报错（不静默按没选处理）。
      parameters:
        - $ref: '#/components/parameters/MaterialKeyword'
        - $ref: '#/components/parameters/MaterialCategory'
        - $ref: '#/components/parameters/MaterialCommercial'
        - $ref: '#/components/parameters/MaterialFavorited'
      responses:
        '200':
          description: 运镜列表（**裸数组**，按 sort 排好）
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MaterialItem' } }

  /canvas/materials/{type}/{code}/favorite:
    post:
      tags: [catalog]
      operationId: toggleMaterialFavorite
      description: 收藏 / 取消收藏一个素材（风格、特效、运镜）。重复收藏不是错误。
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [style, effect, camera] }
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean, description: '`true` 收藏、`false` 取消' }
      responses:
        '200':
          description: 操作后的状态
          content:
            application/json:
              schema:
                type: object
                required: [isFavorited]
                properties:
                  isFavorited: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/canvas/config:
    get:
      tags: [catalog]
      operationId: adminGetCanvasConfig
      description: |
        管理端看同一份配置快照（`canvas:read`）。

        ⚠️ 管理端**不能**去调用户端的 `/canvas/config`：admin token 与 user token 类型隔离，
        那条路由对 admin token 回 401 —— 而管理端收到 401 会清会话，表现为「一点画布配置
        就被踢回登录页」（P15-05 发现）。与用户端复用同一个 handler：快照只有一种合成方式。
      responses:
        '200':
          description: 配置快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanvasConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== 生成 ====================
  /generations/estimate:
    post:
      tags: [generation]
      operationId: estimateGeneration
      description: |
        报价与能力预检。校验顺序固定：连线规则 → 能力矩阵 → 参数范围 → 会员等级 → 计价。
        不支持的组合必须在此处报错，**不能等扣费后由上游返回 400**（AC-10、FLOW-07）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationEstimateRequest' }
      responses:
        '200':
          description: 报价结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationQuote' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /models:
    get:
      tags: [catalog]
      operationId: listUsableModels
      description: |
        用户端可选模型：**模型启用 ∧ Provider 就绪 ∧ 至少绑定并启用了一个操作**。

        ⚠️ 与 `/image-tools` 是**两个粒度**，不是重复。这里回答"这个模型值得出现在
        下拉里吗"，工具栏回答"这个模型 + 这个操作现在能不能点"（还要有价、
        过能力矩阵、够会员等级）。合成一个的话，下拉里就只剩下能跑当前工具的模型，
        用户换个工具会发现模型列表也跟着变 —— 他会以为模型被删了。

        ⚠️ **不下发 provider code、提交地址、协议**：那些是运维信息，
        给到浏览器等于把上游拓扑公开出去。
      parameters:
        - name: resultType
          in: query
          description: 只要产出某种类型的模型（image / video / audio / text）。
          schema: { type: string }
        - name: agentCapable
          in: query
          description: |
            `true` 时只列可作画布 Agent 推理模型的：后台勾了「支持 Agent」且绑定并启用了
            `agent_chat` 操作（AGT-04，AG-14）。其它取值等同于不传。

            ⚠️ 不传时 `agent_chat` **不算**可用操作：只绑了它的推理模型不会出现在画布文本节点的
            下拉里（选了也报不出 text2text 的价）。
          schema: { type: boolean }
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, name, domain, resultType]
                  properties:
                    code: { type: string }
                    name: { type: string }
                    domain: { type: string }
                    resultType: { type: string }
                    minMemberLevelId:
                      type: string
                      description: 会员门槛。缺省表示不限。
                    agentCapable:
                      type: boolean
                      description: 可作画布 Agent 的推理模型（后台「支持 Agent」标记）。
                    hasNativeAudio:
                      type: boolean
                      description: |
                        原生出声。只对视频模型有意义，非视频模型恒 `false`。
                        Agent / 营销据此判断依赖出声的选项是否生效（前端置灰；服务端仍兜底判定）。
        '403': { $ref: '#/components/responses/Forbidden' }

  /models/{code}/params:
    get:
      tags: [catalog]
      operationId: getModelParams
      description: |
        型号级参数覆盖 —— 参数合并的**第三层**
        （`param_def.config < node_param.config_override < model_param_support.override`）。
        前端选定模型后取它，**逐字段**叠在 `/canvas/config` 已经合好的前两层上：
        清晰度、时长、画幅能选什么由型号决定，而不是节点通用的那一套。

        ⚠️ 起因（P15-01）：这条端点此前不存在，前端把 404 当成「没有覆盖」静默吞掉 ——
        Seedance 2.5 的 4~30 秒、480p、21:9 选不到，只支持 720p 的 2.0 Fast 却能选 1080P
        （选了要到上游才报错，那时已经扣过费）。

        - `options` 没配时按 `allowed_values` 生成；`default` 没配时取 `default_value`；
          `default` **不在可选项里就丢掉**（前端切模型时会把它写进参数）。
        - 一项配坏了只跳过那一项（服务端告警），不让整个模型拿不到覆盖。
        - 停用的参数定义不下发。
      parameters:
        - name: code
          in: path
          required: true
          description: 模型 code。
          schema: { type: string }
      responses:
        '200':
          description: 型号级参数覆盖
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelParams' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /timelines:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [timeline]
      operationId: createTimeline
      description: |
        建一条时间线，并铺好三条默认轨道（画面 / 音频 / 字幕）。

        ⚠️ 轨道与时间线在**一个事务**里建：分两次写的话，写完时间线就崩溃
        会留下一条没有任何轨道的时间线 —— 打开是空白，而用户不知道该点哪儿才能修好它。

        ⚠️ 宽高必须是**偶数**：H.264 的 yuv420p 要求宽高都能被 2 整除，
        否则 ffmpeg 直接报错 —— 而那时用户已经等了一整轮渲染。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { $ref: '#/components/schemas/Id' }
                scriptId:
                  $ref: '#/components/schemas/Id'
                name: { type: string }
                aspectRatio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '21:9', custom] }
                fps: { type: integer, minimum: 1, maximum: 120 }
                width: { type: integer }
                height: { type: integer }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [timeline]
      operationId: listTimelines
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 时间线列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimelineMeta' }

  /timelines/{timelineId}:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [timeline]
      operationId: getTimeline
      description: |
        取完整时间线。

        ⚠️ 每段的 `startMs` / `durationMs` 是**服务端按顺序算出来的**，
        不是存出来的（库里那份只是缓存）。客户端不要自己累加 ——
        变速那一档会算错：2 倍速的 10 秒素材只占 5 秒。
      responses:
        '200':
          description: 时间线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [timeline]
      operationId: updateTimelineMeta
      description: 改名、画幅、帧率与分辨率。走乐观锁。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                name: { type: string }
                aspectRatio: { type: string, enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '21:9', custom] }
                fps: { type: integer }
                width: { type: integer }
                height: { type: integer }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/content:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [timeline]
      operationId: saveTimelineContent
      description: |
        整份保存（SCD-16）：一个事务替换全部轨道、片段、字幕与文字，必须带 `version`。

        - 新对象带临时 ID（`tmp-` 开头），响应的 `idMap` 给出 `临时 ID → 正式 ID`，前端据此改写撤销栈；
        - 服务端照样**重算画面轨落点**、校验区间与转场，不采信客户端算的时间；画面轨片段的 `startMs` 传了也忽略；
        - 音频轨与文字轨同轨不许重叠，字幕轨允许重叠（两个人同时说话）；
        - 新片段的 `sourceShotId` 一律剥掉（复制出来的片段会撞「同一镜一段」的唯一约束）；
        - 校验不过回 40001，`details.path` 指出是哪一项。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimelineContent' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineSaveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突，详情说清是谁改的
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }

  /timelines/{timelineId}/snapshots:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [timeline]
      operationId: listTimelineSnapshots
      description: |
        快照列表（SCD-18，不含正文），按时间倒序，每条时间线最多保留 20 份。
        AI 剪辑、追加指令、方案切换、片段回填、替换变了的素材、识别字幕、翻译、快照恢复之前各存一份。
      responses:
        '200':
          description: 快照
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineSnapshotMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /timelines/{timelineId}/snapshots/{snapshotId}/restore:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - name: snapshotId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [timeline]
      operationId: restoreTimelineSnapshot
      description: |
        恢复到某份快照（「撤销这轮 AI」也走这里）。恢复前先把当前内容存一份快照。
        快照里引用的素材已被删除时**照常恢复**，并在 `missing` 里列出缺素材的那几段（SCK-18）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                baseVersion: { type: integer }
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineRestoreResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }

  /timelines/{timelineId}/assemble:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [timeline]
      operationId: assembleTimeline
      description: |
        按分镜自动装配（NEW-07、NEW-09）。

        ⚠️ **只补缺口，不动已有的**：用户在上一次装配之后往往已经手工裁过、
        调过顺序。全删重建等于把他的工作扔掉，而那是不可逆的。
        判据是 `sourceShotId` —— 这一镜已经有自动装配出来的段就跳过。
        `force` 为真时才重建，且重建的也只是**自动装配出来的**那些段。

        ⚠️ **缺素材或失败镜头不静默跳过**：`plan.gaps` 逐条给出镜号与原因
        （没加进视频组 / 正在生成 / 生成失败 / 成功但没有产物 / 时长未知）。
        少了两镜的成片看起来是完整的，用户要逐镜比对才能发现 ——
        而那时他可能已经把片子发出去了。

        ⚠️ **时长未知也算缺口**，不猜一个数填进去：猜的话成片长度对不上，
        而"对不上多少"没人说得清。用镜头脚本里的计划时长更糟——
        那是"打算拍多久"，而生成出来的视频实际多长是上游说了算的。

        `dryRun` 只看计划不写库 —— 有缺口时用户可能想先去把那几镜补出来。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                force: { type: boolean }
                dryRun: { type: boolean }
      responses:
        '200':
          description: 装配结果（含计划与缺口）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Timeline'
                  - type: object
                    properties:
                      plan: { $ref: '#/components/schemas/AssemblePlan' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/renders:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [timeline]
      operationId: startRender
      parameters:
        - $ref: '#/components/parameters/SmartcutIdempotencyKey'
      description: |
        渲染成片（NEW-10）。

        顺序是**预检 → 报价 → 扣费 → 写任务 + outbox（同一个事务）**，
        与生成受理逐条对齐。⚠️ 一条跑不起来的时间线要在**扣费之前**被拦住 ——
        否则用户看到的是一次莫名其妙的扣费与退款，而他什么都没得到。

        ⚠️ `dryRun` 只预检与报价：渲染是这条链上最贵的一步（时间与积分都是），
        必须能**先看再决定**。

        ⚠️ **快照在受理时冻结**：用户在排队期间改了一刀不会影响这次成片。
        `render_job` 同时存 `timelineVersion` + snapshot + `ffmpegVersion` ——
        只记时间线版本的话，升级 ffmpeg 后**同一个版本渲染出不同结果**就无法解释。

        ⚠️ 预检不通过时把**每一条**原因回给用户（`issues`），不是一句"无法渲染" ——
        他要知道是哪一段缺素材才改得动。

        智能剪辑（docs/agent/smartcut）：导出**免费**（`timeline_render` 兜底价 0，SCK-3），按用户限流；
        `Idempotency-Key` 真正生效：同一工作区同一把键只建一个任务，重复请求返回那一条（SCB-3）；
        绑定了画布节点的时间线导出后**不**自动登记作品（SCK-9）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  description: 只预检与报价，不扣费、不建任务。
                resolution:
                  type: string
                  enum: [720p, 1080p]
                  description: 按画幅换算宽高（偶数），冻结进这次导出（SCK-11）。不传按时间线的宽高
                fps:
                  type: integer
                  enum: [24, 25, 30]
                  description: 不传按时间线的帧率
      responses:
        '200':
          description: 预检结果（dryRun）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderPrecheck' }
        '202':
          description: 已受理，异步渲染
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RenderPrecheck'
                  - type: object
                    properties:
                      render: { $ref: '#/components/schemas/RenderJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: |
            按用户限流（SCK-3：导出免费）：排队中与渲染中合计已有 1 个（42902），或超过每小时上限（42901）。
            响应带 `Retry-After` 头。
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [timeline]
      operationId: listRenders
      description: 这条时间线的渲染历史（按时间倒序）。
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 渲染列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RenderJob' }

  /renders/{renderId}:
    parameters:
      - name: renderId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [timeline]
      operationId: getRender
      description: |
        轮询渲染进度。

        ⚠️ `stage` 让进度条能说"现在在干什么"（probing / assembling /
        encoding / archiving）—— 只给一个百分比的话，卡在 40% 十分钟时
        用户不知道是死了还是在编码。

        ⚠️ **浏览器轮询耗尽 ≠ 渲染失败**（GAP-14 的同一条）：
        前端只能显示"仍在处理"，不得本地标失败，更不能据此触发退款。
      responses:
        '200':
          description: 渲染任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/render/settings:
    get:
      tags: [admin]
      operationId: getRenderSetting
      description: |
        取渲染水印配置（`system:read`）。

        ⚠️ **水印图是配置不是代码**：换 logo、调位置、调透明度都不该发版
        （与图片预设、提示词模板同一条）。

        ⚠️ **不下发预览 URL**：水印图走受保护的媒体下载端点，
        管理端按 `watermarkMediaId` 用 fetch+blob 自己取 ——
        裸 `<img src>` 不带 Authorization 头，一律 401（GAP-18 同一条）。
      responses:
        '200':
          description: 渲染配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderSetting' }
    put:
      tags: [admin]
      operationId: saveRenderSetting
      description: |
        保存渲染水印配置（`system:write`）。

        ⚠️ 走 `system:write` **不走 `content:write`**：它影响每一条成片的
        画面，与"审一件作品"完全不是一个量级的决定。

        ⚠️ 配了 `watermarkMediaId` 就会**验图存在**：配一个不存在的 ID，
        后果是此后每一次渲染都少一个水印，而后台显示"已配置"。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watermarkMediaId:
                  type: string
                  description: 空串或 "0" 表示不加水印。
                position:
                  type: string
                  enum: [top_left, top_right, bottom_left, bottom_right]
                opacity:
                  type: integer
                  minimum: 1
                  maximum: 100
                scale:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: |
                    水印宽度占画面宽度的百分比。

                    ⚠️ 按**百分比**不按像素：1080p 上合适的 120px
                    到竖屏上就压住半个画面。上限 50 —— 再大就不是标识而是遮挡。
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderSetting' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/render/renders/{renderId}:
    parameters:
      - name: renderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      operationId: traceRender
      description: |
        后台追溯一次渲染（`content:read`）：用了哪条时间线、哪些素材、
        成片进了哪件作品（FULL-03）。

        ⚠️ 同时给**快照**与**当前时间线**：只看当前时间线会得出完全错误的
        结论 —— 用户很可能在渲完之后又改过。差别才说明问题。

        ⚠️ 快照**原样给**（`snapshot` 是原始 JSON）：重新组装一份可读结构
        会引入第二种解释，而排障恰恰需要原文。
      responses:
        '200':
          description: 追溯结果
          content:
            application/json:
              schema:
                type: object
                required: [render, mediaIds]
                properties:
                  render: { $ref: '#/components/schemas/RenderJob' }
                  snapshot:
                    type: object
                    additionalProperties: true
                    description: 受理时冻结的渲染快照原文。
                  mediaIds:
                    type: array
                    items: { $ref: '#/components/schemas/Id' }
                    description: 快照里用到的全部素材（含水印图）。
                  timeline:
                    type: object
                    description: 时间线**当前**的样子；已删除时不返回。
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      name: { type: string }
                      version: { type: integer }
                      status: { type: string }
                  workId: { $ref: '#/components/schemas/Id' }
        '404': { $ref: '#/components/responses/NotFound' }

  /renders/{renderId}/cancel:
    parameters:
      - name: renderId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [timeline]
      operationId: cancelRender
      description: |
        取消渲染并退款。

        ⚠️ 只有 `queued` / `running` 能取消。已经结束的任务返回 `40901`
        并说明"已经跑完了"——**不是静默成功**，否则用户会等一个不会来的取消。

        ⚠️ 退款只能成功一次：服务端按"本次是否真的改成了 cancelled"决定退不退，
        不看这个的话连点两次取消就退两次钱。
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /renders/{renderId}/download:
    parameters:
      - name: renderId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [timeline]
      operationId: getRenderDownload
      description: |
        成片下载地址（SCK-10、SC-F-76）：**5 分钟有效、只对这一个文件有效**的签名链接，浏览器直接下载，
        不把整份成片读进内存。签发前校验归属与 `export` 权限；还没成功的任务回 409。
      responses:
        '200':
          description: 签名链接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderDownload' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/subtitles:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [timeline]
      operationId: saveSubtitles
      description: |
        整批替换字幕。

        ⚠️ 整批替换而不是逐条增删：字幕的编辑是"改一整段时间轴"，
        逐条 diff 要在前后端各写一份匹配逻辑，而两份早晚不一致。
        字幕行很轻（几十字节），整批重写的代价可以忽略。

        允许时间重叠（两个人同时说话是正当的），但拦住**完全相同**的时间段 ——
        那多半是重复提交。

        ⚠️ 只替换**默认字幕轨**（idx 最小的那条）上的字幕：请求体里没有轨道，
        其它字幕轨（翻译出来的各语言）原样不动；经这里保存的字幕不再跟随片段（没有锚点）。
        多字幕轨与锚点的读写走 `PUT /timelines/{timelineId}/content`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, items]
              properties:
                version: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    required: [startMs, endMs, text]
                    properties:
                      startMs: { type: integer, minimum: 0 }
                      endMs: { type: integer, minimum: 1 }
                      text: { type: string }
                      style: { type: object }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/tracks/{trackId}:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - name: trackId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      tags: [timeline]
      operationId: updateTrack
      description: 改轨道的静音与音量。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                isMuted: { type: boolean }
                volume: { type: integer, minimum: 0, maximum: 200 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/tracks/{trackId}/clips:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - name: trackId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [timeline]
      operationId: addClip
      description: |
        导入一段素材。`sourceOutMs` 省略时取探测到的整段时长。

        ⚠️ 轨道只收对得上的素材：一段音频被放进画面轨的话，
        渲染时 ffmpeg 拿它当视频输入 —— 出来的成片那一段是黑屏，
        而任务是"成功"的。

        ⚠️ 素材时长探测不出来时**明确报错**，不猜一个时长。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, mediaId]
              properties:
                version: { type: integer }
                mediaId: { $ref: '#/components/schemas/Id' }
                sourceInMs: { type: integer, minimum: 0 }
                sourceOutMs: { type: integer, minimum: 0 }
                afterClipId:
                  $ref: '#/components/schemas/Id'
      responses:
        '201':
          description: 已加入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/tracks/{trackId}/clips/{clipId}/trim:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - name: trackId
        in: path
        required: true
        schema: { type: string }
      - name: clipId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      tags: [timeline]
      operationId: trimClip
      description: |
        裁切：改的是**素材内的取用区间**，不是时间线上的落点 ——
        落点由服务端重排。两件事混在一起的话，裁短第 2 段之后
        第 3 段还停在原处，成片里多出一段黑屏。

        ⚠️ 取用区间不能超出素材本身；超出的后果是渲染出一段黑屏，
        而任务是"成功"的。素材时长未知时放行（拿不到数字就没法比较）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, sourceInMs, sourceOutMs]
              properties:
                version: { type: integer }
                sourceInMs: { type: integer, minimum: 0 }
                sourceOutMs: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已裁切
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/tracks/{trackId}/clips/{clipId}/split:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - name: trackId
        in: path
        required: true
        schema: { type: string }
      - name: clipId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [timeline]
      operationId: splitClip
      description: |
        分段。`atMs` 是相对**这一段起点**的偏移（时间线坐标，不是素材坐标）——
        用户是在时间线上点的那一下。

        ⚠️ 服务端换算回素材坐标时会带上**变速**：2 倍速时时间线上的 1 秒
        对应素材里的 2 秒。不换算的话接缝处跳帧，而两段各自看都是好的。

        ⚠️ 左半段不带原来的淡出、右半段不带原来的淡入：
        都带上的话接缝处会"淡出再淡入"，而用户只是切了一刀。

        ⚠️ 右半段**不继承** `sourceShotId`：它不再是"第 N 镜自动装配出来的那一段"。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, atMs]
              properties:
                version: { type: integer }
                atMs: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已分段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/tracks/{trackId}/clips/{clipId}/move:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - name: trackId
        in: path
        required: true
        schema: { type: string }
      - name: clipId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      tags: [timeline]
      operationId: moveClip
      description: |
        画面轨：排序。`toPosition` 从 1 起；越界**夹回范围**而不是报错 ——
        那不是用户能理解的错误，夹回去就是他想要的效果（拖到最前/最后）。

        音频 / 字幕 / 文字轨（SCD-15）：按起点放置，传 `startMs`（成片时间），同轨不许重叠（字幕轨除外）。
        ⚠️ 不分流的话，Agent 移动一次配乐就会被挤成首尾相接。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                toPosition: { type: integer, description: 画面轨用 }
                startMs: { type: integer, minimum: 0, description: 非画面轨用（成片时间） }
      responses:
        '200':
          description: 已移动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '409': { $ref: '#/components/responses/Conflict' }

  /timelines/{timelineId}/tracks/{trackId}/clips/{clipId}:
    parameters:
      - name: timelineId
        in: path
        required: true
        schema: { type: string }
      - name: trackId
        in: path
        required: true
        schema: { type: string }
      - name: clipId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    patch:
      tags: [timeline]
      operationId: updateClipProps
      description: |
        改片段属性：变速、音量、淡入淡出、转场（NEW-08、NEW-09）。

        ⚠️ **每个字段都是可选的，省略＝这一项不动**。服务端用指针接 ——
        `volume: 0` 是**静音**，是一个正当的取值；用零值当"没传"的话
        用户永远调不到静音，他点了没反应而界面上那个滑块确实滑到了 0。

        ⚠️ **接缝的转场只记在后一段的 `transitionIn` 上**。
        两段各记一半（A 的 out + B 的 in）看起来更对称，但用户改了 A 的转出
        而 B 的转入还是旧的时，渲染该听谁的没人说得清 ——
        而这种不一致在时间线界面上完全看不出来。
        第一段的 `transitionIn` ＝**从黑场淡入**。

        ⚠️ **转场会"吃掉"两段各一半的时间**：500ms 的叠化意味着两段重叠 500ms。
        超过任一侧的一半时那一侧会被整段吃光 —— 渲染出来直接少一个镜头，
        而时间线上那一段还好端端地画着。所以服务端按相邻段的实际长度校验。

        ⚠️ 淡入 + 淡出不能超过片段本身：超了 `afade` 会把整段压成静音，
        而用户以为自己只是加了个柔和的收尾。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                speed:
                  type: integer
                  minimum: 25
                  maximum: 400
                  description: 百分比，100 = 原速。改变速后时长与落点由服务端重算。
                volume: { type: integer, minimum: 0, maximum: 200 }
                fadeInMs: { type: integer, minimum: 0 }
                fadeOutMs: { type: integer, minimum: 0 }
                transitionIn: { $ref: '#/components/schemas/Transition' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [timeline]
      operationId: removeClip
      description: |
        删一段。

        ⚠️ 删除也要带 `version`：不带的话两个人同时删不同的段，
        后一个会把前一个的删除撤销掉（他手上那份清单还有那一段）。
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '409': { $ref: '#/components/responses/Conflict' }

  /image-tools:
    get:
      tags: [generation]
      operationId: listImageTools
      description: |
        图片工具栏：每个工具**能不能点、不能点是为什么、能点要多少积分**。

        ⚠️ 可用性判定**复用报价那条路径**（`QuoteWithFacts`），不另写一份 ——
        「模型启用 ∧ Provider 就绪 ∧ 操作启用 ∧ 绑定启用 ∧ 有价 ∧ 能力矩阵
        ∧ 输入长度 ∧ 会员等级」必须在**报价、提交、工具栏**三处给出同一个答案。
        各写一份的结果是「工具栏说能用、点下去 422」或反过来「工具栏灰着而其实能用」，
        两种都查不出原因。

        ⚠️ 阻塞原因分两类，前端按 `userFixable` 而不是文案决定提示语气：
        缺图/缺词是**用户自己能解决**的（连张图就行），
        「模型没绑这个操作」「这个能力没配价」是**运营要解决**的 ——
        混成一句"该工具不可用"，用户会盯着灰按钮等运营修。

        ⚠️ 这是**只读提示接口**。`imageCount` / `hasText` 由前端报当前节点状态，
        客户端谎报只会误导它自己，真正的校验仍在受理链路上
        （「角色计数不信客户端」约束的是报价与受理，不是这里）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: modelCode
          in: query
          description: 当前选中的模型。为空时只判输入是否齐备，不判模型能力。
          schema: { type: string }
        - name: imageCount
          in: query
          description: 当前节点上连着几张图（蒙版也算一张）。
          schema: { type: integer, minimum: 0 }
        - name: hasText
          in: query
          description: 当前节点上有没有描述文字。
          schema: { type: boolean }
      responses:
        '200':
          description: 工具列表，按分组的工作顺序排列
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImageTool' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /quick-generations:
    post:
      tags: [canvas]
      operationId: createQuickGeneration
      description: |
        创造页「直接生成」（AGT-42，AG-02）：一次请求完成「建项目 + 建一个节点 + 受理生成」。

        顺序：预报价（会员、可用性、余额）→ 一条 insert 建项目与节点 → **事务外**受理 → 结果写回节点。
        预报价失败（余额不足、模型不可用……）**不建项目**，按错误码返回。
        受理在事务外（Provider/MQ 不入事务），所以受理失败时**项目保留、节点标失败**，
        响应 `accepted=false` 并带服务端原话，前端照常跳转画布让用户重试。

        同一工作区 + `Idempotency-Key` 重复或并发请求只建一个项目、只受理一次（返回 200 + `replayed=true`）。
        需要工作区 `generate` 权限（只读成员 403）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickGenerationRequest' }
      responses:
        '201':
          description: 已建项目（受理成功或失败都在响应体里）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickGenerationResult' }
        '200':
          description: 幂等重放，返回已建的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickGenerationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /generations:
    post:
      tags: [generation]
      operationId: createGeneration
      description: |
        受理并扣费。同一 payer_account + Idempotency-Key 重复或并发请求
        只产生一个任务与一次扣分，所有响应返回同一 generationId（AC-04、FLOW-01）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationRequest' }
      responses:
        '201':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [generation]
      operationId: listGenerations
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: projectId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/GenerationStatus' }
      responses:
        '200':
          description: 任务游标分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationPage' }

  /generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [generation]
      operationId: getGeneration
      description: 断线重连后的对账入口。事件不是事实来源，这里才是（GO-39）。
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /generations/{generationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [generation]
      operationId: cancelGeneration
      description: |
        仅 queued/running 可取消，终态为独立的 `cancelled`（不是 failed）。
        远端取消是 best effort：上游不支持时本地仍置 cancelled，但必须如实告知
        `remoteCancelled=false`，因为上游可能继续运行并计费（GAP-15）。
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                required: [status, remoteCancelled, creditsRefunded]
                properties:
                  status: { $ref: '#/components/schemas/GenerationStatus' }
                  remoteCancelled: { type: boolean }
                  creditsRefunded: { type: integer, minimum: 0 }
        '409': { $ref: '#/components/responses/Conflict' }

  /generations/{generationId}/retry:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [generation]
      operationId: retryGeneration
      description: |
        仅 failed 可重试。**创建新任务**（`retryOfId` 指回原任务），重新读当前配置、
        重新报价、重新扣分；不是把原记录改回 queued。
      responses:
        '201':
          description: 新任务已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Generation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /generations/{generationId}/outputs/{index}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: index
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
    get:
      tags: [media]
      operationId: getGenerationOutput
      description: |
        单个产物的**元信息**，按 workspace 归属鉴权。

        ⚠️ 这里**不出字节**：字节走媒体域的 `/media/{mediaId}`（缩略图也在那边）。
        分开是因为归属校验要做两次 —— 产物归属（本任务属不属于这个工作区）
        与媒体归属（这个对象属不属于这个工作区），两处都查得到才放行。
        缩略图参数因此也只在 `/media/{mediaId}` 上，不在这里。
      responses:
        '200':
          description: 产物元信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationOutputDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 脚本（P07-01） ====================
  #
  # ⚠️ 脚本与生成走的是**两条链**（06 §4.1）：分镜与提示词合成是
  # 文本模型的**同步**调用，费用记在 script_llm_call，不经过 generation 队列；
  # 资产图、分镜图、视频才走队列。两条链在日志、幂等与退款上分别追踪。
  /projects/{projectId}/workflow/plan:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workflow]
      operationId: planWorkflow
      description: |
        整图执行计划 / 运行前预览（NEW-01、NEW-02）。

        ⚠️ **只读**：不建运行、不扣费、不发队列。用户点"预览"可以反复点
        而不产生任何后果 —— 这也是「校验失败不调用模型或扣分」能成立的前提。

        ⚠️ 校验问题**一次报完**（环、悬空边、目标不存在），并给出
        **具体涉及哪些节点**：只说"图里有环"，在 100 个节点的画布上
        用户没有任何办法找到它。有 `issues` 时整个计划不可执行，
        `nodes` 为空。

        ⚠️ `targetNodeIds` 取的是**祖先闭包**：要产出 X 就得跑完 X 依赖的一切。
        取后代的话跑的是"X 之后的东西"，而 X 自己还没有产出。

        ⚠️ `levels` 是并行分层，不是线性序（NEW-04 要求独立分支可并行）；
        `estimatedSeconds` 按**关键路径**算（每层取最大值再相加），
        不是所有节点耗时之和 —— 求和会把两条并行支线的图吹成两倍时间。

        四种处置（`action`）：

        | 值 | 含义 | 计费 |
        |---|---|---|
        | `run` | 要真跑 | 计入 `totalCredits` |
        | `reuse` | 已有成功产出且设置没变（NEW-05） | **0** |
        | `skip` | 素材节点没有独立产出，只为下游贡献提示词 | 0 |
        | `blocked` | 想跑跑不了（上游没产出、没选模式、模型不可调用） | 0 |

        ⚠️ `skip` 与 `blocked` 不能合并：前者是"不需要跑"，后者是"想跑跑不了"。
        合并之后界面无法区分"这条风格线是正常的"和"这一支因为上游失败瘫了"。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetNodeIds:
                  type: array
                  items: { type: string }
                  description: 为空表示整图
                force:
                  type: boolean
                  description: 为真时连可复用的也重跑
      responses:
        '200':
          description: 执行计划
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowPlan' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/workflow/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workflow]
      operationId: listWorkflowRuns
      description: 运行历史（最近在前）。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: 运行列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkflowRunSummary' }
    post:
      tags: [workflow]
      operationId: startWorkflowRun
      description: |
        启动一次整图运行（NEW-03、NEW-04）。

        顺序是固定的：**先算计划 → 有问题就退出 → 固定快照 →
        一个事务写运行与节点 → 事务外派发第一批**。

        ⚠️ 有 issue 时直接 400：一个 run 都不建、一分钱都不扣（NEW-01）。
        错误信息里带上**具体是哪几个节点**。

        ⚠️ **全部可复用时也返回 400 而不是建一个空运行**：
        建出来的话用户会看到一次"成功"的运行，里面一个节点都没跑 ——
        而他想要的是"重新生成"。错误信息里说清有几个可复用，
        他据此决定要不要用 `force`。

        ⚠️ `graphSnapshot` 在建运行时就固定（NEW-03）：此后用户改画布
        不影响本次运行。不固定的话跑到一半改了图，后半段按新图跑、
        前半段按旧图跑 —— 产出对不上，事后也复现不了。

        ⚠️ 每个节点的幂等键是 **运行 ID + 节点 ID**：重复消息与进程重启
        因此落到 generation 已有的幂等上，不重复扣费（NEW-05）。

        ⚠️ 节点**不自己调 Provider**，而是复用普通生成任务
        （`nodes[].generationId` 就是那个子任务）—— 能力矩阵、会员门槛、
        并发上限因此只有一份实现。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetNodeIds:
                  type: array
                  items: { type: string }
                force: { type: boolean }
      responses:
        '200':
          description: 已建立的运行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workflow/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workflow]
      operationId: getWorkflowRun
      description: |
        运行详情（逐节点状态与费用）。

        ⚠️ 节点状态里 `skipped` 包含两种：本来就不该跑的（素材、静态文本）
        与**复用了上次产出的**。复用记成 `skipped` 而不是 `success` ——
        它确实没跑，记成 success 会让"这次运行产出了几个"变成一个假数字，
        而那正是用户用来判断"这次跑值不值"的。

        ⚠️ `status` 的 `partial_success` 是独立状态：
        把"10 个节点成了 9 个"显示成 success，用户不会去翻那一个失败的；
        显示成 failed，他会把 9 个成功的也重跑一遍。
      responses:
        '200':
          description: 运行详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflow/runs/{runId}/nodes/{nodeId}/retry:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
      - name: nodeId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workflow]
      operationId: retryWorkflowNode
      description: |
        重试一个节点及其**必要**下游（NEW-05）。

        ⚠️ "必要下游"不是"全部下游"：已经成功的后代**不重跑** ——
        它们的产出还在，重跑要再花一次钱，而用户点的是"重试这个失败的"。
        但被它卡住的后代（`blocked`）要**一起放开**：只把失败那个放回
        `pending`，它跑完之后下游还停在 blocked（终态），永远不会被调度。

        ⚠️ 每次重试 `attempt` 进位，幂等键随之变化。不变的话重试会命中
        上一次那条失败的 generation（受理层认为是重复提交），
        用户点多少次都是同一个失败结果 —— 他再也跑不动这个节点了。

        只能重试 `failed` / `blocked` / `cancelled` 的节点：
        已成功的重试等于重复扣费（要重做请用整图 `force`），
        还在跑的重试等于重复提交。
      responses:
        '200':
          description: 重试后的运行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workflow/runs/{runId}/nodes/{nodeId}/skip:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
      - name: nodeId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workflow]
      operationId: skipWorkflowNode
      description: |
        跳过一个节点，它的下游因此 `blocked`（NEW-06）。

        ⚠️ **用户主动跳过与计划器的 skip 不是一回事**：

        | | 含义 | 下游 |
        |---|---|---|
        | 计划器 skip | 素材节点、静态文本、复用上次产出 | 照常跑（有产出或不需要产出） |
        | 用户 skip | "这个节点我不跑了" | **blocked**（本来会产出而现在没有） |

        混为一谈的话，用户跳过一个图片节点，下游视频节点照样被派发 ——
        拿不到首帧，跑出来的东西完全不是他要的，而钱已经花了。

        ⚠️ 已经成功的后代**不受影响**：它们跑的时候上游是有产出的，
        事后跳过上游不该把一张已经出好的图标成"跑不了"。
      responses:
        '200':
          description: 跳过后的运行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workflow/runs/{runId}/cancel:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [workflow]
      operationId: cancelWorkflowRun
      description: |
        取消整次运行：不再调度新节点，在跑的子任务逐个取消并退款（NEW-06）。

        ⚠️ 顺序是**先标记运行、再取消在跑的任务**：调度只发生在扫描循环，
        而它只捞 pending/running 的运行 —— 运行一旦标成 cancelled
        就不会再有新节点被派发。反过来做的话，取消子任务会同步触发回写，
        回写抢先把整次运行结算成 **failed**，用户按了取消却看到"运行失败"。

        ⚠️ 单个任务取消失败**不中断其余的**：它可能刚好跑完了，
        那就让回写去决定终态。已经跑完的取消不了 ——
        那时钱已经花在上游了，假装取消成功只会让用户以为不用付费。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 取消后的运行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }

  /scripts:
    post:
      tags: [script]
      operationId: createScript
      description: |
        建脚本并绑定到画布节点。

        ⚠️ **同一节点重复创建返回已有脚本**（AV-05 的"按节点恢复"），不是 409：
        用户重新打开节点时前端会再调一次创建，报冲突的话他会看到一个
        自己什么都没做错的失败提示。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScriptCreateRequest' }
      responses:
        '201':
          description: 已创建（或返回该节点已有的脚本）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scripts/{scriptId}:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: getScript
      responses:
        '200':
          description: 脚本详情（含镜头表）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [script]
      operationId: patchScript
      description: |
        改剧情输入、全片风格或推进步骤。带 `version` 乐观锁。

        ⚠️ 步骤推进在**服务端独立校验**（AV-18）：前端也会挡一道，
        但那是体验；直接打 API 绕过前端是最容易发生的事。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScriptPatchRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /projects/{projectId}/nodes/{nodeId}/script:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: nodeId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: getScriptByNode
      description: 打开画布节点时按节点恢复脚本。
      responses:
        '200':
          description: 脚本详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scripts/{scriptId}/storyboard:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: generateStoryboard
      description: |
        同步生成分镜：调文本模型、解析产出、整批替换镜头表。

        ⚠️ **结算晚于产出校验**：顺序是 `扣费 → 调模型 → 先解析 → 通过才落库`；
        调用失败或解析失败一律**全额退款**并留一条 failed 记录。
        老系统的顺序是「调模型 → 结算 → 解析」，解析失败时已经扣了费、
        库里落 0 个镜头 —— 用户看到一个空脚本和一笔说不清的消费。

        ⚠️ 失败之后**必须还能重新生成**：轮次按调用次数算（含失败），
        只按产出物算的话重试会命中上一次的 failed 记录，永远 40902。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoryboardRequest' }
      responses:
        '200':
          description: 已生成并落库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryboardResult' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '502':
          description: 模型调用失败或产出无法使用（已退款）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scripts/{scriptId}/llm-calls:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: listScriptLlmCalls
      description: 同步 LLM 调用记录，**逐项费用可对账**（含失败的那些）。
      responses:
        '200':
          description: 调用记录
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScriptLlmCall' }

  /scripts/{scriptId}/shots:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: addShot
      description: 插入一个镜头。`afterShotId` 为空表示插到最前面。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                afterShotId: { $ref: '#/components/schemas/Id' }
                durationSec: { type: integer, minimum: 1, maximum: 60, default: 5 }
                description: { type: string }
      responses:
        '200':
          description: 更新后的脚本（镜号已重排）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /scripts/{scriptId}/shots/order:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [script]
      operationId: reorderShots
      description: |
        按给定顺序重排镜号。

        ⚠️ **必须点全脚本下的所有镜头**：少传的话会有镜头留在临时号上，
        它们在列表里排到最前面而且谁也看不出为什么 —— 服务端整体回滚并报错。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shotIds]
              properties:
                shotIds:
                  type: array
                  items: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: 更新后的脚本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '400':
          description: 请求参数非法（例如重排时没点全所有镜头）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scripts/{scriptId}/shots/{shotId}:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/ShotId'
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [script]
      operationId: saveShot
      description: 保存镜头内容，带 `version` 乐观锁（AV-10）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShotSaveRequest' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shot' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [script]
      operationId: deleteShot
      responses:
        '200':
          description: 已删除（镜号已重排）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }

  /scripts/{scriptId}/shots/{shotId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/ShotId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: duplicateShot
      description: |
        复制一个镜头到它后面。

        ⚠️ 副本**不继承提示词状态**：提示词是按镜头内容算出来的，
        原样继承会让副本一上来就是 ready，而它其实从没被合成过 ——
        用户拿它去出图，出的是上一个镜头的画面。
      responses:
        '200':
          description: 更新后的脚本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }

  /scripts/{scriptId}/shots/{shotId}/move:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/ShotId'
      - $ref: '#/components/parameters/WorkspaceId'
      - name: direction
        in: query
        required: true
        schema: { type: string, enum: [up, down] }
    post:
      tags: [script]
      operationId: moveShot
      description: 上移/下移一个镜头。已在端点时**原样返回而不是报错**。
      responses:
        '200':
          description: 更新后的脚本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }

  /scripts/{scriptId}/assets:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: listScriptAssets
      description: 本脚本的资产（带质量提示）。
      responses:
        '200':
          description: 资产列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScriptAsset' }

  /scripts/{scriptId}/assets/reconcile:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: reconcileScriptAssets
      description: |
        按镜头实体与全片档案对账资产（AV-11），并按实体顺序重绑镜头引用。

        ⚠️ **归并范围是本脚本**，不是工作区全部资产。老系统按用户级同名匹配，
        新节点里的 `@唐僧` 命中数周前的记录，把别的节点的成品图**和 failed 状态
        一起**继承过来 —— 用户看到凭空出现的"生成失败"和一张不认识的占位图。
        跨脚本复用是用户手动挑选的动作（见 `POST /scripts/{scriptId}/shots/{shotId}/assets/{assetId}`）。

        ⚠️ 已 ready 或上传来源的资产**不覆盖描述**：用户可能已经把描述调好、
        甚至已经花钱出了图，覆盖等于把他的工作删掉。
      responses:
        '200':
          description: 对账结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileResult' }

  /scripts/{scriptId}/assets/generate:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: generateScriptAssets
      description: |
        批量生成资产图（AV-13）。**每项独立任务、独立扣费**，允许部分成功。

        ⚠️ 余额不足**停掉后续项**而不是逐项失败：逐项失败会给用户十条
        一模一样的"积分不足"，每条还占一次任务记录。前面已提交的照常跑。

        ⚠️ 已有资产图的**跳过而不是重做**：重做要再花一次钱，
        而用户点"批量生成"的意思是"把没有的补上"。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelCode]
              properties:
                modelCode: { type: string }
                assetIds:
                  type: array
                  items: { $ref: '#/components/schemas/Id' }
                  description: 为空表示"把所有未就绪的补上"
                params:
                  type: object
                  additionalProperties: true
                  description: |
                    画幅与画质，**只认 `aspect_ratio` / `quality`**，其余键丢弃（CD-77）。
                    ⚠️ 不放开任意键：资产图的版式由代码固定，带上 `preset` 之类的键会让服务端
                    再往提示词后面拼一段配方，把版式改掉。
      responses:
        '200':
          description: |
            逐项结果（含被跳过的与被停掉的）。

            ⚠️ 同一段描述**上一次失败**时，重试会真的再提交一次（换一把由那次失败推出来的幂等键）——
            此前同一把键永远指向那次失败，资产被标成 generating 而再也没有任务在跑（CD-77）。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssetBatchItem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /scripts/{scriptId}/shots/{shotId}/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/ShotId'
      - name: assetId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: attachScriptAsset
      description: |
        把资产库里已有的资产挂到某个镜头上 —— **跨脚本复用的唯一入口**（AV-20）。
        它是用户的显式动作；自动识别永远只在本脚本内归并。

        重复挂同一个资产**原样返回而不是报错**（重复点击不该失败）。
      responses:
        '200':
          description: 更新后的脚本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scripts/{scriptId}/prompts:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: listScriptPrompts
      description: |
        列出全片每一镜的图片/视频提示词与**有效状态**（AV-16）。

        ⚠️ `status` 是服务端**算出来的**，不是库里存的那一列：库里可能还停在
        `ready`，而用户之后改过镜头描述、资产档案或全片风格。判定靠合成时
        记下的上游指纹（`shot.image_prompt_fingerprint` / `video_prompt_fingerprint`）
        与当前上游比对 —— 只靠"改动时主动标 stale"的话，漏掉任何一个调用点
        都不会有编译错误，症状是用户拿着一段过时的词去出图、画面里的角色
        还是旧的样子，而界面上一切正常。

        ⚠️ `stale` **不是失败**：那段词还在、还能用。直接清空或标 failed
        会把用户自己改过的词删掉。
      responses:
        '200':
          description: 提示词列表（按镜号、种类排序）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShotPrompt' }

  /scripts/{scriptId}/prompts/compose:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: composeScriptPrompts
      description: |
        批量合成提示词（AV-15 / AV-17）。三种来源：

        - `ai` —— 调文本模型合成，**收费**，同步执行（产出是结构化文本，
          走 MQ 只多一层状态同步）。
        - `template` —— 完全由代码拼，**0 积分**：没有调用上游，收费没有依据。
        - `manual` —— 用户手写，见 `PUT .../prompts/{kind}`。

        ⚠️ `dryRun=true` 只报价不执行。**费用必须由服务端报价**（GAP-21）：
        老系统前端按「选中数 × 6」写死估算，而后端按定价目录算 ——
        用户看到的价和实际扣的钱不是一回事。

        ⚠️ 已 `ready` 且上游未变的**跳过**（`force` 除外）：重算要再花一次钱，
        而"批量合成"的语义是"把没有的和过期的补上"。

        ⚠️ 并发有上限（5）：同步 LLM 一次并发太多会撞上游账号级限流，
        换回来一批 429 —— 而那时每一条都已经扣过费了。

        失败项**不影响其他项**，各自退款；响应逐项给出结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  enum: [ai, template]
                modelCode:
                  type: string
                  description: source=ai 时必填
                shotIds:
                  type: array
                  items: { $ref: '#/components/schemas/Id' }
                  description: 为空表示全片
                kinds:
                  type: array
                  items: { type: string, enum: [image, video] }
                  description: 为空表示两种都合成
                force:
                  type: boolean
                  description: 为真时连已就绪的也重算（用户显式点"重新生成"）
                dryRun:
                  type: boolean
                  description: 只报价不执行，也不扣费、不写库
      responses:
        '200':
          description: 报价与逐项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComposeResult' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /scripts/{scriptId}/shots/{shotId}/prompts/{kind}:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/ShotId'
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [image, video] }
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [script]
      operationId: saveShotPrompt
      description: |
        手写/编辑单条提示词（AV-16），`source` 记为 `manual`、状态置 `ready`。

        ⚠️ 手写的词**也记当前上游指纹**：不记的话用户之后改了镜头描述，
        这条词永远显示 ready —— 手写不代表它不会过期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, version]
              properties:
                text: { type: string, maxLength: 20000 }
                version:
                  type: integer
                  description: 镜头乐观锁版本；不匹配返回 409
      responses:
        '200':
          description: 更新后的镜头
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shot' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scripts/{scriptId}/groups:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: listScriptGroups
      description: 列出脚本下的全部组节点。
      responses:
        '200':
          description: 组列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupSummary' }
    post:
      tags: [script]
      operationId: createGroup
      description: |
        建组（AV-23）。两种组的**提交时机故意不同**：

        - `storyboard_image` —— **建组即提交**。一张图几积分、参数几乎没得调，
          多一步确认只是多一次点击。
        - `video_generator` —— **先落 draft**。一条视频几十积分，且输入编排
          （首帧用哪张、参考图给几张）直接决定成片 ——
          建组就提交等于让用户为一批他还没看过的输入付钱。
        - `asset` —— 只把已有资产聚合展示，不产生新任务。

        ⚠️ **只收提示词已就绪的镜头**：没有词的镜头提交上去就是一张
        与剧情无关的图，而钱照扣。一个都不就绪时报出是哪几镜。

        ⚠️ 同一个画布节点重复建组**返回已有的那个**而不是 409（同 AV-05）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupType, canvasNodeId]
              properties:
                groupType:
                  type: string
                  enum: [asset, storyboard_image, video_generator]
                canvasNodeId: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 64 }
                shotIds:
                  type: array
                  items: { $ref: '#/components/schemas/Id' }
                  description: 为空表示全片
                modelCode:
                  type: string
                  description: 分镜图组建组即提交，因此必填
                operation:
                  type: string
                  description: 视频组的默认操作；为空时由 videoPlan 决定
                durationSec:
                  type: integer
                  description: 视频组整组的默认时长；为 0 时每一镜用镜头自己的时长
                params:
                  type: object
                  additionalProperties: true
                  description: |
                    整组共用的生成参数，写进每个子项的快照（CD-77）。**只认**：分镜图组 `aspect_ratio` / `quality`；
                    视频组 `aspect_ratio` / `resolution` / `audio`。其余键丢弃 —— 提示词由服务端按镜头拼，
                    带上 `prompt` / `preset` 会把它顶掉或再拼一段配方。
                durations:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                  description: |
                    视频组逐镜时长（镜头 ID → 秒），优先于 `durationSec`。写进子项快照的 `duration` 键 ——
                    那是各家视频协议读的键；执行时**计价与出片用同一个数**（CD-77）。
      responses:
        '200':
          description: 建好的组（含子项）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: getGroup
      description: |
        取组及其子项（AV-24/AV-25）。

        ⚠️ 组的 `status` 是按子项**算出来的**：`partial_success` 是一个
        独立状态，部分失败**不能被摊平成 success** —— 显示成 success，
        用户不会去翻那一条失败的；显示成 failed，他会把已经成功的
        也重跑一遍。两种都在花他的钱。

        有运行中子项时前端约 1.5 秒刷新一次。
      responses:
        '200':
          description: 组详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/nodes/{nodeId}/group:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: nodeId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: getGroupByNode
      description: 按画布节点取组 —— 用户重新打开节点时走这里（同 AV-05）。
      responses:
        '200':
          description: 组详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{groupId}/execute:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: executeGroup
      description: |
        执行整组或指定子项（AV-23）。

        ⚠️ **每项独立受理、独立扣费**（AV-22）：一项失败不影响别的项，
        用户可以只重试失败的那几个。整批一次扣费的话，重试就得整批重来。

        ⚠️ 余额不足**停掉后续项**而不是逐项失败：逐项失败会给用户一串
        一模一样的"积分不足"。前面已提交的照常跑。

        ⚠️ 已成功的**跳过**（`force` 除外）；`stale` 的**不跳过** ——
        它恰恰是需要用新快照重跑的那些。

        ⚠️ 必须带组 `version`（FLOW §5.2）：两个人同时点"执行"，
        没有乐观锁就是两批任务、两份钱。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelCode, version]
              properties:
                modelCode: { type: string }
                operation: { type: string }
                durationSec: { type: integer }
                version: { type: integer, description: 组的乐观锁版本 }
                force: { type: boolean, description: 连已成功的也重跑 }
                itemIds:
                  type: array
                  items: { $ref: '#/components/schemas/Id' }
                  description: 为空表示整组
      responses:
        '200':
          description: 执行后的组（逐项状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /groups/{groupId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [script]
      operationId: saveGroupItem
      description: |
        编辑子项的参数与输入（视频组 draft 期间）。

        ⚠️ 只允许改 `draft` / `failed` / `stale` 的项：已经在跑或已成功的项
        改了参数，库里存的就不再是那次任务真正用过的输入 ——
        而排查"为什么出来的图不对"时，快照是唯一的证据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params: { type: object, additionalProperties: true }
                inputs:
                  type: array
                  items: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 更新后的子项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupItem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /groups/{groupId}/items/{itemId}/retry:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: retryGroupItem
      description: |
        重试单个子项（AV-22）。

        ⚠️ **只重跑这一项、只扣这一项的钱**。整组重跑会把已经成功的
        也重做一遍 —— 那是在花用户的钱做他没要的事。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelCode, version]
              properties:
                modelCode: { type: string }
                durationSec: { type: integer }
                version: { type: integer }
      responses:
        '200':
          description: 重试后的组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '409': { $ref: '#/components/responses/Conflict' }

  /groups/{groupId}/cancel:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: cancelGroup
      description: |
        取消组内还在跑的子项。

        ⚠️ **逐项取消**而不是"把组标成 cancelled 了事"：组状态是算出来的，
        真正占着上游资源、真正要退款的是那些 generation。
        某一项取消失败不中断其余项（它可能刚好跑完了）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemIds:
                  type: array
                  items: { $ref: '#/components/schemas/Id' }
                  description: 为空表示全部在跑的
      responses:
        '200':
          description: 取消后的组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }

  /groups/{groupId}/ungroup:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [script]
      operationId: ungroup
      description: |
        解组（AV-26）：把子项 materialize 成独立画布节点。

        ⚠️ 服务端**不直接改 `project.canvasData`**，只把组标成 `ungrouped`
        并返回节点描述，由前端放进画布后走正常的乐观锁保存。
        画布数据归客户端所有、靠版本号保护（FLOW §5.1）——
        服务端在客户端不知情时改它，会和它的自动保存对撞，
        结果是用户刚画的连线**静默消失**。节点坐标也只有前端知道该放哪。

        ⚠️ 组行与子项行**保留不删**：前端存盘前崩了的话，这些描述还能
        再取一次；删掉就成了既没有组也没有节点的孤儿产物。

        ⚠️ 运行中不许解组：子项一旦变成独立节点，回写就找不到落点了 ——
        任务照样跑完、照样扣钱，而用户在画布上看不到任何结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: 待 materialize 的节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UngroupResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /scripts/{scriptId}/export:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [script]
      operationId: exportScript
      description: |
        导出脚本全量 JSON（AV-19）。响应带 `Content-Disposition: attachment`。

        ⚠️ 导出的形状是**对用户的承诺**，不是内部结构的投影：文件会被下载、
        被改、被别人拿去用。直接序列化仓储结构体的话，哪天加一个内部列
        （指纹、乐观锁版本）就会漏进用户的文件，而删一个列会让他早先
        导出的文件对不上。

        ⚠️ `schemaVersion` 描述的是"文件长什么样"，与脚本的乐观锁
        `version`（"数据改到第几次了"）是两件事，不可混用。

        ⚠️ 导出的是**当前状态的快照**，包含未完成与失败的部分。
        只导成功的那些看起来更干净，但用户下载脚本正是为了留档和排查 ——
        把失败项藏起来，他就无从知道哪一镜没出来、为什么。

        ⚠️ 资产只给 `mediaId` **不给 URL**：签名地址几小时就失效，
        写进导出文件等于给用户一堆第二天就打不开的链接。
      responses:
        '200':
          description: 完整脚本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScriptExport' }
        '404': { $ref: '#/components/responses/NotFound' }

  /script-assets:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: type
        in: query
        schema: { type: string, enum: [character, scene, prop] }
      - name: keyword
        in: query
        schema: { type: string }
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [script]
      operationId: listAssetLibrary
      description: |
        工作区级资产库（AV-20）。⚠️ 它**只用于用户手动挑选**，
        绝不参与自动识别的同名归并。
      responses:
        '200':
          description: 资产库
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScriptAsset' }

  /script-assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [script]
      operationId: saveScriptAsset
      description: |
        编辑资产（AV-12）。

        ⚠️ 质量提示（`lints`）**随响应回去而不是拦住请求**：名字没语义、
        描述里写了别人的名字都是质量问题不是错误，拦下来用户就走不下去了。
        真正非法的输入（空名、未知类型）仍然拦。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: [string, 'null'], enum: [character, scene, prop, null] }
                name: { type: [string, 'null'] }
                description: { type: [string, 'null'] }
                profile: {}
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScriptAsset' }
        '400':
          description: 请求参数非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /script-assets/{assetId}/media:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      tags: [script]
      operationId: attachScriptAssetMedia
      description: |
        把已上传的图绑成资产图（AV-12 的"上传替换"）。
        文件本身走 `POST /media/references` 上传 —— 那里按**实际文件头**
        识别类型、校验大小、登记归属。这里只做绑定与类型白名单（PNG/JPEG/WebP，≤20 MiB）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId, contentType, sizeBytes]
              properties:
                mediaId: { $ref: '#/components/schemas/Id' }
                contentType: { type: string }
                sizeBytes: { type: integer }
      responses:
        '200':
          description: 已绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScriptAsset' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  # ==================== 上传 ====================
  /media/references:
    post:
      tags: [media]
      operationId: uploadReference
      description: |
        参考文件上传。服务端必须校验**实际文件头**与声明 MIME 一致（声明 MIME 不可信，GO-28）、
        大小上限、归属。上限在反向代理、HTTP server 和领域校验器三层各配一次。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                projectId:
                  type: string
                  description: |
                    当前实现**不读取**，保留兼容（MKT-T-01）。创造页与营销页都在建项目之前上传，
                    归属按 `X-Workspace-Id` 登记，不依赖项目。
                nodeId:
                  type: string
                  description: 当前实现**不读取**，保留兼容（MKT-T-01）。
                mediaType:
                  type: string
                  enum: [image, audio, video]
                  description: 可选。缺省时按实际文件头识别；给了则须与文件头一致。
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadReference' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /projects/{projectId}/nodes/{nodeId}/resolve-inputs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: nodeId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [project]
      operationId: resolveNodeInputs
      description: |
        把客户端声明的输入解析成**可信、有序、类型兼容**的清单，用于生成前预检。

        ⚠️ **只接受可信资源 ID**（generationId / referenceId / materialCode / voiceCode）。
        **不接受 URL 或 objectKey**（GO-27）—— 那等于让调用方自己声明"我有权限"。
        服务端自己去查每个 ID 是什么、属于谁、就绪没有。

        ⚠️ **收集全部问题再返回**，不是遇到第一个就退出：用户希望一次看清所有要改的地方。
        `resolvable=false` 时前端据此禁用生成按钮并逐条说明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, inputs]
              properties:
                operation: { type: string }
                inputs:
                  type: array
                  items:
                    type: object
                    required: [kind]
                    properties:
                      kind:
                        type: string
                        enum: [text, generation, reference, material, voice]
                      order:
                        type: integer
                        description: 画布连线的顺序。**决定首尾帧的首/尾与参考图锚定顺序**，同一目标内唯一
                      sourceNodeId: { type: string }
                      text: { type: string }
                      generationId: { $ref: '#/components/schemas/Id' }
                      referenceId: { $ref: '#/components/schemas/Id' }
                      materialCode: { type: string }
                      materialType: { type: string, enum: [style, effect] }
                      voiceCode: { type: string }
                      rangeMs:
                        type: array
                        items: { type: integer, minimum: 0 }
                        minItems: 2
                        maxItems: 2
                        description: |
                          只用素材的哪一段：`[起点, 终点]`（毫秒，左闭右开；docs/agent/smartcut SCD-34）。
                          只对视频 / 音频引用有效，至少 100 毫秒、不超出素材时长。受理按这一段计价（不收客户端报的时长），
                          Worker 发给上游前截出这一段。
      responses:
        '200':
          description: 解析结果
          content:
            application/json:
              schema:
                type: object
                required: [inputs, issues, resolvable]
                properties:
                  resolvable: { type: boolean }
                  inputs:
                    type: array
                    items: { type: object, additionalProperties: true }
                  promptSuffix:
                    type: string
                    description: 素材贡献的提示词后缀。**在服务端拼接**，前端不参与
                  issues:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        nodeId: { type: string }
                        order: { type: integer }
                        code:
                          type: string
                          enum: [upstream_not_ready, type_mismatch, count_mismatch,
                                 order_conflict, not_found, forbidden, range_invalid]
                        message: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/media:
    post:
      tags: [media]
      operationId: adminUploadMedia
      description: |
        管理端上传**平台级**素材（Banner 图、素材封面、水印图），落在工作区 0，所有登录用户可读。
        与用户上传同一套校验：**实际文件头**与声明 MIME 一致、大小上限（GO-28）。

        `purpose` 只收平台级取值；用户侧用途（`upload_reference` 等）落在工作区 0 上没有意义，
        在入口回 400 —— 不拦的话会撞上表的 CHECK 约束，表现为 500。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                purpose:
                  type: string
                  enum: [banner, material_cover, avatar]
                  default: material_cover
                expectKind: { type: string, enum: [image, audio, video] }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema:
                type: object
                required: [id, contentType, sizeBytes, url]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  contentType: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  url:
                    type: string
                    description: |
                      **用户端**读取地址（`/api/v1/media/{id}`）。管理端自己预览要走
                      `/admin/media/{id}`：admin token 在用户端路由上是 401。
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /admin/media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [media]
      operationId: adminDownloadMedia
      description: |
        管理端读取**平台级**素材（P15-05）。此前管理端只有上传没有读取，传上去的 Banner 图、
        水印图在后台一张都看不到。

        ⚠️ 工作区**固定为 0**：归属条件是「本工作区 或 工作区 0」，所以这条路**只取得到平台级素材**，
        用户的私有产物一律 404。管理端不能借它按 ID 翻用户文件 —— 那需要单独的授权与审计。
      parameters:
        - name: w
          in: query
          description: 缩略图宽度，同 `/media/{mediaId}`（只接受 160/320/640）。
          schema:
            type: integer
            enum: [160, 320, 640]
      responses:
        '200':
          description: 文件字节
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /media:
    get:
      tags: [media]
      operationId: listMyMedia
      description: 我上传的参考文件（个人资产选取）。按工作区隔离。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          schema: { type: string, enum: [image, audio, video] }
      responses:
        '200':
          description: 媒体分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, kind, mime, sizeBytes]
                          properties:
                            id: { $ref: '#/components/schemas/Id' }
                            kind: { type: string }
                            mime: { type: string }
                            sizeBytes: { type: integer }
                            createdAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [media]
      operationId: downloadMedia
      description: |
        受保护读取。**按 workspace 校验归属**：不是本工作区的资源一律 403，
        未登录 401（FE-06）。平台级素材（封面、试听）workspace 为 0，登录即可读。

        ⚠️ `<img src>` 与 `<a href>` **不会带 Authorization 头**，直接引用一律 401（CD-16）——
        前端必须 fetch 成 blob 再转 object URL，并在卸载时 `revokeObjectURL`，
        否则每翻一页就在内存里留一份完整图片。
      parameters:
        - name: w
          in: query
          description: |
            缩略图宽度。**只接受 160/320/640 三档** —— 开放任意值等于给人一个
            URL 参数把 CPU 打满。非位图（视频/音频/解不出来的格式）**原样返回**：
            缩略图是优化，不能让本来能显示的东西显示不了。
          schema:
            type: integer
            enum: [160, 320, 640]
      responses:
        '200':
          description: 文件字节
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [media]
      operationId: deleteMedia
      description: |
        删除媒体。⚠️ **被活动引用占用时返回 `40906`，不是静默成功** ——
        删掉一个正在被进行中任务引用的文件，任务会在 Worker 那侧取不到输入而失败，
        而用户以为自己只是清理了一张图。

        删除是软删：置 `deleted_at` 后由清理队列按「无引用 且 超保留期」真正回收对象存储。
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /media/{mediaId}/usages:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [media]
      operationId: listMediaUsages
      description: 谁在引用这个媒体。删不掉时用它告诉用户**具体是什么**占着。
      responses:
        '200':
          description: 引用列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [usageType, usageRefId]
                  properties:
                    usageType:
                      type: string
                      description: project_cover / generation_input / script_asset / timeline_clip …
                    usageRefId: { $ref: '#/components/schemas/Id' }
                    createdAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /media/{mediaId}/preview-assets:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [media]
      operationId: getPreviewAssets
      description: |
        剪辑台预览用的派生素材（SCD-30）：低清预览版、缩略图拼图、波形峰值、节拍。
        Worker 按素材生成并缓存，同一素材只做一次；还没生成好时对应字段为空、`status` 说明进度。
        ⚠️ 预览只加载预览版，不加载原片：媒体下载要整份读进内存，几百 MB 的上传视频会把标签页撑爆。
      responses:
        '200':
          description: 预览素材
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewAssets' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /media/{mediaId}/info:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [media]
      operationId: getMediaInfo
      description: |
        媒体元信息（尺寸、类型、派生溯源）。

        ⚠️ 与下载端点分开是必须的：下载出的是字节，前端从图片本身
        **拿不到原图像素尺寸**（浏览器解出来的是缩放后的显示尺寸），
        而尺寸是蒙版能不能对齐的唯一依据（CD-46）。

        ⚠️ 仍然**不回 bucket / objectKey**：调用方拿不到定位信息，
        就不可能绕过受保护读取直接取对象（GO-27）。

        `sourceMediaId` 只在这份媒体是派生件（宫格切块）时出现。
        ⚠️ 源图可能已被删除 —— 那不是错误，只是溯源到此为止（NEW-16）。

        `posterMediaId` 只对视频给出：Worker 截的封面帧（CD-83），前端靠它不下载整段视频就能显示画面、
        按真实比例摆卡片（Agent 面板 design/03 R-5）。还没截出来时不给。视频自己的宽高上传时没探测，
        此时 `width` / `height` 取自封面帧（按原尺寸截的，比例就是视频的比例）。
      responses:
        '200':
          description: 元信息
          content:
            application/json:
              schema:
                type: object
                required: [id, mime, kind, sizeBytes, width, height]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  mime: { type: string }
                  kind: { type: string, enum: [image, audio, video] }
                  sizeBytes: { type: integer }
                  width: { type: integer, description: '0 表示未知（格式不认识）' }
                  height: { type: integer }
                  durationMs:
                    type: integer
                    description: |
                      音视频时长（毫秒）。0 表示未知（非音视频，或 ffprobe 没装/认不出）。
                      ⚠️ 时间线的裁切校验靠它 —— 没有时长就没法判断"取到 30 秒"
                      是不是超出了一段 10 秒的素材，而超出的后果是成片里一段黑屏。
                  sourceMediaId: { $ref: '#/components/schemas/Id' }
                  deriveKind: { type: string, enum: [grid_tile] }
                  deriveIndex: { type: integer, minimum: 1 }
                  posterMediaId: { $ref: '#/components/schemas/Id' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /media/{mediaId}/grid-split:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [media]
      operationId: splitMediaGrid
      description: |
        宫格切分（NEW-14）：把一张图切成 rows×cols 块，每块落成**独立媒体对象**，
        切完就能作为下一次生成的输入。

        ⚠️ **不走生成链路**：没有模型、没有上游、没有费用 —— 它是一次本地像素搬运。
        塞进 generation 会凭空多出一条永远 0 积分、永远同步完成的"任务"。

        ⚠️ **幂等**：同一张源图、同一种格数重复调用返回已有的那一批，不会越切越多。

        ⚠️ 派生关系是**逻辑外键且不级联**：源图删了，切块仍然有效（NEW-16）。
        切块是一份独立的字节，`sourceMediaId` 只是溯源线索。

        可切分 PNG / JPEG / GIF（标准库有解码器的三种）；WebP 返回 `41501`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows, cols]
              properties:
                rows: { type: integer, minimum: 1, maximum: 8 }
                cols: { type: integer, minimum: 1, maximum: 8 }
      responses:
        '201':
          description: 切分结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridSplitResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/BadRequest' }

  /media/{mediaId}/grid-tiles:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [media]
      operationId: listMediaGridTiles
      description: 取回已切好的块（刷新页面后要能拿回来）。
      parameters:
        - name: rows
          in: query
          required: true
          schema: { type: integer }
        - name: cols
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 切块列表
          content:
            application/json:
              schema:
                type: object
                required: [tiles]
                properties:
                  tiles:
                    type: array
                    items: { $ref: '#/components/schemas/GridTile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /exports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [media]
      operationId: createExport
      description: |
        批量导出（NEW-15、GAP-12、GAP-18）：服务端**异步打包**成 ZIP，
        打好的包本身也是一个媒体对象，下载仍走 `/media/{mediaId}` 那个受保护端点。

        ⚠️ 旧系统的"全部下载"是前端逐项 `a.href` 直链（GAP-18）：`<a href>`
        不带 Authorization 头，那条路只有把桶开成公开才走得通。改成任务化之后，
        进度、失败原因与过期清理才有地方表达。

        ⚠️ 导出**不扣积分**：没调用任何上游，只是把已经属于用户的字节重新装箱。

        受理时逐项校验归属并累计源文件大小；单次最多 200 项、合计 2 GiB。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [mediaId]
                    properties:
                      mediaId: { $ref: '#/components/schemas/Id' }
                      name:
                        type: string
                        description: |
                          建议文件名（不含扩展名）。服务端会清洗路径分隔符、
                          去重同名（`封面 (2).png`）并按 MIME 补扩展名。
      responses:
        '202':
          description: 已受理，异步打包
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [media]
      operationId: listExports
      description: 导出历史（按工作区隔离）。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 导出分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ExportTask' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [media]
      operationId: getExport
      description: 轮询打包进度。终态为 `success` / `failed`，包被清理后显示 `expired`。
      responses:
        '200':
          description: 导出任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportTask' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- 画布 Agent（AGT-26，dev/02 §4）
  # 会话类路由过工作区闸（GET → view，其余 → edit）；只读成员调写接口 403/40303。
  # 同工作区成员都能查看会话，只有发起人能继续对话 / 提交卡片（403/40306）。
  # 总开关 SEEAITV_AGENT_ENABLED=false 时以下全部 404/40402 AGENT_DISABLED。
  /agent/preferences:
    get:
      tags: [agent]
      operationId: getAgentPreferences
      description: 用户级模型偏好（视频 / 图片 / 推理模型与上次模式）。只要登录，不属于任何工作区；没设过返回 `{}`。
      responses:
        '200':
          description: 偏好
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPreferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [agent]
      operationId: putAgentPreferences
      description: 整份写入用户级偏好（原样保存，保留前端未知字段；上限 16 KiB）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentPreferences' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/skills:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [agent]
      operationId: listAgentSkills
      description: |
        启用的技能（分类、快捷入口）。需要 view。

        按场景过滤（MKT-T-05、MKT-AC-15）：`general`（缺省，「创造」页）列 `scenes` 为空或含
        `general` 的技能 —— 即**不列仅属营销的技能**；`marketing` 只列含 `marketing` 的。
        非法 scene 回 400。响应只增不减：不带 scene 时与此前同一批技能、同一批字段。
      parameters:
        - name: scene
          in: query
          required: false
          schema: { type: string, enum: [general, marketing], default: general }
      responses:
        '200':
          description: 技能列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentSkill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/skills/{code}/cover:
    get:
      tags: [agent]
      operationId: agentSkillCover
      security: []
      description: |
        技能封面公开取图，**不需要登录**（MKT-T-05、MKD-19）：营销页未登录也能浏览技能预览卡。
        只受 `SEEAITV_AGENT_ENABLED` 总开关控制（关闭时 404 AGENT_DISABLED）。

        ⚠️ 技能**已启用且配了封面**才出图；停用、不存在、没封面回**同一个 404**
        （区分开等于告诉访客「曾经有过这个技能」）。
        ⚠️ 默认给缩略图（`w=320`）；响应带 `Cache-Control: public, max-age=300` ——
        缓存期就是停用后「撤不下来」的窗口。
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: w
          in: query
          description: 缩略图宽度，只接受 160/320/640。
          schema: { type: integer, enum: [160, 320, 640] }
      responses:
        '200':
          description: 图片字节
          content:
            image/*: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/sessions:
    post:
      tags: [agent]
      operationId: createAgentSession
      description: |
        建会话并写首条用户消息、建第一轮、入队（一轮在 Worker 里跑，这里立刻返回）。
        `projectId` 与 `createProject` 二选一：后者在同一个 `Idempotency-Key` 下顺带建一个空项目（创造页）。

        同一工作区 + `Idempotency-Key` 重复或并发请求只建 1 个会话 1 个轮（200 + `replayed=true`）；
        缺头 400/40002。引用 `refs` 只收 ID（节点 / 素材 / 资产），按工作区校验归属，**不接收地址**（GO-27）。

        **营销会话**（`scene=marketing`，MKT-T-17）：必须带 `createProject`（项目 `origin=marketing`），不能挂到已有项目；
        引用带 `slot`（product / character / source_video）与槽内 `order`；`marketing.picks` 只给 code，版本由服务端钉住。
        全部校验在建项目与扣第一轮费用之前：槽位缺失 / 超量 / 类型不符 → 400/40001 且 `details.slot` 点名槽位；
        选项不在投 / 不存在 → 422/42215（`details:{kind, code, reason, userFixable}`）；营销总开关关闭 → 400/40001（`details.field=scene`）。
        通用会话带 `marketing`、引用带 `slot` / `order` 或 `kind=marketing_product|marketing_character` 一律 400。

        **商品库与角色库**（MKT-T-37，dev/05 MKD-25~27）：商品槽恰好 1 个 `kind=marketing_product`（技能声明商品可选时 0~1），
        角色槽 `kind=marketing_character` / `asset` 合计 ≤ 2（`/marketing/config` 的 `maxCharacterRefs`）。服务端按工作区取
        商品 / 角色的当前内容，**冻结成快照**写进 `sceneInput`（商品图展开成 `products`，名称 / 卖点 / 描述进 `product`，
        角色库角色快照成主图 `kind=media` 并带 `characterId` / 名称 / 形象 / 音色 / 参考音频）；之后编辑或删除商品、角色
        不影响已建会话。他人工作区 / 已删除 / 不存在 → 400/40001 `details{slot, code:"not_found"}`。
        **旧请求形状一律拒绝**：请求体出现 `marketing.product`（`details{field:"marketing.product", code:"legacy_shape"}`）、
        商品槽或角色槽给 `kind=media`（`details{slot, code:"legacy_shape"}`）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreateSessionRequest' }
      responses:
        '201':
          description: 已建会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteResult' }
        '200':
          description: 幂等重放，返回已建的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /agent/prompt-optimize:
    post:
      tags: [agent]
      operationId: optimizeAgentPrompt
      description: |
        一键优化提示词（AGT-43，创造页输入框右上角）：在 API 进程里**同步**调一次推理模型，把正文改写得更具体。
        结果只回给前端，由用户以「替换 / 保留原文」确认 —— **不改任何用户数据**、不建会话。

        按轮计费：报价同 Agent 对话（operation=`agent_chat`，所选推理模型的每轮单价），账本 refType=`agent_turn`、
        refId=本次调用记录的 id（每次点击一条新记录，失败也保留）。模型出错 / 返回空内容 / 超长 → 502 且**全额退款**
        （账本 consume + refund 各一条）。余额不足 422/42201（带 required / balance / shortfall），不扣费。

        同一工作区 + 发起人 + `Idempotency-Key`：成功过的原样返回（`replayed=true`，不再扣费）；
        仍在进行 / 已失败的返回 409（失败的请换新键重新点）。缺头 400/40002。需要 edit（只读成员 403）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentPromptOptimizeRequest' }
      responses:
        '200':
          description: 改写结果（或同键重放的那一次结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPromptOptimizeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '502':
          description: 模型调用失败或没有返回可用内容（已全额退款）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{projectId}/agent/sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [agent]
      operationId: listProjectAgentSessions
      description: 本项目的会话（含他人发起的，带发起人），最近活跃在前。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/AgentSessionId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [agent]
      operationId: getAgentSession
      description: |
        会话详情：状态、todo、额度与已花、待处理卡片、最近一轮、最后 20 条消息（含步骤与卡片）。
        事件（`agent.*`）只是对账信号，前端收到后以本接口为准（AG-16）。不存在或跨工作区 404/40403。
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSessionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [agent]
      operationId: patchAgentSession
      description: |
        改标题、会话级偏好（发起人或工作区管理员）。`prefs` 整份替换。
        请求体严格解码：`scene` / `sceneInput` 等其他键一律 400 —— 会话场景建后不可改（MKT-T-17）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                prefs: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 改后的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentSessionId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [agent]
      operationId: listAgentMessages
      description: |
        消息分页（往更早翻）：`cursor` 取上一页的 `nextCursor`（本页最小 seq），首页不传。
        本页按 seq 升序，并带出本页涉及的步骤、卡片与轮次。
      parameters:
        - { name: cursor, in: query, schema: { type: string, pattern: '^[0-9]+$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: 一页消息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMessagePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [agent]
      operationId: postAgentMessage
      description: |
        发消息（只有发起人）。会话正在运行时也可以发：不迁移状态，排队为下一轮（`queued=true`）。
        挂起时直接发消息：规划确认卡作废并回到规划（不会直接进入执行）；追加额度卡未处理则回到执行；
        选择 / 问答卡保持待处理、回到发卡前的状态。会话已取消 409/40909。
        同一会话 + `Idempotency-Key` 只建一个轮次（200 + `replayed=true`）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentPostMessageRequest' }
      responses:
        '201':
          description: 已写入并入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteResult' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agent/sessions/{sessionId}/cards/{cardId}/submit:
    parameters:
      - $ref: '#/components/parameters/AgentSessionId'
      - name: cardId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [agent]
      operationId: submitAgentCard
      description: |
        提交卡片（只有发起人）。规划确认 / 追加额度也走这里（`submission.decision: approve|adjust|reject`）。
        提交生成一条**具体内容**的用户消息（「我选择了：方向 1 悲壮离别」）。

        - 卡片已提交 / 作废 / 过期：409/40908，**不新建轮次**（重复提交幂等）。
        - 规划确认卡 `approve`：服务端**重新报价**。合计与卡片不一致 → 把新报价写回卡片并 409/40901，
          `details = {reason: price_changed, items, total, previousTotal, balance}`，不按新价格批准；
          余额不足 → 422/42201，`details = {required, balance, shortfall}`；
          规划文档在确认前被修改过 → 卡片作废、会话回到规划，409/40908 `details.reason = plan_doc_changed`。
          通过后额度 = 卡片合计（不加缓冲）。
        - 规划确认卡 `approve` 可带 `itemOverrides`（`AgentPlanItemOverride[]`，只限营销条目，MKT-T-20）：确认前换图。
          服务端按覆盖重算商品图与输入计数后**重新报价**：合计变了同样 409/40901（新报价连同换后的图写回卡片），
          不按新价格静默批准；合计不变则批准，卡片 payload 即「已批准计划」（换后的图）。键不存在、序号越界 / 重复、
          超过 `imageLimit` → 400/40001。带了因营销选项不可用的条目（`blockedCode = MARKETING_OPTION_UNAVAILABLE`）→ 422/42215。
          `itemOverrides` 只能随规划确认卡的 `approve` 提交。
        - 规划确认卡 `approve` 时卡片上的不同 `variant` 数超过 `SEEAITV_MARKETING_MAX_VARIANTS`（默认 4，MKT-T-27）→
          400/40001，`details = {reason: too_many_variants, max, variants}`（`submit_plan` 超上限本就不出卡，这里是兜底）。
        - 规划确认卡 `adjust`：卡片作废、回到规划；`reject`：回到 idle，不再扣费。
        - 追加额度卡 `approve`：额度 += 追加额；`reject`：回到 idle。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submission]
              additionalProperties: false
              properties:
                submission:
                  type: object
                  additionalProperties: true
                  description: |
                    选择卡 `{selected:[optionId], other?}`；问答卡 `{answers:[{questionId, selected?, other?, text?}]}`；
                    确认类卡 `{decision, comment?}`（adjust 必须带 comment）；规划确认卡 approve 另可带
                    `itemOverrides`（见 `AgentPlanItemOverride`）。未知字段一律拒绝。
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSubmitResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /agent/sessions/{sessionId}/stop:
    parameters:
      - $ref: '#/components/parameters/AgentSessionId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [agent]
      operationId: stopAgentSession
      description: |
        停止当前轮（AG-19）：只写停止标记，Worker 在下一次流式回调或工具调用前结束本轮，已输出的文字保留。
        **已提交的生成任务不自动取消**，响应里列出未终态的任务，前端逐个给「取消」。
      responses:
        '200':
          description: 已请求停止
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStopResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agent/sessions/{sessionId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AgentSessionId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [agent]
      operationId: cancelAgentSession
      description: |
        取消会话（终态）：之后的消息与卡片提交一律 409/40909，待处理卡片作废。
        `cancelTasks=true` 时逐个取消未终态的生成任务（退款由任务的取消路径负责，只退一次）；
        否则在 `remainingTasks` 里列出。重复取消返回当前结果。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cancelTasks: { type: boolean, default: false }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCancelResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/sessions/{sessionId}/turns/{turnId}/ledger:
    parameters:
      - $ref: '#/components/parameters/AgentSessionId'
      - name: turnId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [agent]
      operationId: getAgentTurnLedger
      description: |
        本轮对账：对话费（refType=agent_turn）/ 生成费（本轮提交的生成任务）/ 退回，三项**全部来自账本**
        并附逐笔流水。退回单列，**不从花费里减**。
      responses:
        '200':
          description: 本轮账本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTurnLedger' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== 管理端 Agent 技能配置（AGT-60） ====================
  # 权限 agent:read / agent:write。不受 Agent 总开关影响（上线前要能先配好）。
  # ⚠️ 没有删除技能的端点：历史会话的 skill_codes 要能追溯，只停用。
  /admin/agent/tools:
    get:
      tags: [admin-agent]
      operationId: adminListAgentTools
      security: [{ adminBearer: [] }]
      description: |
        工具白名单的可选项（来自服务端工具规格表，不在前端写死）与正文可用的渲染变量。
        `planning` / `executing` 说明该工具在哪个会话状态下会下发 —— 白名单**只能收窄**：
        写进白名单的工具在状态不允许时照样不下发（例如规划态永远没有付费工具）。权限 `agent:read`。
      responses:
        '200':
          description: 工具与变量
          content:
            application/json:
              schema:
                type: object
                required: [items, vars]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAgentTool' }
                  vars:
                    type: array
                    items: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/agent/model-options:
    get:
      tags: [admin-agent]
      operationId: adminListAgentModelOptions
      security: [{ adminBearer: [] }]
      description: 绑定模型的候选（模型目录全部模型，含停用的；推理模型只能选 `agentCapable` 的文本模型）。权限 `agent:read`。
      responses:
        '200':
          description: 模型候选
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
