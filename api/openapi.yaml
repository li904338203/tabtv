          properties:
            video: { type: string }
            image: { type: string }
            reasoning: { type: string }
        isQuickEntry: { type: boolean }
        sort: { type: integer }
        isEnabled: { type: boolean }
        version: { type: integer, description: 乐观锁；附属文档的增删改也会推进它 }
        scenes: { type: array, items: { $ref: '#/components/schemas/AgentSkillScene' } }
        inputSlots: { type: array, items: { $ref: '#/components/schemas/MarketingSlotDecl' } }
        prefillText: { type: string }
        isBatch: { type: boolean, description: 批量标识（MKT-T-32）；只用于展示，不是计费依据 }
        isBuiltin: { type: boolean, description: 随应用附带的内置技能（可「恢复内置版本」，TT-T-19） }
        isUserModified: { type: boolean, description: 内置技能被用户改过；改过之后启动时不再被内置内容覆盖 }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AdminAgentSkillWarning' }
