        code: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$', description: 创建后不能改 }
        name: { type: string, maxLength: 64 }
        category: { type: string, maxLength: 32 }
        description: { type: string, maxLength: 500 }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 16 } }
        coverMediaId: { type: [string, 'null'], pattern: '^[0-9]*$' }
        body: { type: string }
        steps: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AdminAgentSkillStep' } }
        tools: { type: array, items: { type: string } }
        modelBindings: { $ref: '#/components/schemas/AdminAgentSkillBindings' }
        isQuickEntry: { type: boolean }
        sort: { type: integer, minimum: 0, maximum: 100000 }
        scenes:
          type: array
          items: { $ref: '#/components/schemas/AgentSkillScene' }
          description: 不带 = 修改时保留原值（旧表单不会清掉它）；[] = 只在通用场景
        inputSlots:
          type: array
          items: { $ref: '#/components/schemas/MarketingSlotDecl' }
          description: 不带 = 修改时保留原值；[] = 清空
        prefillText: { type: string, maxLength: 200, description: 不带 = 修改时保留原值 }
        isBatch: { type: boolean, description: 批量标识（MKT-T-32）；不带 = 修改时保留原值（新建为 false） }

    AdminAgentSkillReferenceInput:
